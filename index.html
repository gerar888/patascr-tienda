<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch,
  disableNetwork, enableNetwork
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyACy5Q_HgwBBpMmiEaLWZBKgUWB55cLT1A",
  authDomain: "patascr-tienda.firebaseapp.com",
  projectId: "patascr-tienda",
  storageBucket: "patascr-tienda.firebasestorage.app",
  messagingSenderId: "540036190381",
  appId: "1:540036190381:web:9736a05264926960e6b624"
};

const TIENDA = "patascr"; // si algún día abrís otra sucursal, cambiás esto
const BASE_DATOS = "default"; // nombre de la base en Firestore (el del desplegable junto a "Database")

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }),
  experimentalForceLongPolling: true
}, BASE_DATOS);
const auth = getAuth(app);

const ruta = (col) => collection(db, "tiendas", TIENDA, col);

window.FB = {
  proyecto: firebaseConfig.projectId,
  diagnostico: async () => {
    const u = auth.currentUser;
    let token = null;
    try { token = u ? await u.getIdToken() : null; } catch (e) {}
    const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/${BASE_DATOS}/documents/tiendas?pageSize=1`;
    try {
      const r = await fetch(url, { headers: token ? { Authorization: "Bearer " + token } : {} });
      const cuerpo = await r.text();
      return { status: r.status, cuerpo: cuerpo.slice(0, 400) };
    } catch (e) {
      return { status: 0, cuerpo: String(e.message || e) };
    }
  },
  entrar: (correo, clave) => signInWithEmailAndPassword(auth, correo, clave),
  salir: () => signOut(auth),
  observarSesion: (cb) => onAuthStateChanged(auth, cb),
  escuchar: (col, cb, onErr) =>
    onSnapshot(ruta(col), { includeMetadataChanges: true },
      (snap) => { cb(snap.docs.map((d) => ({ ...d.data(), id: d.id })), snap.metadata.fromCache); },
      (err) => { console.error("Error leyendo " + col, err); onErr && onErr(err); }
    ),
  guardar: (col, obj) => setDoc(doc(ruta(col), obj.id), obj, { merge: true }),
  borrar: (col, id) => deleteDoc(doc(ruta(col), id)),
  guardarLote: async (col, arr, onProgreso) => {
    const TANDA = 20;
    for (let i = 0; i < arr.length; i += TANDA) {
      const trozo = arr.slice(i, i + TANDA);
      const b = writeBatch(db);
      trozo.forEach((o) => b.set(doc(ruta(col), o.id), o, { merge: true }));
      await b.commit();
      if (onProgreso) onProgreso(Math.min(i + TANDA, arr.length), arr.length);
      await new Promise((r) => setTimeout(r, 150));
    }
  },
  reconectar: async () => { await disableNetwork(db); await enableNetwork(db); }
};
window.dispatchEvent(new Event("fb-listo"));
</script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useRef } = React;

/* ================= helpers ================= */
const C = (n) => {
  const v = n || 0;
  const conDec = Math.abs(v % 1) > 0.004;
  return "₡" + v.toLocaleString("es-CR", { minimumFractionDigits: conDec ? 2 : 0, maximumFractionDigits: conDec ? 2 : 0 });
};
const UID = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hoyISO = () => new Date().toLocaleDateString("en-CA");
const mesDe = (iso) => (iso || "").slice(0, 7);
const fmtFecha = (iso) => { const [y,m,d] = (iso||"").split("-"); return `${+d}/${+m}/${y}`; };
const nombreDia = (iso) => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("es-CR", { weekday: "long" }); };
const titulo = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
const diasDesde = (ms) => Math.floor((Date.now() - ms) / 86400000);
const diasEntre = (a, b) => Math.round(Math.abs(new Date(a) - new Date(b)) / 86400000);
const num = (v) => {
  /* un número ya es un número: parsearlo de nuevo lo corrompe, porque
     0.5291005291005291 parecería llevar separador de miles */
  if (typeof v === "number") return isFinite(v) ? v : 0;
  let t = String(v == null ? "" : v).replace(/[^\d.,-]/g, "").trim();
  if (!t) return 0;
  const neg = t.startsWith("-");
  t = t.replace(/-/g, "");
  const ultComa = t.lastIndexOf(","), ultPunto = t.lastIndexOf(".");
  let dec = -1;
  if (ultComa > -1 && ultPunto > -1) dec = Math.max(ultComa, ultPunto);
  else if (ultComa > -1) dec = (t.length - ultComa - 1) <= 2 && t.indexOf(",") === ultComa ? ultComa : -1;
  else if (ultPunto > -1) dec = (t.length - ultPunto - 1) <= 2 && t.indexOf(".") === ultPunto ? ultPunto : -1;
  const entero = (dec > -1 ? t.slice(0, dec) : t).replace(/[.,]/g, "");
  const frac = dec > -1 ? t.slice(dec + 1).replace(/[.,]/g, "") : "";
  const n = parseFloat(entero + (frac ? "." + frac : "")) || 0;
  return neg ? -n : n;
};

/* ---------- compras a crédito ----------
   La mercadería llega hoy pero la plata sale cuando se paga. Para inventario
   cuenta desde que entra; para el banco y la caja, solo cuando se paga. */
const salioPlata = (g) => !g.credito || !!g.pagado;
const fechaPlata = (g) => (g.credito && g.pagado && g.fechaPago) ? g.fechaPago : g.fecha;
const normPlata = (lista) => lista.filter(salioPlata).map((g)=>({ ...g, fecha: fechaPlata(g) }));
const porVencer = (lista) => lista.filter((g)=>g.credito && !g.pagado)
  .map((g)=>({ ...g, dias: g.vence ? Math.round((new Date(g.vence+"T12:00") - new Date(hoyISO()+"T12:00"))/86400000) : null }))
  .sort((a,b)=>(a.vence||"9999") < (b.vence||"9999") ? -1 : 1);

const CATS = ["Mercadería", "Empaque", "Alquiler", "Servicios", "Transporte", "Marketing", "Impuestos", "Otro"];
const PAGOS = ["Efectivo", "SINPE", "Tarjeta", "Otro"];
const CFG_DEF = { id: "general", meta: 140000, costoPct: 80, excluirDomingos: true, margenGranel: 20, margenSaco: 15, fondoCaja: 20000, saldoBanco: 0, diasTarjeta: 1, inventarioIni: 0, semanasColchon: 4, colchonPctMin: 10, socios: 2, costoSinIVA: true, tarifaIVA: 13, gananciaDef: 20, regimen: "simplificado", impuestoCompras: 0, margenNoIdent: 18 };

/* ---------- convención única de IVA ----------
   Los costos se guardan SIN IVA (así vienen en el XML y así se acreditan).
   Los precios de venta se digitan CON IVA, que es lo que paga el cliente.
   Para comparar peras con peras, todo margen le quita el IVA al precio primero.
   Si se cambia a costos CON IVA en Ajustes, deja de restarse en ambos lados. */
const IVA = { neto: true, tarifa: 13 };
const aplicarIVA = (cfg) => {
  /* Régimen simplificado: no se cobra IVA en la venta y el de las compras no se
     acredita, va dentro del costo. Toda la aritmética de IVA queda apagada. */
  const simplificado = !cfg || cfg.regimen !== "tradicional";
  IVA.neto = simplificado ? false : (cfg.costoSinIVA !== false);
  IVA.tarifa = cfg && cfg.tarifaIVA != null ? cfg.tarifaIVA : 13;
};
const sinIVA = (m) => (IVA.neto && IVA.tarifa > 0 ? m/(1 + IVA.tarifa/100) : m);
const conIVA = (m) => (IVA.neto && IVA.tarifa > 0 ? m*(1 + IVA.tarifa/100) : m);

const margen = (precio, costo) => { const p = sinIVA(precio); return p > 0 ? ((p - costo) / p) * 100 : null; };
const partes = (t) => (t || "").split(/\s*\+\s*/).map((s) => s.trim()).filter(Boolean);
const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();

/* similitud entre dos textos: 0 a 1, por palabras compartidas */
function similitud(a, b) {
  const pa = norm(a).split(" ").filter((w) => w.length > 2);
  const pb = norm(b).split(" ").filter((w) => w.length > 2);
  if (!pa.length || !pb.length) return 0;
  const comunes = pa.filter((w) => pb.some((x) => x.startsWith(w) || w.startsWith(x))).length;
  return comunes / Math.max(pa.length, pb.length);
}

/* candidatos ordenados por parecido, para la pantalla de enlaces */
function candidatos(txt, precios, n = 3) {
  return precios
    .map((p) => ({ p, score: similitud(txt, p.nombre) }))
    .filter((x) => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, n);
}

/* identifica el producto: primero por enlace guardado, después por parecido */
function identificar(txt, precios, enlaces) {
  const k = norm(txt);
  const en = enlaces.find((e) => e.id === k || norm(e.texto || "") === k);
  if (en) {
    if (en.ignorar) return { ignorado: true };
    const p = precios.find((x) => x.id === en.productoId);
    if (p) return { p, seguro: true };
  }
  const c = candidatos(txt, precios, 1)[0];
  if (c && c.score >= 0.6) return { p: c.p, seguro: false };
  return {};
}

/* deduce si el monto corresponde a saco completo o a granel, y calcula el costo */
function costoDeVenta(p, monto) {
  if (!p || monto <= 0) return null;
  const costoKilo = p.peso > 0 ? p.costo / p.peso : 0;

  const opciones = [];
  if (p.precioSaco > 0) {
    const n = monto / p.precioSaco;
    const redondo = Math.round(n);
    if (redondo >= 1) opciones.push({ tipo: "saco", cantidad: redondo, costo: redondo * p.costo, error: Math.abs(n - redondo) / n });
  }
  if (p.precioKilo > 0 && costoKilo > 0) {
    const kilos = monto / p.precioKilo;
    opciones.push({ tipo: "granel", cantidad: kilos, costo: kilos * costoKilo, error: 0.5 });
  }
  if (!opciones.length) return null;

  /* si el monto calza casi exacto con sacos completos, gana el saco */
  const saco = opciones.find((o) => o.tipo === "saco" && o.error < 0.05);
  const elegida = saco || opciones.sort((a, b) => a.error - b.error)[0];
  if (!(elegida.costo > 0) || elegida.costo >= monto * 1.5) return null;
  return elegida;
}

/* ================= UI base ================= */
const Card = ({ children, className = "" }) => (
  <div className={"bg-white border border-[var(--line-strong)] rounded-[10px] " + className}>{children}</div>
);

const BTN = {
  primary:   "bg-[var(--ink)] text-[#F2F3F0] border-[var(--ink)] active:bg-[#0E1614]",
  ghost:     "bg-white text-[var(--ink)] border-[var(--line-strong)] active:bg-[rgba(22,33,28,.07)]",
  signal:    "bg-[var(--signal)] text-white border-[var(--signal)] active:bg-[var(--signal-2)]",
  /* alias histórico: la acción de commit va en signal, nunca en attention */
  warn:      "bg-[var(--signal)] text-white border-[var(--signal)] active:bg-[var(--signal-2)]",
  attention: "bg-white text-[var(--ink)] border-[var(--attention)] active:bg-[rgba(232,163,23,.14)]",
};
const Btn = ({ children, onClick, kind = "primary", className = "", disabled }) => (
  <button onClick={onClick} disabled={disabled}
    className={`f-head inline-flex items-center justify-center gap-2 px-3 min-h-[48px] rounded-[8px] border disabled:opacity-40 ${BTN[kind] || BTN.primary} ${className}`}>
    {children}
  </button>
);

const Lbl = ({ children }) => <span className="f-head block text-[11px] text-[var(--muted)] mb-1.5">{children}</span>;

const Inp = React.forwardRef((props, ref) => <input ref={ref} {...props} className={"w-full px-3 min-h-[48px] rounded-[8px] border border-[var(--line-strong)] bg-white text-[var(--ink)] placeholder:text-[var(--muted)] focus:outline-none focus:border-[var(--signal)] focus:ring-2 focus:ring-[var(--signal)] " + (props.className || "")} />);

/* Monto: la dirección del dinero va por signo y posición, nunca por color.
   dir="in" → «+ ₡ 12 450» en ink · dir="out" → «− ₡ 3 200» en muted · flecha opcional para listas mixtas */
const Monto = ({ v, dir = null, flecha = false, className = "" }) => (
  <span className={"f-mono text-right whitespace-nowrap " + (dir === "out" ? "text-[var(--muted)] " : "text-[var(--ink)] ") + className}>
    {flecha && dir ? (dir === "in" ? "▲ " : "▼ ") : ""}{dir === "in" ? "+ " : dir === "out" ? "− " : ""}{v}
  </span>
);

const Linea = ({ label, val, fuerte }) => (
  <div className="flex justify-between items-baseline gap-3 text-[13px]">
    <span className={fuerte ? "font-medium text-[var(--ink)]" : "text-[var(--muted)]"}>{label}</span>
    <span className={"f-mono text-right " + (fuerte ? "text-[var(--ink)] font-semibold" : "text-[var(--ink)]")}>{val}</span>
  </div>
);

const Chip = ({ children, onClick, activo, className = "" }) => (
  <button onClick={onClick} className={"f-head tap-44 text-[11px] px-3.5 rounded-full border " + (activo ? "bg-[var(--ink)] text-[#F2F3F0] border-[var(--ink)] " : "bg-white text-[var(--ink)] border-[var(--line-strong)] active:bg-[rgba(22,33,28,.07)] ") + className}>{children}</button>
);
const Modal = ({ title, onClose, children }) => (
  <div className="fixed inset-0 z-50 bg-stone-900/60 flex items-end sm:items-center justify-center" onClick={onClose}>
    <div className="bg-white w-full sm:max-w-lg rounded-t-xl sm:rounded-xl max-h-[92vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
      <div className="sticky top-0 bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between">
        <h3 className="font-semibold">{title}</h3>
        <button onClick={onClose} className="text-stone-500 text-xl px-2">×</button>
      </div>
      <div className="p-4">{children}</div>
    </div>
  </div>
);
const ind = (m, meta) => {
  if (m === null || !isFinite(m)) return { s: "—", t: "Falta precio" };
  if (m >= meta + 8) return { s: "★", t: "Sobre la meta" };
  if (m >= meta) return { s: "○", t: "En meta" };
  if (m >= meta - 4) return { s: "◐", t: "Apenas debajo" };
  return { s: "●", t: "Margen muy bajo" };
};

/* ================= datos en vivo ================= */
function useColeccion(col, sesion) {
  const [datos, setDatos] = useState([]);
  const [cache, setCache] = useState(false);
  const [error, setError] = useState(null);
  useEffect(() => {
    if (!sesion) return;
    setError(null);
    return window.FB.escuchar(
      col,
      (d, fromCache) => { setDatos(d); setCache(fromCache); setError(null); },
      (e) => setError(e.code || "error")
    );
  }, [col, sesion]);
  return [datos, cache, error];
}

/* ================= App ================= */
function App() {
  const [fbListo, setFbListo] = useState(!!window.FB);
  const [sesion, setSesion] = useState(undefined);
  const [tab, setTab] = useState("registrar");
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (fbListo) return;
    const h = () => setFbListo(true);
    window.addEventListener("fb-listo", h);
    return () => window.removeEventListener("fb-listo", h);
  }, [fbListo]);

  useEffect(() => { if (fbListo) return window.FB.observarSesion((u) => setSesion(u || null)); }, [fbListo]);

  const [ventas, offline, errVentas] = useColeccion("ventas", sesion);
  const [gastos] = useColeccion("gastos", sesion);
  const [precios] = useColeccion("precios", sesion);
  const [fijos] = useColeccion("fijos", sesion);
  const [enlaces] = useColeccion("enlaces", sesion);
  const [cierres] = useColeccion("cierres", sesion);
  const [movs] = useColeccion("movimientos", sesion);
  const [cfgArr] = useColeccion("config", sesion);
  const cfg = { ...CFG_DEF, ...(cfgArr[0] || {}) };
  aplicarIVA(cfg);   /* una sola convención de IVA para toda la app */

  const aviso = (t) => { setToast(t); setTimeout(() => setToast(null), 2000); };
  const guardar = async (col, obj) => { try { await window.FB.guardar(col, obj); } catch (e) { aviso("No se pudo guardar: " + e.code); } };
  const borrar = async (col, id) => { try { await window.FB.borrar(col, id); } catch (e) { aviso("No se pudo borrar"); } };

  if (!fbListo || sesion === undefined) return <div className="min-h-screen flex items-center justify-center text-stone-500 text-sm">Conectando…</div>;
  if (!sesion) return <Login aviso={aviso} toast={toast} />;

  const totalHoy = ventas.filter((v) => v.fecha === hoyISO()).reduce((a, v) => a + v.monto, 0);
  const nHoy = ventas.filter((v) => v.fecha === hoyISO()).length;
  const gastoHoy = gastos.filter((g) => g.fecha === hoyISO()).reduce((a, g) => a + g.monto, 0);

  const TABS = [["registrar","Registrar"],["historial","Historial"],["dinero","Dinero"],["precios","Precios"],["reportes","Reportes"],["analisis","Análisis"]];
  const estado = errVentas ? "● sin acceso" : offline ? "◐ sin conexión" : "○ sincronizado";

  return (
    <div className="min-h-screen text-stone-900 pb-24 lg:pb-0 lg:flex">

      {/* ---------- barra lateral, solo en pantalla grande ---------- */}
      <aside className="hidden lg:flex lg:flex-col lg:w-60 lg:shrink-0 bg-[var(--ink)] text-[#F2F3F0] lg:h-screen lg:sticky lg:top-0">

function AvisoOffline() {
  const [rato, setRato] = useState(false);
  const [res, setRes] = useState(null);
  const [probando, setProbando] = useState(false);
  useEffect(() => { const t = setTimeout(() => setRato(true), 8000); return () => clearTimeout(t); }, []);
  if (!rato) return null;

  const probar = async () => { setProbando(true); setRes(await window.FB.diagnostico()); setProbando(false); };

  const lectura = (s) => {
    if (s === 200) return "La red sí llega a Firestore y los permisos están bien. El problema es el canal en tiempo real: cerrá y volvé a abrir la app, y si sigue, probá otro navegador.";
    if (s === 0) return "La petición ni salió del navegador. La está bloqueando una extensión (bloqueador de anuncios o rastreo) o la red. Probá en incógnito con extensiones desactivadas, o desde los datos del celular.";
    if (s === 403) return "La red llega pero el acceso está denegado. Revisá las reglas de Firestore, o que la API de Cloud Firestore esté habilitada en el proyecto.";
    if (s === 404) return "El proyecto responde pero no encuentra la base de datos (default). Es probable que tu base tenga otro nombre: revisá el desplegable al lado de 'Database' en la consola de Firestore.";
    if (s === 401) return "El token de sesión no se aceptó. Cerrá sesión y volvé a entrar.";
    return "Respuesta inesperada. Mandame el código y el texto de abajo.";
  };

  return (
    <div className="border-2 border-stone-900 rounded-lg p-3 mb-3 bg-white">
      <div className="text-sm font-medium mb-1">● Lleva rato sin poder conectarse</div>
      <p className="text-[12px] text-stone-700 leading-relaxed">
        Lo que registrés queda guardado solo en este dispositivo hasta que vuelva la conexión, y en los otros teléfonos no aparece.
        <br /><br />
        Proyecto configurado: <span className="font-mono">{window.FB.proyecto}</span>
      </p>
      <div className="flex gap-2 mt-2">
        <Btn kind="ghost" className="text-xs py-1.5" onClick={probar} disabled={probando}>
          {probando ? "Probando…" : "Probar conexión"}
        </Btn>
        <Btn kind="ghost" className="text-xs py-1.5" onClick={() => window.FB.reconectar()}>
          Reintentar conexión
        </Btn>
      </div>
      {res && (
        <div className="mt-3 border-t border-stone-200 pt-2">
          <div className="font-mono text-[12px] mb-1">Código: {res.status === 0 ? "sin respuesta" : res.status}</div>
          <p className="text-[12px] text-stone-700 leading-relaxed mb-2">{lectura(res.status)}</p>
          <details>
            <summary className="text-[11px] text-stone-500 cursor-pointer">Ver detalle técnico</summary>
            <pre className="text-[10px] whitespace-pre-wrap mt-1 text-stone-600">{res.cuerpo}</pre>
          </details>
        </div>
      )}
    </div>
  );
}

/* ---------- presentaciones vendibles de un artículo ---------- */
function presentaciones(p) {
  const out = [], esU = p.unidad === "u", peso = num(p.peso), costo = num(p.costo);
  const pk = num(p.precioKilo), ps = num(p.precioSaco);
  if (pk > 0) out.push({
    id: esU ? "unidad" : "kg",
    label: esU ? "Por unidad" : "Por kilo",
    suf: esU ? "u" : "kg",
    precio: pk,
    costoUnit: esU ? (peso > 0 ? costo/peso : costo) : (peso > 0 ? costo/peso : 0),
    kgPorUnidad: 1,
  });
  if (ps > 0) out.push({
    id: "saco",
    label: `Empaque de ${peso}${esU ? " u" : " kg"}`,
    suf: "emp",
    precio: ps,
    costoUnit: costo,
    kgPorUnidad: peso || 1,
  });
  return out;
}

/* ---------- buscador incremental ---------- */
function BuscadorProducto({ precios, onElegir, onLibre, onCerrar }) {
  const [q, setQ] = useState("");
  const ref = useRef(null);
  useEffect(()=>{ if (ref.current) ref.current.focus(); }, []);

  const res = useMemo(()=>{
    const t = norm(q);
    const lista = [...precios].filter((p)=>num(p.precioKilo) > 0 || num(p.precioSaco) > 0);
    if (!t) return lista.sort((a,b)=>a.nombre.localeCompare(b.nombre)).slice(0, 8);
    return lista
      .map((p)=>{
        const n = norm(p.nombre);
        const s = n.startsWith(t) ? 3 : n.includes(t) ? 2 : similitud(q, p.nombre);
        return { p, s };
      })
      .filter((x)=>x.s > 0.34)
      .sort((a,b)=>b.s - a.s)
      .slice(0, 8)
      .map((x)=>x.p);
  }, [q, precios]);

  return (
    <div className="rounded-[10px] border-2 border-[var(--ink)] bg-white p-2.5">
      <div className="flex items-center gap-2 mb-2">
        <Inp ref={ref} value={q} onChange={(e)=>setQ(e.target.value)} placeholder="Escribí las primeras letras…" />
        <button onClick={onCerrar} className="f-head text-[10px] text-[var(--muted)] px-2 min-h-[44px]">Cerrar</button>
      </div>

      {res.length === 0 ? (
        <p className="text-[13px] text-[var(--muted)] px-1 py-2">
          Ningún artículo calza con eso. Podés cobrarlo suelto y después agregarlo a Precios.
        </p>
      ) : (
        <div className="divide-y divide-[var(--line)] max-h-64 overflow-y-auto">
          {res.map((p)=>{
            const pres = presentaciones(p);
            return (
              <button key={p.id} onClick={()=>onElegir(p)} className="w-full text-left py-2 px-1 active:bg-[rgba(22,33,28,.06)]">
                <div className="text-[14px] truncate">{p.nombre}</div>
                <div className="f-mono text-[11px] text-[var(--muted)]">
                  {pres.map((x)=>`${C(x.precio)} ${x.suf === "emp" ? "el empaque" : "por " + x.suf}`).join("  ·  ")}
                </div>
              </button>
            );
          })}
        </div>
      )}

      <button onClick={()=>onLibre(q)} className="f-head w-full text-[10px] text-[var(--signal)] border border-[var(--line-strong)] rounded-[8px] min-h-[44px] mt-2">
        Cobrar algo que no está en la lista
      </button>
    </div>
  );
}

/* ---------- una línea de la venta ---------- */
/* Se puede entrar por peso ("un kilo y medio") o por plata ("800 de balance"),
   que es como lo pide la gente en el mostrador. La app completa el otro lado. */
const MONTOS_RAPIDOS = [500, 1000, 2000, 3000, 5000];

function LineaVenta({ it, precios, onCambiar, onQuitar }) {
  const p = precios.find((x)=>x.id === it.productoId);
  const pres = p ? presentaciones(p) : [];
  const libre = it.modo === "libre";
  const actual = pres.find((k)=>k.id === it.modo);
  const porMonto = it.entrada === "monto";
  const granel = it.modo === "kg" || it.modo === "unidad";

  const recalcular = (base) => {
    const x = pres.find((k)=>k.id === (base.modo || it.modo));
    if (libre || !x) {
      const m = num(base.total != null ? base.total : it.total);
      return { ...it, ...base, total: m, precioUnit: m, cantidad: "1", costo: null, kg: 0 };
    }
    const pu = num(base.precioUnit != null ? base.precioUnit : it.precioUnit) || x.precio;
    let cant, total;
    if ((base.entrada || it.entrada) === "monto") {
      total = num(base.total != null ? base.total : it.total);
      cant = pu > 0 ? total/pu : 0;
    } else {
      cant = num(base.cantidad != null ? base.cantidad : it.cantidad);
      total = cant * pu;
    }
    return { ...it, ...base, precioUnit: pu, cantidad: cant, total, costo: cant * x.costoUnit, kg: cant * x.kgPorUnidad };
  };

  const cantTexto = it.entrada === "monto"
    ? (num(it.cantidad) > 0 ? num(it.cantidad).toFixed(2) : "")
    : (it.cantidad === "" ? "" : String(it.cantidad));

  return (
    <div className="border border-[var(--line-strong)] rounded-[10px] p-2.5">
      <div className="flex items-start justify-between gap-2 mb-2">
        <span className="text-[14px] leading-snug min-w-0">{it.nombre}</span>
        <button onClick={onQuitar} className="text-[var(--muted)] text-xl leading-none px-2 shrink-0">×</button>
      </div>

      {!libre && pres.length > 1 && (
        <div className="flex flex-wrap gap-1.5 mb-2">
          {pres.map((x)=>(
            <Chip key={x.id} activo={it.modo === x.id}
              onClick={()=>onCambiar(recalcular({ modo: x.id, precioUnit: x.precio }))}>{x.label}</Chip>
          ))}
        </div>
      )}

      {!libre && granel && (
        <div className="grid grid-cols-2 gap-1.5 mb-2">
          {[["cant", it.modo === "unidad" ? "Por unidades" : "Por peso"], ["monto","Por plata"]].map(([id,l])=>(
            <button key={id} onClick={()=>onCambiar(recalcular({ entrada: id }))} aria-pressed={porMonto === (id==="monto")}
              className={"f-head text-[10px] min-h-[40px] rounded-[8px] border " + ((it.entrada||"cant") === id
                ? "bg-[var(--ink)] text-[#F2F3F0] border-[var(--ink)]"
                : "bg-white text-[var(--ink)] border-[var(--line-strong)]")}>{l}</button>
          ))}
        </div>
      )}

      {porMonto && !libre ? (
        <React.Fragment>
          <div className="grid grid-cols-[1fr_auto] gap-2 items-end">
            <div>
              <span className="f-head block text-[9px] text-[var(--muted)] mb-1">Cuánto pidió</span>
              <Inp inputMode="decimal" value={it.total === 0 ? "" : it.total}
                onChange={(e)=>onCambiar(recalcular({ total: e.target.value }))}
                placeholder="800" className="f-mono text-center text-[18px]" />
            </div>
            <div className="text-right pb-3">
              <div className="f-mono text-[19px]">{cantTexto || "0"} {it.modo === "unidad" ? "u" : "kg"}</div>
              <div className="f-head text-[9px] text-[var(--muted)]">hay que pesar</div>
            </div>
          </div>
          <div className="flex flex-wrap gap-1.5 mt-2">
            {MONTOS_RAPIDOS.map((m)=>(
              <Chip key={m} onClick={()=>onCambiar(recalcular({ total: m }))}>{C(m)}</Chip>
            ))}
          </div>
        </React.Fragment>
      ) : (
        <div className="grid grid-cols-[1fr_1fr_auto] gap-2 items-end">
          <div>
            <span className="f-head block text-[9px] text-[var(--muted)] mb-1">
              {libre ? "Cantidad" : it.modo === "saco" ? "Empaques" : it.modo === "unidad" ? "Unidades" : "Kilos"}
            </span>
            <Inp inputMode="decimal" value={cantTexto}
              onChange={(e)=>onCambiar(recalcular({ cantidad: e.target.value, entrada: "cant" }))}
              className="f-mono text-center" />
          </div>
          <div>
            <span className="f-head block text-[9px] text-[var(--muted)] mb-1">{libre ? "Monto" : "Precio unit."}</span>
            <Inp inputMode="decimal" value={libre ? (it.total === 0 ? "" : it.total) : it.precioUnit}
              onChange={(e)=>onCambiar(recalcular(libre ? { total: e.target.value } : { precioUnit: e.target.value }))}
              className="f-mono text-center" />
          </div>
          <div className="text-right pb-3">
            <span className="f-mono text-[17px]">{C(num(it.total))}</span>
          </div>
        </div>
      )}

      {!libre && it.costo > 0 && num(it.total) > 0 && (
        <div className="f-mono text-[10px] text-[var(--muted)] text-right mt-1">
          {porMonto ? `cobrás ${C(num(it.total))} · ` : ""}deja {C(num(it.total) - it.costo)} · {(((num(it.total) - it.costo)/num(it.total))*100).toFixed(0)}%
        </div>
      )}
    </div>
  );
}

function VentaForm({ ventas, gastos, precios, enlaces, cierres, cfg, guardar, aviso, usuario }) {
  const [fecha, setFecha] = useState(hoyISO());
  const [prod, setProd] = useState("");
  const [monto, setMonto] = useState("");
  const [cliente, setCliente] = useState("");
  const [pago, setPago] = useState("Efectivo");
  const [importar, setImportar] = useState(false);
  const [cerrarCaja, setCerrarCaja] = useState(false);
  const [verFecha, setVerFecha] = useState(false);
  const [items, setItems] = useState([]);
  const [buscando, setBuscando] = useState(false);
  const [porLinea, setPorLinea] = useState(true);
  const [ajustando, setAjustando] = useState(false);
  const montoRef = useRef(null);

  const totalItems = items.reduce((a,i)=>a + num(i.total), 0);
  const hayLineas = porLinea && items.length > 0;
  const ajustado = hayLineas && Math.abs(num(monto) - totalItems) > 0.5;

  /* el total de las líneas manda sobre el readout, salvo que se toque a mano */
  useEffect(()=>{
    if (!porLinea || ajustando) return;
    setMonto(items.length ? String(Math.round(totalItems*100)/100) : "");
  }, [totalItems, items.length, porLinea, ajustando]);

  /* al cambiar de modo se limpia el otro, para que nunca haya dos verdades */
  const cambiarModo = (v) => {
    setPorLinea(v); setAjustando(false);
    if (v) { setProd(""); setMonto(""); }
    else { setItems([]); setMonto(""); setTimeout(()=>montoRef.current && montoRef.current.focus(), 0); }
  };
  const quitarAjuste = () => { setAjustando(false); setMonto(String(Math.round(totalItems*100)/100)); };

  const agregarProducto = (p) => {
    const pres = presentaciones(p)[0];
    setItems((xs)=>[...xs, {
      productoId: p.id, nombre: p.nombre, modo: pres.id, entrada: "cant", cantidad: "1",
      precioUnit: pres.precio, total: pres.precio, costo: pres.costoUnit, kg: pres.kgPorUnidad,
    }]);
    setBuscando(false);
  };
  const agregarLibre = (txt) => {
    setItems((xs)=>[...xs, {
      productoId: null, nombre: (txt || "").trim() || "Otro", modo: "libre",
      cantidad: "1", precioUnit: "", total: 0, costo: 0, kg: 0,
    }]);
    setBuscando(false);
  };

  /* precio de referencia del último producto escrito */
  const refPrecio = useMemo(()=>{
    const ps = partes(prod);
    if (!ps.length) return null;
    const r = identificar(ps[ps.length-1], precios || [], enlaces || []);
    return r.p || null;
  }, [prod, precios, enlaces]);

  const productosPrev = useMemo(() => { const s = new Set(); ventas.forEach((v) => partes(v.producto).forEach((p) => s.add(p))); return [...s].sort(); }, [ventas]);
  const clientesPrev = useMemo(() => [...new Set(ventas.map((v) => v.cliente).filter(Boolean))].sort(), [ventas]);
  const recientes = useMemo(() => {
    const c = {};
    [...ventas].sort((a,b)=>(b.creado||0)-(a.creado||0)).slice(0,60).forEach((v) => partes(v.producto).forEach((p) => (c[p] = (c[p]||0)+1)));
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6).map((x)=>x[0]);
  }, [ventas]);

  const delDia = ventas.filter((v) => v.fecha === fecha).sort((a,b)=>(b.creado||0)-(a.creado||0));
  const totalDia = delDia.reduce((a,v)=>a+v.monto,0);
  const esHoy = fecha === hoyISO();
  const yaCerrado = (cierres || []).some((c)=>c.fecha === fecha);
  const faltante = porLinea
    ? (!items.length ? "Agregá al menos un producto"
       : items.some((i)=>num(i.total) <= 0) ? "Alguna línea va en cero"
       : null)
    : (!monto ? "Falta el monto" : !prod.trim() ? "Falta el producto" : null);

  /* los dígitos se asientan al escribir; React no vuelve a tocar className si no cambió */
  const escribirMonto = (e) => {
    setMonto(e.target.value);
    const el = montoRef.current;
    if (el) { el.classList.remove("asentar"); void el.offsetWidth; el.classList.add("asentar"); }
  };

  const registrar = async () => {
    const m = num(monto);
    let doc = { id: UID(), creado: Date.now(), fecha, monto: m, cliente: cliente.trim(), pago, usuario };

    if (porLinea && items.length) {
      /* factor de ajuste: si el cobro se editó a mano, se reparte proporcional
         para que las líneas sigan sumando el monto realmente cobrado */
      const f = totalItems > 0 ? m/totalItems : 1;
      const limpias = items.map((i)=>({
        productoId: i.productoId || null,
        nombre: i.nombre,
        modo: i.modo,
        entrada: i.entrada || "cant",
        cantidad: num(i.cantidad),
        precioUnit: num(i.precioUnit),
        total: num(i.total) * f,
        costo: i.modo === "libre" ? null : (i.costo || 0) * (num(i.cantidad) > 0 ? 1 : 0),
        kg: i.kg || 0,
      }));
      doc.items = limpias;
      doc.producto = limpias.map((i)=>i.nombre).join(" + ");
    } else {
      doc.producto = prod.trim();
    }

    await guardar("ventas", doc);
    setProd(""); setMonto(""); setCliente(""); setItems([]); setAjustando(false);
    aviso("Cobrado · " + C(m));
    if (!porLinea && montoRef.current) montoRef.current.focus();
  };

  return (
    <div className="pb-[calc(var(--nav-h)+84px)] lg:pb-0">

      {/* ---------- contexto: la fecha va colapsada, casi siempre es hoy ---------- */}
      <div className="flex items-center justify-between gap-3 mb-2.5 px-0.5">
        <div className="flex items-center gap-2 min-w-0">
          <Chip activo={!esHoy} onClick={()=>setVerFecha((v)=>!v)}>
            {esHoy ? "Hoy" : titulo(nombreDia(fecha)).slice(0,3) + " " + fmtFecha(fecha)} {verFecha ? "▾" : "▸"}
          </Chip>
          <span className="text-[12px] text-[var(--muted)] truncate">
            {delDia.length} {delDia.length === 1 ? "venta" : "ventas"}
          </span>
        </div>
        {!esHoy && <span className="f-head text-[10px] text-[var(--ink)] shrink-0">◐ Otra fecha</span>}
      </div>

      {verFecha && (
        <Card className="p-3 mb-2.5">
          <Lbl>Fecha del registro</Lbl>
          <Inp type="date" value={fecha} onChange={(e)=>setFecha(e.target.value)} className="f-mono" />
          {!esHoy && (
            <Btn kind="ghost" className="w-full mt-2" onClick={()=>{ setFecha(hoyISO()); setVerFecha(false); }}>Volver a hoy</Btn>
          )}
        </Card>
      )}

      <Card className="p-3.5 mb-3">

        {/* ---------- cómo se cobra: define qué es el número de abajo ---------- */}
        <div className="grid grid-cols-2 gap-1.5 mb-3" role="tablist" aria-label="Forma de cobrar">
          {[[true,"Por producto"],[false,"Solo el monto"]].map(([v,l])=>(
            <button key={String(v)} role="tab" aria-selected={porLinea===v} onClick={()=>cambiarModo(v)}
              className={"f-head text-[10px] min-h-[44px] rounded-[8px] border " + (porLinea===v
                ? "bg-[var(--ink)] text-[#F2F3F0] border-[var(--ink)]"
                : "bg-white text-[var(--ink)] border-[var(--line-strong)]")}>{l}</button>
          ))}
        </div>

        {/* ---------- el readout: campo cuando se digita, resultado cuando se calcula ---------- */}
        <div className="rounded-[12px] bg-[var(--readout)] px-4 pt-3 pb-4 mb-4">
          <span className="f-head block text-[10px] text-[rgba(242,243,240,.5)] mb-2">
            {!porLinea ? "Monto de la venta" : ajustando ? "Cobro ajustado a mano" : "Total a cobrar"}
          </span>

          <div className="flex items-baseline gap-2.5">
            <span className="f-mono text-[20px] leading-none text-[var(--muted)] select-none">₡</span>
            {(!porLinea || ajustando) ? (
              <input
                ref={montoRef}
                className="readout-input"
                inputMode="decimal"
                value={monto}
                onChange={escribirMonto}
                placeholder="0"
                aria-label={porLinea ? "Cobro ajustado" : "Monto de la venta"}
              />
            ) : (
              <span className={"readout-val" + (totalItems > 0 ? "" : " vacio")}>
                {totalItems > 0 ? C(totalItems).replace("₡","") : "0"}
              </span>
            )}
          </div>

          {porLinea && (
            <div className="mt-2 flex items-center justify-between gap-3">
              <span className="f-mono text-[11px] text-[rgba(242,243,240,.55)]">
                {items.length === 0
                  ? "Se calcula solo al agregar productos"
                  : ajustando
                    ? `${items.length} ${items.length===1?"línea":"líneas"} suman ${C(totalItems)}`
                    : `${items.length} ${items.length===1?"línea":"líneas"}`}
              </span>
              {items.length > 0 && (
                ajustando
                  ? <button onClick={quitarAjuste} className="f-head text-[10px] text-[rgba(242,243,240,.75)] underline px-1 min-h-[32px]">Volver al total</button>
                  : <button onClick={()=>{ setAjustando(true); setTimeout(()=>montoRef.current && montoRef.current.focus(), 0); }}
                      className="f-head text-[10px] text-[rgba(242,243,240,.75)] underline px-1 min-h-[32px]">Ajustar cobro</button>
              )}
            </div>
          )}

          {porLinea && ajustando && Math.abs(num(monto) - totalItems) > 0.5 && (
            <div className="f-mono text-[11px] text-[var(--attention)] mt-1">
              {num(monto) < totalItems ? "descuento" : "recargo"} de {C(Math.abs(num(monto) - totalItems))}
            </div>
          )}
        </div>

        {/* ---------- producto ---------- */}
        {porLinea ? (
          <div className="space-y-2">
            {items.map((it,ix)=>(
              <LineaVenta
                key={ix}
                it={it}
                precios={precios}
                onCambiar={(nv)=>setItems((xs)=>xs.map((x,k)=>k===ix ? nv : x))}
                onQuitar={()=>setItems((xs)=>xs.filter((_,k)=>k!==ix))}
              />
            ))}

            {buscando ? (
              <BuscadorProducto
                precios={precios}
                onElegir={agregarProducto}
                onLibre={agregarLibre}
                onCerrar={()=>setBuscando(false)}
              />
            ) : (
              <button onClick={()=>setBuscando(true)}
                className="f-head w-full text-[11px] min-h-[52px] rounded-[8px] border-2 border-dashed border-[var(--line-strong)] text-[var(--signal)] active:bg-[rgba(11,93,138,.06)]">
                + Agregar producto
              </button>
            )}

            {items.length === 0 && !buscando && (
              <p className="text-[12px] text-[var(--muted)] leading-relaxed">
                Buscás el producto, ponés los kilos y la app calcula el cobro. Así queda el costo exacto y se sabe cuánto se movió de cada cosa.
              </p>
            )}
          </div>
        ) : (
          <React.Fragment>
            <Lbl>Producto</Lbl>
            <Inp list="prods" value={prod} onChange={(e)=>setProd(e.target.value)} placeholder="Nutri salmón perro" />
            <datalist id="prods">{productosPrev.map((p)=><option key={p} value={p} />)}</datalist>

            {recientes.length > 0 && (
              <div className="flex flex-wrap gap-1.5 mt-2">
                {recientes.map((p)=>(
                  <Chip key={p} onClick={()=>setProd(prod ? prod + " + " + p : p)}>{p}</Chip>
                ))}
              </div>
            )}
            <p className="text-[12px] text-[var(--muted)] mt-2">
              Modo rápido: escribís el monto y el nombre. El costo queda estimado, no exacto.
            </p>

            {refPrecio && (
              <div className="mt-2.5 rounded-[10px] border-2 border-[var(--ink)] bg-white px-3 py-2.5">
                <div className="flex items-baseline justify-between gap-2 mb-2">
                  <span className="f-head text-[10px] text-[var(--muted)]">Precio en lista</span>
                  <span className="f-head text-[10px] text-[var(--ink)] truncate max-w-[62%] text-right">{refPrecio.nombre}</span>
                </div>
                {refPrecio.precioKilo > 0 && (
                  <div className="flex items-baseline justify-between gap-3">
                    <span className="text-[12px] text-[var(--muted)]">por {refPrecio.unidad === "u" ? "unidad" : "kilo"}</span>
                    <span className="f-mono text-[17px]">{C(refPrecio.precioKilo)}</span>
                  </div>
                )}
                {refPrecio.precioSaco > 0 && (
                  <div className="flex items-baseline justify-between gap-3 mt-1">
                    <span className="text-[12px] text-[var(--muted)]">empaque de {refPrecio.peso}{refPrecio.unidad === "u" ? " u" : " kg"}</span>
                    <span className="f-mono text-[17px]">{C(refPrecio.precioSaco)}</span>
                  </div>
                )}
              </div>
            )}
          </React.Fragment>
        )}

        {/* ---------- secundarios ---------- */}
        <div className="mt-4">
          <Lbl>Cliente (opcional)</Lbl>
          <Inp list="clis" value={cliente} onChange={(e)=>setCliente(e.target.value)} placeholder="Daisy" />
          <datalist id="clis">{clientesPrev.map((c)=><option key={c} value={c} />)}</datalist>
        </div>

        <div className="mt-3">
          <Lbl>Pago</Lbl>
          <div className="grid grid-cols-4 gap-1.5">
            {PAGOS.map((p)=>(
              <button
                key={p}
                onClick={()=>setPago(p)}
                aria-pressed={pago === p}
                className={"f-head text-[10px] min-h-[48px] px-1 rounded-[8px] border " + (pago === p
                  ? "bg-[var(--ink)] text-[#F2F3F0] border-[var(--ink)]"
                  : "bg-white text-[var(--ink)] border-[var(--line-strong)] active:bg-[rgba(22,33,28,.07)]")}>
                {p}
              </button>
            ))}
          </div>
        </div>
      </Card>

      {/* ---------- ventas del día ---------- */}
      <div className="flex items-baseline justify-between px-1 mb-2">
        <span className="f-head text-[10px] text-[var(--muted)]">{esHoy ? "Ventas de hoy" : "Ventas del " + fmtFecha(fecha)}</span>
      </div>

      {delDia.length === 0 ? (
        <Card className="px-4 py-7">
          <p className="text-[14px] text-[var(--ink)]">{esHoy ? "Todavía no hay ventas hoy." : "No hay ventas anotadas en esta fecha."}</p>
          <p className="text-[12px] text-[var(--muted)] mt-1">Anotá el monto arriba y tocá Cobrar.</p>
        </Card>
      ) : (
        <Card className="divide-y divide-[var(--line)]">
          {delDia.map((v)=>(
            <div key={v.id} className="px-3 py-2.5 flex justify-between items-center gap-3">
              <div className="min-w-0">
                <div className="text-[14px] truncate">{v.producto}</div>
                <div className="text-[11px] text-[var(--muted)]">{[v.cliente, v.pago].filter(Boolean).join(" · ")}</div>
              </div>
              <Monto v={C(v.monto)} dir="in" className="text-[14px]" />
            </div>
          ))}
          <div className="px-3 py-3 flex justify-between items-baseline gap-3 bg-[var(--surface)]">
            <span className="f-head text-[10px] text-[var(--muted)]">Total del día</span>
            <Monto v={C(totalDia)} dir="in" className="text-[20px] font-semibold" />
          </div>
        </Card>
      )}

      {/* ---------- cierre de caja: acción de primer nivel ---------- */}
      <Card className="p-3 mt-3">
        <div className="flex items-baseline justify-between gap-3 mb-2.5">
          <span className="f-head text-[10px] text-[var(--muted)]">Cierre de caja</span>
          <span className="text-[12px] text-[var(--ink)]">{yaCerrado ? "○ Ya cerrada" : "◐ Sin cerrar"}</span>
        </div>
        <Btn kind="ghost" className="w-full" onClick={()=>setCerrarCaja(true)}>Cerrar caja</Btn>
      </Card>

      <div className="text-center mt-3">
        <button onClick={()=>setImportar(true)} className="tap-44 text-[12px] text-[var(--muted)] px-3">Pegar desde el Sheets</button>
      </div>

      {/* ---------- acción anclada, sobre el nav, en la zona del pulgar ---------- */}
      <div
        className="fixed inset-x-0 z-30 px-3 py-2.5 bg-[var(--surface)] border-t border-[var(--line-strong)] lg:static lg:px-0 lg:py-0 lg:mt-4 lg:bg-transparent lg:border-0"
        style={{ bottom: "var(--nav-h)" }}>
        <Btn kind="signal" className="btn-lg commit w-full" disabled={!!faltante} onClick={registrar}>
          {faltante ? faltante : (
            <span className="flex items-baseline gap-2.5">
              <span>Cobrar</span>
              <span className="f-mono text-[15px] normal-case tracking-normal">{C(num(monto))}</span>
            </span>
          )}
        </Btn>
      </div>

      {cerrarCaja && (
        <CierreModal
          fecha={fecha}
          ventas={ventas}
          gastos={gastos}
          cierres={cierres}
          cfg={cfg}
          guardar={guardar}
          usuario={usuario}
          aviso={aviso}
          onClose={()=>setCerrarCaja(false)}
        />
      )}

      {importar && <ImportarVentasModal onClose={()=>setImportar(false)} onSave={async (nuevas, prog)=>{
        await window.FB.guardarLote("ventas", nuevas.map((n)=>({ ...n, usuario })), prog);
        setImportar(false); aviso(nuevas.length + " ventas importadas");
      }} />}
    </div>
  );
}

function parseVenta(l) {
  let f = l.split("\t"); if (f.length < 3) f = l.split(/\s{2,}/); if (f.length < 3) return null;
  const [fRaw, prod, mRaw, cli, pgo] = f.map((x)=>(x||"").trim());
  const dm = fRaw.match(/(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})/); if (!dm) return null;
  const y = dm[3].length === 2 ? "20" + dm[3] : dm[3];
  const p = (pgo || "").toLowerCase();
  return {
    id: UID(), creado: Date.now(),
    fecha: `${y}-${dm[2].padStart(2,"0")}-${dm[1].padStart(2,"0")}`,
    producto: prod, monto: num(mRaw), cliente: cli || "",
    pago: p.includes("efec") ? "Efectivo" : p.includes("sinpe") ? "SINPE" : p.includes("tarj") ? "Tarjeta" : p ? "Otro" : "Efectivo"
  };
}

function ImportarVentasModal({ onClose, onSave }) {
  const [txt, setTxt] = useState("");
  const [prog, setProg] = useState(null);
  const [err, setErr] = useState(null);
  const filas = txt.split("\n").map((l)=>l.trim()).filter(Boolean).map(parseVenta).filter(Boolean);

  const subir = async () => {
    setErr(null); setProg({ hecho: 0, total: filas.length });
    try {
      await onSave(filas, (hecho, total) => setProg({ hecho, total }));
    } catch (e) {
      setErr((e.code || "error") + " · " + (e.message || ""));
      setProg(null);
    }
  };

  return (
    <Modal title="Pegar ventas desde el Sheets" onClose={onClose}>
      <p className="text-[13px] text-stone-600 mb-2 leading-relaxed">Orden esperado: fecha, producto, monto, cliente, pago.</p>
      <textarea value={txt} onChange={(e)=>setTxt(e.target.value)} rows={7} placeholder={"22/7/2026\tNutri salmon perro\t₡4,300\t\ttarjeta"} className="w-full px-3 py-2 border border-stone-300 rounded-md bg-stone-50 font-mono text-[12px]" />
      <div className="my-3 text-sm">
        {txt.trim() === "" ? <span className="text-stone-500">Esperando las filas.</span> : (
          <><Linea label="Filas reconocidas" val={String(filas.length)} fuerte /><Linea label="Suma" val={C(filas.reduce((a,f)=>a+f.monto,0))} /></>
        )}
      </div>
      {prog && (
        <div className="mb-3">
          <div className="h-2 bg-stone-200 rounded-full overflow-hidden"><div className="h-full bg-stone-900" style={{ width: (prog.hecho/prog.total*100)+"%" }} /></div>
          <div className="font-mono text-[12px] mt-1">Subiendo {prog.hecho} de {prog.total}…</div>
        </div>
      )}
      {err && <p className="text-[12px] text-stone-800 border border-stone-400 rounded-md p-2 mb-3">● Se cortó la subida: <span className="font-mono">{err}</span></p>}
      <Btn kind="warn" className="w-full py-3" disabled={!filas.length || prog} onClick={subir}>Importar {filas.length || ""}</Btn>
    </Modal>
  );
}

/* ================= CIERRE DE CAJA ================= */
function CierreModal({ fecha, ventas, gastos, cierres, cfg, guardar, usuario, aviso, onClose }) {
  const fondo = cfg.fondoCaja || 0;

  /* último cierre anterior a la fecha que se está cerrando */
  const previo = cierres.filter((c)=>c.fecha < fecha).sort((a,b)=>(a.fecha<b.fecha?-1:1)).slice(-1)[0] || null;
  const desde = previo ? previo.fecha : null;
  const enRango = (f) => f <= fecha && (!desde || f > desde);

  const monedasPrev = previo ? (previo.monedas != null ? previo.monedas : 0) : 0;
  const [billetes, setBilletes] = useState("");
  const [monedas, setMonedas] = useState(String(monedasPrev || ""));
  const [nota, setNota] = useState("");

  const efeVentas = ventas.filter((v)=>v.pago==="Efectivo" && enRango(v.fecha)).reduce((a,v)=>a+v.monto,0);
  const efeGastos = normPlata(gastos).filter((g)=>g.pago==="Efectivo" && enRango(g.fecha)).reduce((a,g)=>a+g.monto,0);
  const esperado = fondo + monedasPrev + efeVentas - efeGastos;

  const bil = num(billetes), mon = num(monedas);
  const contado = bil + mon;
  const dif = billetes === "" ? null : contado - esperado;
  const retiro = billetes === "" ? null : bil - fondo;

  const yaCerrado = cierres.find((c)=>c.fecha===fecha);
  const previos = [...cierres].sort((a,b)=>(a.fecha<b.fecha?1:-1)).slice(0,7);
  const acumulado = cierres.reduce((a,c)=>a+(c.diferencia||0),0);

  const guardarCierre = async () => {
    await guardar("cierres", {
      id: fecha, fecha, fondo, monedasPrev, billetes: bil, monedas: mon,
      esperado, contado, diferencia: contado - esperado,
      retiro: Math.max(0, bil - fondo),
      nota: nota.trim(), usuario, creado: Date.now()
    });
    aviso("Caja cerrada");
    onClose();
  };

  return (
    <Modal title={"Cerrar caja · " + fmtFecha(fecha)} onClose={onClose}>
      <div className="bg-stone-100 rounded-md p-3 mb-3 space-y-1">
        <Linea label="Fondo en billetes" val={C(fondo)} />
        {monedasPrev > 0 && <Linea label="Monedas del cierre anterior" val={"+ " + C(monedasPrev)} />}
        <Linea label={desde ? `Ventas en efectivo desde el ${fmtFecha(desde)}` : "Ventas en efectivo"} val={"+ " + C(efeVentas)} />
        <Linea label="Pagos en efectivo" val={"− " + C(efeGastos)} />
        <div className="pt-2 mt-1 border-t border-stone-300">
          <Linea label="Debería haber en total" val={C(esperado)} fuerte />
        </div>
      </div>

      <div className="mb-3">
        <Lbl>Billetes contados</Lbl>
        <Inp inputMode="decimal" value={billetes} onChange={(e)=>setBilletes(e.target.value)} placeholder="0" className="font-mono tabular-nums text-2xl" />
        <p className="text-[11px] text-stone-500 mt-1">Solo los billetes. Es lo que se puede depositar en el cajero.</p>
      </div>

      <div className="mb-3">
        <Lbl>Monedas y menudo</Lbl>
        <Inp inputMode="decimal" value={monedas} onChange={(e)=>setMonedas(e.target.value)} placeholder="0" className="font-mono tabular-nums text-lg" />
        <p className="text-[11px] text-stone-500 mt-1">
          {monedasPrev > 0
            ? `Viene puesto lo del cierre anterior (${C(monedasPrev)}). Si no las contaste, dejalo así: la diferencia de abajo va a reflejar solo los billetes.`
            : "Si no las contás, poné un aproximado. Queda en la caja, no se deposita."}
        </p>
      </div>

      {retiro !== null && retiro > 0 && (
        <div className="bg-stone-100 rounded-md p-3 mb-3">
          <Linea label={`Llevá al banco y dejá ${C(fondo)} en billetes`} val={C(retiro)} fuerte />
          <p className="text-[11px] text-stone-500 mt-1">Las {C(mon)} en monedas se quedan en la caja. Queda en "por depositar" hasta que lo registrés en Dinero.</p>
        </div>
      )}
      {retiro !== null && retiro < 0 && (
        <p className="text-[12px] text-stone-700 border border-stone-400 rounded-md p-2 mb-3">
          ● Hay menos de {C(fondo)} en billetes. Faltan {C(Math.abs(retiro))} para completar el fondo antes de abrir mañana.
        </p>
      )}

      {dif !== null && (
        <div className="border border-stone-400 rounded-md p-3 mb-3">
          <div className="flex justify-between items-baseline">
            <span className="text-sm font-medium">{Math.abs(dif) < 0.005 ? "○ Cuadra exacto" : dif > 0 ? "◐ Sobra" : "● Falta"}</span>
            <span className="font-mono tabular-nums text-xl font-semibold">{C(Math.abs(dif))}</span>
          </div>
          {Math.abs(dif) >= 0.005 && (
            <p className="text-[12px] text-stone-600 mt-2 leading-relaxed">
              {Math.abs(dif) <= 1000
                ? "Una diferencia chica casi siempre son monedas que no se contaron. Anotala igual: lo que importa es si se repite."
                : "Diferencia grande para ser solo menudo. Revisá si quedó alguna venta sin registrar o un pago sin anotar."}
            </p>
          )}
        </div>
      )}

      <div className="mb-4">
        <Lbl>Nota (opcional)</Lbl>
        <Inp value={nota} onChange={(e)=>setNota(e.target.value)} placeholder="Se pagó un mandado, faltó vuelto…" />
      </div>

      {yaCerrado && <p className="text-[12px] text-stone-600 mb-3">◐ Esta fecha ya tiene un cierre guardado. Si guardás, lo reemplaza.</p>}

      <Btn kind="warn" className="w-full py-3" disabled={billetes===""} onClick={guardarCierre}>Guardar cierre</Btn>

      {previos.length>0 && (
        <div className="mt-4 pt-3 border-t border-stone-200">
          <div className="text-[11px] uppercase tracking-wide text-stone-500 mb-2">Últimos cierres</div>
          {previos.map((c)=>(
            <div key={c.id} className="flex justify-between py-1 text-[13px]">
              <span className="font-mono text-stone-600">{fmtFecha(c.fecha)}</span>
              <span className="font-mono tabular-nums">
                {Math.abs(c.diferencia||0) < 0.005 ? "○ cuadró" : ((c.diferencia > 0 ? "◐ sobró " : "● faltó ") + C(Math.abs(c.diferencia)))}
              </span>
            </div>
          ))}
          <div className="flex justify-between pt-2 mt-1 border-t border-stone-200 text-[13px] font-medium">
            <span>Acumulado histórico</span>
            <span className="font-mono tabular-nums">{Math.abs(acumulado) < 0.005 ? "cuadrado" : (acumulado > 0 ? "sobra " : "falta ") + C(Math.abs(acumulado))}</span>
          </div>
        </div>
      )}
    </Modal>
  );
}

function Historial({ ventas, gastos, guardar, borrar, aviso }) {
  const [q, setQ] = useState(""); const [tipo, setTipo] = useState("todo");
  const [edit, setEdit] = useState(null); const [editG, setEditG] = useState(null);

  const grupos = useMemo(()=>{
    const items = [
      ...(tipo==="gasto" ? [] : ventas.map((v)=>({ ...v, _t:"venta", _txt: v.producto + " " + (v.cliente||"") }))),
      ...(tipo==="venta" ? [] : gastos.map((g)=>({ ...g, _t:"gasto", _txt: (g.detalle||"") + " " + g.categoria })))
    ].filter((x)=>!q || x._txt.toLowerCase().includes(q.toLowerCase()));
    const m = {};
    items.forEach((x)=>(m[x.fecha] = m[x.fecha] || []).push(x));
    Object.values(m).forEach((l)=>l.sort((a,b)=>(b.creado||0)-(a.creado||0)));
    return Object.entries(m).sort((a,b)=>(a[0]<b[0]?1:-1));
  }, [ventas, gastos, q, tipo]);

  return (
    <div>
      <Inp placeholder="Buscar producto, cliente o proveedor…" value={q} onChange={(e)=>setQ(e.target.value)} className="mb-2" />
      <div className="flex gap-2 mb-3">

          <button key={id} onClick={()=>setTipo(id)} className={"px-3 py-1.5 rounded-full border text-xs " + (tipo===id ? "bg-stone-900 text-white border-stone-900" : "bg-white border-stone-300")}>{l}</button>
        ))}
      </div>
      {grupos.length === 0 && <p className="text-sm text-stone-500 text-center py-8">Nada que mostrar.</p>}
      <div className="space-y-3 lg:space-y-0 lg:grid lg:grid-cols-2 lg:gap-3 lg:items-start">
        {grupos.slice(0,40).map(([fecha, lista])=>{
          const ent = lista.filter((x)=>x._t==="venta").reduce((a,x)=>a+x.monto,0);
          const sal = lista.filter((x)=>x._t==="gasto").reduce((a,x)=>a+x.monto,0);
          return (
            <div key={fecha}>
              <div className="flex justify-between items-baseline px-1 mb-1">
                <span className="text-[11px] uppercase tracking-wide text-stone-500">{titulo(nombreDia(fecha))} {fmtFecha(fecha)}</span>
                <span className="font-mono tabular-nums text-[12px] font-medium">{C(ent)}{sal>0 && <span className="text-stone-500"> − {C(sal)} = {C(ent-sal)}</span>}</span>
              </div>
              <Card className="divide-y divide-stone-100">
                {lista.map((x)=>(
                  <button key={x.id} onClick={()=>x._t==="venta" ? setEdit(x) : setEditG(x)} className="w-full text-left px-3 py-2 flex justify-between items-center active:bg-stone-50">
                    <div className="min-w-0">
                      <div className="text-sm truncate">{x._t==="venta" ? x.producto : (x.detalle || x.categoria)}</div>
                      <div className="text-[11px] text-stone-500">{x._t==="venta" ? [x.cliente,x.pago].filter(Boolean).join(" · ") : `Salida · ${x.categoria} · ${x.pago}`}</div>
                    </div>
                    <span className="font-mono tabular-nums text-sm ml-2">{x._t==="venta" ? C(x.monto) : "− " + C(x.monto)}</span>

          );
        })}

      {edit && <EditarVentaModal v={edit} onClose={()=>setEdit(null)}

  );

/* gráfico de barras diario, monocromo */
function GraficoDias({ datos, referencia }) {
  if (!datos.length) return null;
  const W = 720, H = 190, padL = 8, padR = 8, padB = 26, padT = 12;
  const max = Math.max(...datos.map((d)=>d.t), referencia || 0) * 1.1 || 1;
  const ancho = (W - padL - padR) / datos.length;
  const barW = Math.max(3, Math.min(30, ancho * 0.62));
  const yDe = (v) => padT + (H - padT - padB) * (1 - v / max);
  const cada = datos.length > 20 ? 5 : datos.length > 12 ? 3 : 2;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: "auto" }} preserveAspectRatio="none">
      <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke="#d6d3d1" strokeWidth="1" />
      {referencia > 0 && (
        <>
          <line x1={padL} y1={yDe(referencia)} x2={W-padR} y2={yDe(referencia)} stroke="#78716c" strokeWidth="1.5" strokeDasharray="6 4" />
          <text x={W-padR} y={yDe(referencia)-5} textAnchor="end" fontSize="10" fill="#78716c" fontFamily="ui-monospace, monospace">
            meta diaria {C(referencia)}
          </text>
        </>
      )}
      {datos.map((d,i)=>{
        const x = padL + i*ancho + (ancho-barW)/2;
        const y = yDe(d.t);
        const alto = Math.max(1, (H - padB) - y);
        const bajo = referencia > 0 && d.t < referencia;
        return (
          <g key={d.f}>
            <rect x={x} y={y} width={barW} height={alto} rx="2"
              fill={bajo ? "#ffffff" : "#292524"} stroke="#292524" strokeWidth={bajo ? 1.5 : 0} />
            {i % cada === 0 && (
              <text x={x+barW/2} y={H-padB+13} textAnchor="middle" fontSize="9" fill="#a8a29e" fontFamily="ui-monospace, monospace">
                {d.f.slice(8)}
              </text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

/* ---------- waterfall monocromo ---------- */
function Waterfall({ pasos }) {
  if (!pasos.length) return null;
  const W = Math.max(780, pasos.length * 132), H = 300, padL = 6, padR = 6, padT = 34, padB = 74;
  let acum = 0;
  const barras = pasos.map((p)=>{
    let desde, hasta;
    if (p.tipo === "total") { desde = 0; hasta = p.valor; acum = p.valor; }
    else if (p.tipo === "sube") { desde = acum; hasta = acum + p.valor; acum = hasta; }
    else { desde = acum; hasta = acum - p.valor; acum = hasta; }
    return { ...p, desde, hasta };
  });
  const corte = barras.findIndex((b)=>b.proyeccion);
  const vals = barras.flatMap((b)=>[b.desde, b.hasta]).concat([0]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const rango = (max - min) || 1;
  const y = (v) => padT + (H - padT - padB) * (1 - (v - min) / rango);
  const ancho = (W - padL - padR) / barras.length;
  const bw = Math.min(78, ancho * 0.56);

  return (
    <div className="overflow-x-auto -mx-1">
      <svg viewBox={`0 0 ${W} ${H}`} style={{ minWidth: Math.min(W, 900), width: "100%", height: "auto" }}>
        <line x1={padL} y1={y(0)} x2={W-padR} y2={y(0)} stroke="#d6d3d1" strokeWidth="1" />
        {corte > 0 && (()=>{ const xc = padL + corte*ancho; return (
          <g>
            <line x1={xc} y1={padT-8} x2={xc} y2={H-padB+4} stroke="#a8a29e" strokeWidth="1" strokeDasharray="2 4" />
            <text x={xc+6} y={padT-2} fontSize="10" fill="#a8a29e">lo que viene</text>
          </g>
        ); })()}
        {barras.map((b,i)=>{
          const cx = padL + i*ancho + ancho/2;
          const x = cx - bw/2;
          const yTop = Math.min(y(b.desde), y(b.hasta));
          const alto = Math.max(2, Math.abs(y(b.desde) - y(b.hasta)));
          const total = b.tipo === "total";
          const baja = b.tipo === "baja";
          const negativo = total && b.valor < 0;
          const hueco = baja || negativo;
          const sig = total ? (negativo ? "− " : "") : baja ? "− " : "+ ";
          const sig2 = barras[i+1];
          return (
            <g key={i}>
              {sig2 && (
                <line x1={cx+bw/2} y1={y(b.hasta)} x2={padL + (i+1)*ancho + ancho/2 - bw/2} y2={y(b.hasta)}
                  stroke="#a8a29e" strokeWidth="1" strokeDasharray="3 3" />
              )}
              <rect x={x} y={yTop} width={bw} height={alto} rx="2"
                fill={b.proyeccion ? "#ffffff" : hueco ? "#ffffff" : "#292524"}
                stroke="#292524"
                strokeWidth={b.proyeccion ? 1.5 : hueco ? 1.5 : 0}
                strokeDasharray={b.proyeccion ? "5 3" : "0"} />
              <text x={cx} y={yTop - 8} textAnchor="middle" fontSize="12" fill="#292524"
                fontFamily="ui-monospace, monospace" fontWeight={total ? "700" : "400"}>
                {sig}{C(Math.abs(b.valor))}
              </text>
              {b.label.split("|").map((ln,k)=>(
                <text key={k} x={cx} y={H - padB + 18 + k*13} textAnchor="middle" fontSize="11" fill="#57534e">{ln}</text>
              ))}
              {b.tipo !== "total" && (
                <text x={cx} y={H - padB + 18 + b.label.split("|").length*13 + 2} textAnchor="middle"
                  fontSize="9" fill="#a8a29e" fontFamily="ui-monospace, monospace">
                  {C(b.hasta)}
                </text>
              )}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

/* ---------- línea de acumulado contra el ritmo necesario ---------- */
function GraficoLinea({ series, etiquetas, yMax }) {
  const W = 760, H = 240, padL = 62, padR = 14, padT = 16, padB = 34;
  const n = Math.max(...series.map((s)=>s.puntos.length));
  if (n < 2) return <p className="text-sm text-stone-500 py-6 text-center">Hacen falta al menos dos días con venta.</p>;
  const max = yMax || Math.max(...series.flatMap((s)=>s.puntos), 1);
  const x = (i) => padL + (W-padL-padR) * (i/(n-1));
  const y = (v) => padT + (H-padT-padB) * (1 - v/max);
  const marcas = [0, 0.25, 0.5, 0.75, 1].map((f)=>f*max);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: "auto" }}>
      {marcas.map((m,i)=>(
        <g key={i}>
          <line x1={padL} y1={y(m)} x2={W-padR} y2={y(m)} stroke="#e7e5e4" strokeWidth="1" />
          <text x={padL-6} y={y(m)+3} textAnchor="end" fontSize="9" fill="#a8a29e" fontFamily="ui-monospace, monospace">
            {m >= 1000 ? Math.round(m/1000)+"k" : Math.round(m)}
          </text>
        </g>
      ))}
      {series.map((s,k)=>(
        <g key={k}>
          <polyline
            points={s.puntos.map((v,i)=>`${x(i)},${y(v)}`).join(" ")}
            fill="none" stroke="#292524"
            strokeWidth={s.guia ? 1.5 : 2.5}
            strokeDasharray={s.guia ? "6 4" : "0"}
            strokeLinejoin="round"
          />
          {!s.guia && s.puntos.length>0 && (
            <circle cx={x(s.puntos.length-1)} cy={y(s.puntos[s.puntos.length-1])} r="4" fill="#292524" />
          )}
          {s.puntos.length>0 && (
            <text x={x(s.puntos.length-1) - 4} y={y(s.puntos[s.puntos.length-1]) - 10} textAnchor="end"
              fontSize="11" fill="#292524" fontFamily="ui-monospace, monospace" fontWeight={s.guia ? "400" : "700"}>
              {s.nombre}
            </text>
          )}
        </g>
      ))}
      {etiquetas.map((e,i)=> e && (
        <text key={i} x={x(i)} y={H-padB+15} textAnchor="middle" fontSize="9" fill="#a8a29e" fontFamily="ui-monospace, monospace">{e}</text>
      ))}
    </svg>
  );
}

/* ---------- dispersión: cuánto se vende vs cuánto deja ---------- */
function GraficoDispersion({ puntos, metaPct }) {
  const W = 760, H = 300, padL = 58, padR = 20, padT = 20, padB = 46;
  if (!puntos.length) return <p className="text-sm text-stone-500 py-6 text-center">Hacen falta productos enlazados a la tabla de precios.</p>;
  const maxX = Math.max(...puntos.map((p)=>p.venta), 1) * 1.12;
  const maxY = Math.max(...puntos.map((p)=>p.pct), metaPct, 1) * 1.15;
  const minY = Math.min(0, ...puntos.map((p)=>p.pct));
  const x = (v) => padL + (W-padL-padR) * (v/maxX);
  const y = (v) => padT + (H-padT-padB) * (1 - (v-minY)/(maxY-minY));
  const r = (v) => 4 + Math.min(11, Math.sqrt(v/2));

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: "auto" }}>
      <line x1={padL} y1={y(minY)} x2={W-padR} y2={y(minY)} stroke="#d6d3d1" strokeWidth="1" />
      <line x1={padL} y1={padT} x2={padL} y2={y(minY)} stroke="#d6d3d1" strokeWidth="1" />
      <line x1={padL} y1={y(metaPct)} x2={W-padR} y2={y(metaPct)} stroke="#78716c" strokeWidth="1.5" strokeDasharray="6 4" />
      <text x={W-padR} y={y(metaPct)-5} textAnchor="end" fontSize="10" fill="#78716c" fontFamily="ui-monospace, monospace">meta {metaPct}%</text>
      {[0.25,0.5,0.75,1].map((f,i)=>(
        <text key={i} x={x(maxX*f)} y={H-padB+15} textAnchor="middle" fontSize="9" fill="#a8a29e" fontFamily="ui-monospace, monospace">
          {Math.round(maxX*f/1000)}k
        </text>
      ))}
      {puntos.map((p,i)=>{
        const bajo = p.pct < metaPct;
        return (
          <g key={i}>
            <circle cx={x(p.venta)} cy={y(p.pct)} r={r(p.veces)}
              fill={bajo ? "#ffffff" : "#292524"} stroke="#292524" strokeWidth="1.5" opacity="0.9" />
            <text x={x(p.venta)} y={y(p.pct) - r(p.veces) - 5} textAnchor="middle" fontSize="9" fill="#57534e">
              {p.nombre.length > 18 ? p.nombre.slice(0,18)+"…" : p.nombre}
            </text>
          </g>
        );
      })}
      <text x={(padL+W-padR)/2} y={H-6} textAnchor="middle" fontSize="10" fill="#78716c">Vendido en el mes →</text>
      <text x={12} y={(padT+H-padB)/2} textAnchor="middle" fontSize="10" fill="#78716c" transform={`rotate(-90 12 ${(padT+H-padB)/2})`}>Margen %</text>
    </svg>
  );
}

/* ---------- histograma de tiquetes ---------- */
function Histograma({ valores, cortes }) {
  const W = 760, H = 220, padL = 40, padR = 14, padT = 16, padB = 46;
  if (!valores.length) return <p className="text-sm text-stone-500 py-6 text-center">Sin ventas en el período.</p>;
  const cubos = cortes.map((c,i)=>({
    label: c.label,
    n: valores.filter((v)=>v >= c.min && v < c.max).length,
    monto: valores.filter((v)=>v >= c.min && v < c.max).reduce((a,v)=>a+v,0)
  }));
  const max = Math.max(...cubos.map((c)=>c.n), 1);
  const ancho = (W-padL-padR)/cubos.length;
  const bw = ancho * 0.72;
  const y = (v) => padT + (H-padT-padB) * (1 - v/max);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: "auto" }}>
      <line x1={padL} y1={y(0)} x2={W-padR} y2={y(0)} stroke="#d6d3d1" strokeWidth="1" />
      {cubos.map((c,i)=>{
        const cx = padL + i*ancho + ancho/2;
        return (
          <g key={i}>
            <rect x={cx-bw/2} y={y(c.n)} width={bw} height={Math.max(1, y(0)-y(c.n))} rx="2" fill="#292524" />
            {c.n > 0 && <text x={cx} y={y(c.n)-6} textAnchor="middle" fontSize="11" fill="#292524" fontFamily="ui-monospace, monospace">{c.n}</text>}
            <text x={cx} y={H-padB+15} textAnchor="middle" fontSize="9" fill="#78716c">{c.label}</text>
            <text x={cx} y={H-padB+27} textAnchor="middle" fontSize="9" fill="#a8a29e" fontFamily="ui-monospace, monospace">{C(c.monto)}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ---------- torta: solo para 2-4 pedazos que suman un total ---------- */
function Torta({ partes }) {
  const R = 74, cx = 90, cy = 90;
  const total = partes.reduce((a,p)=>a+p.valor,0);
  if (total <= 0) return null;
  const tramas = ["solido", "rayas", "puntos", "hueco"];
  let ang = -Math.PI/2;
  const arcos = partes.map((p,i)=>{
    const frac = p.valor/total, d = frac*Math.PI*2;
    const x1 = cx + R*Math.cos(ang), y1 = cy + R*Math.sin(ang);
    ang += d;
    const x2 = cx + R*Math.cos(ang), y2 = cy + R*Math.sin(ang);
    return { ...p, frac, d: `M ${cx} ${cy} L ${x1} ${y1} A ${R} ${R} 0 ${frac>0.5?1:0} 1 ${x2} ${y2} Z`, trama: tramas[i%4] };
  });
  const relleno = (t) => t==="solido" ? "#292524" : t==="rayas" ? "url(#rayas)" : t==="puntos" ? "url(#puntos)" : "#ffffff";

  return (
    <div className="flex items-center gap-5 flex-wrap">
      <svg viewBox="0 0 180 180" style={{ width: 150, height: 150 }}>
        <defs>
          <pattern id="rayas" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="7" height="7" fill="#fff" /><line x1="0" y1="0" x2="0" y2="7" stroke="#292524" strokeWidth="3.5" />
          </pattern>
          <pattern id="puntos" width="7" height="7" patternUnits="userSpaceOnUse">
            <rect width="7" height="7" fill="#fff" /><circle cx="3.5" cy="3.5" r="1.8" fill="#292524" />
          </pattern>
        </defs>
        {arcos.map((a,i)=><path key={i} d={a.d} fill={relleno(a.trama)} stroke="#292524" strokeWidth="1.5" />)}
      </svg>
      <div className="flex-1 min-w-[160px] space-y-1.5">
        {arcos.map((a,i)=>(
          <div key={i} className="flex items-center gap-2">
            <svg width="16" height="16" className="shrink-0">
              <rect width="16" height="16" rx="2" fill={relleno(a.trama)} stroke="#292524" strokeWidth="1.5" />
            </svg>
            <span className="text-[13px] flex-1">{a.nombre}</span>
            <span className="font-mono tabular-nums text-[13px]">{C(a.valor)}</span>
            <span className="font-mono tabular-nums text-[11px] text-stone-500 w-9 text-right">{(a.frac*100).toFixed(0)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- análisis de costo real, compartido ---------- */
function analizarVentas(lista, precios, enlaces) {
  let ventaId=0, costoId=0, sinId=0;
  const sinIdentificar = {}, porProducto = {};
  lista.forEach((v)=>{
    /* venta registrada línea por línea: el costo es exacto, no hay que deducir nada */
    if (Array.isArray(v.items) && v.items.length) {
      v.items.forEach((it)=>{
        const t = num(it.total);
        if (it.costo != null && it.costo > 0) {
          ventaId += t; costoId += it.costo;
          const k = it.productoId || norm(it.nombre);
          if (!porProducto[k]) porProducto[k] = { nombre: it.nombre, venta:0, costo:0, veces:0, kg:0, uds:0 };
          porProducto[k].venta += t; porProducto[k].costo += it.costo; porProducto[k].veces++;
          porProducto[k].kg += num(it.kg);
          porProducto[k].uds += num(it.cantidad);
        } else {
          sinId += t;
          const k = norm(it.nombre);
          if (!sinIdentificar[k]) sinIdentificar[k] = { texto: it.nombre, veces:0, monto:0 };
          sinIdentificar[k].veces++; sinIdentificar[k].monto += t;
        }
      });
      return;
    }
    const ps = partes(v.producto), porParte = v.monto/ps.length;
    ps.forEach((txt)=>{
      const r = identificar(txt, precios, enlaces);
      if (r.ignorado) { ventaId += porParte; return; }
      const c = r.p ? costoDeVenta(r.p, porParte) : null;
      if (c) {
        ventaId += porParte; costoId += c.costo;
        const k = r.p.id;
        if (!porProducto[k]) porProducto[k] = { nombre: r.p.nombre, venta:0, costo:0, veces:0, kg:0, uds:0 };
        porProducto[k].venta += porParte; porProducto[k].costo += c.costo; porProducto[k].veces++;
        porProducto[k].kg += (c.tipo === "saco" ? c.cantidad * num(r.p.peso) : c.cantidad);
        porProducto[k].uds += c.cantidad;
      } else {
        sinId += porParte;
        const k = norm(txt);
        if (!sinIdentificar[k]) sinIdentificar[k] = { texto: txt, veces:0, monto:0 };
        sinIdentificar[k].veces++; sinIdentificar[k].monto += porParte;
      }
    });
  });
  const total = lista.reduce((a,v)=>a+v.monto,0);
  const conLineas = lista.filter((v)=>Array.isArray(v.items) && v.items.length).length;
  return {
    ventaId, costoId, sinId, conLineas, nVentas: lista.length,
    cobertura: total>0 ? (ventaId/total)*100 : 0,
    sinLista: Object.values(sinIdentificar).sort((a,b)=>b.monto-a.monto),
    productos: Object.values(porProducto).map((x)=>({ ...x, gan: x.venta-x.costo, pct: x.venta>0 ? ((x.venta-x.costo)/x.venta)*100 : 0 })).sort((a,b)=>b.gan-a.gan)
  };
}

/* ---------- ganancia: costo real donde lo hay, margen conservador en el resto ---------- */
function gananciaDe(a, cfg) {
  const mNo = cfg && cfg.margenNoIdent != null ? cfg.margenNoIdent : 18;
  const netoId = sinIVA(a.ventaId), netoSin = sinIVA(a.sinId);
  const costo = a.costoId + netoSin * (1 - mNo/100);
  const neto = netoId + netoSin;
  return {
    neto, costo, bruta: neto - costo,
    margen: neto > 0 ? ((neto - costo)/neto)*100 : 0,
    margenId: netoId > 0 ? ((netoId - a.costoId)/netoId)*100 : null,
  };
}

/* ¿este movimiento ya entró en ese cierre? compara fecha y, si es el mismo día, la hora */
const dentroDelCierre = (mov, cierre) => {
  if (!cierre) return false;
  if (mov.fecha < cierre.fecha) return true;
  if (mov.fecha > cierre.fecha) return false;
  return (mov.creado || 0) <= (cierre.creado || 0);
};
