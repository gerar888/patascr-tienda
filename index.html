<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch,
  disableNetwork, enableNetwork
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyACy5Q_HgwBBpMmiEaLWZBKgUWB55cLT1A",
  authDomain: "patascr-tienda.firebaseapp.com",
  projectId: "patascr-tienda",
  storageBucket: "patascr-tienda.firebasestorage.app",
  messagingSenderId: "540036190381",
  appId: "1:540036190381:web:9736a05264926960e6b624"
};

const TIENDA = "patascr"; // si algún día abrís otra sucursal, cambiás esto
const BASE_DATOS = "default"; // nombre de la base en Firestore (el del desplegable junto a "Database")

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }),
  experimentalForceLongPolling: true
}, BASE_DATOS);
const auth = getAuth(app);

const ruta = (col) => collection(db, "tiendas", TIENDA, col);

window.FB = {
  proyecto: firebaseConfig.projectId,
  diagnostico: async () => {
    const u = auth.currentUser;
    let token = null;
    try { token = u ? await u.getIdToken() : null; } catch (e) {}
    const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/${BASE_DATOS}/documents/tiendas?pageSize=1`;
    try {
      const r = await fetch(url, { headers: token ? { Authorization: "Bearer " + token } : {} });
      const cuerpo = await r.text();
      return { status: r.status, cuerpo: cuerpo.slice(0, 400) };
    } catch (e) {
      return { status: 0, cuerpo: String(e.message || e) };
    }
  },
  entrar: (correo, clave) => signInWithEmailAndPassword(auth, correo, clave),
  salir: () => signOut(auth),
  observarSesion: (cb) => onAuthStateChanged(auth, cb),
  escuchar: (col, cb, onErr) =>
    onSnapshot(ruta(col), { includeMetadataChanges: true },
      (snap) => { cb(snap.docs.map((d) => ({ ...d.data(), id: d.id })), snap.metadata.fromCache); },
      (err) => { console.error("Error leyendo " + col, err); onErr && onErr(err); }
    ),
  guardar: (col, obj) => setDoc(doc(ruta(col), obj.id), obj, { merge: true }),
  borrar: (col, id) => deleteDoc(doc(ruta(col), id)),
  guardarLote: async (col, arr, onProgreso) => {
    const TANDA = 20;
    for (let i = 0; i < arr.length; i += TANDA) {
      const trozo = arr.slice(i, i + TANDA);
      const b = writeBatch(db);
      trozo.forEach((o) => b.set(doc(ruta(col), o.id), o, { merge: true }));
      await b.commit();
      if (onProgreso) onProgreso(Math.min(i + TANDA, arr.length), arr.length);
      await new Promise((r) => setTimeout(r, 150));
    }
  },
  reconectar: async () => { await disableNetwork(db); await enableNetwork(db); }
};
window.dispatchEvent(new Event("fb-listo"));
</script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useRef } = React;

/* ================= helpers ================= */
const C = (n) => {
  const v = n || 0;
  const conDec = Math.abs(v % 1) > 0.004;
  return "₡" + v.toLocaleString("es-CR", { minimumFractionDigits: conDec ? 2 : 0, maximumFractionDigits: conDec ? 2 : 0 });
};
const UID = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hoyISO = () => new Date().toLocaleDateString("en-CA");
const mesDe = (iso) => (iso || "").slice(0, 7);
const fmtFecha = (iso) => { const [y,m,d] = (iso||"").split("-"); return `${+d}/${+m}/${y}`; };
const nombreDia = (iso) => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("es-CR", { weekday: "long" }); };
const titulo = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
const diasDesde = (ms) => Math.floor((Date.now() - ms) / 86400000);
const diasEntre = (a, b) => Math.round(Math.abs(new Date(a) - new Date(b)) / 86400000);
const num = (v) => {
  let t = String(v == null ? "" : v).replace(/[^\d.,-]/g, "").trim();
  if (!t) return 0;
  const neg = t.startsWith("-");
  t = t.replace(/-/g, "");
  const ultComa = t.lastIndexOf(","), ultPunto = t.lastIndexOf(".");
  let dec = -1;
  if (ultComa > -1 && ultPunto > -1) dec = Math.max(ultComa, ultPunto);
  else if (ultComa > -1) dec = (t.length - ultComa - 1) <= 2 && t.indexOf(",") === ultComa ? ultComa : -1;
  else if (ultPunto > -1) dec = (t.length - ultPunto - 1) <= 2 && t.indexOf(".") === ultPunto ? ultPunto : -1;
  const entero = (dec > -1 ? t.slice(0, dec) : t).replace(/[.,]/g, "");
  const frac = dec > -1 ? t.slice(dec + 1).replace(/[.,]/g, "") : "";
  const n = parseFloat(entero + (frac ? "." + frac : "")) || 0;
  return neg ? -n : n;
};

const CATS = ["Mercadería", "Empaque", "Alquiler", "Servicios", "Transporte", "Marketing", "Impuestos", "Otro"];
const PAGOS = ["Efectivo", "SINPE", "Tarjeta", "Otro"];
const CFG_DEF = { id: "general", meta: 140000, costoPct: 80, excluirDomingos: true, margenGranel: 20, margenSaco: 15, fondoCaja: 20000, saldoBanco: 0, diasTarjeta: 1 };

const margen = (precio, costo) => (precio > 0 ? ((precio - costo) / precio) * 100 : null);
const partes = (t) => (t || "").split(/\s*\+\s*/).map((s) => s.trim()).filter(Boolean);
const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();

/* similitud entre dos textos: 0 a 1, por palabras compartidas */
function similitud(a, b) {
  const pa = norm(a).split(" ").filter((w) => w.length > 2);
  const pb = norm(b).split(" ").filter((w) => w.length > 2);
  if (!pa.length || !pb.length) return 0;
  const comunes = pa.filter((w) => pb.some((x) => x.startsWith(w) || w.startsWith(x))).length;
  return comunes / Math.max(pa.length, pb.length);
}

/* candidatos ordenados por parecido, para la pantalla de enlaces */
function candidatos(txt, precios, n = 3) {
  return precios
    .map((p) => ({ p, score: similitud(txt, p.nombre) }))
    .filter((x) => x.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, n);
}

/* identifica el producto: primero por enlace guardado, después por parecido */
function identificar(txt, precios, enlaces) {
  const k = norm(txt);
  const en = enlaces.find((e) => e.id === k || norm(e.texto || "") === k);
  if (en) {
    if (en.ignorar) return { ignorado: true };
    const p = precios.find((x) => x.id === en.productoId);
    if (p) return { p, seguro: true };
  }
  const c = candidatos(txt, precios, 1)[0];
  if (c && c.score >= 0.6) return { p: c.p, seguro: false };
  return {};
}

/* deduce si el monto corresponde a saco completo o a granel, y calcula el costo */
function costoDeVenta(p, monto) {
  if (!p || monto <= 0) return null;
  const costoKilo = p.peso > 0 ? p.costo / p.peso : 0;

  const opciones = [];
  if (p.precioSaco > 0) {
    const n = monto / p.precioSaco;
    const redondo = Math.round(n);
    if (redondo >= 1) opciones.push({ tipo: "saco", cantidad: redondo, costo: redondo * p.costo, error: Math.abs(n - redondo) / n });
  }
  if (p.precioKilo > 0 && costoKilo > 0) {
    const kilos = monto / p.precioKilo;
    opciones.push({ tipo: "granel", cantidad: kilos, costo: kilos * costoKilo, error: 0.5 });
  }
  if (!opciones.length) return null;

  /* si el monto calza casi exacto con sacos completos, gana el saco */
  const saco = opciones.find((o) => o.tipo === "saco" && o.error < 0.05);
  const elegida = saco || opciones.sort((a, b) => a.error - b.error)[0];
  if (!(elegida.costo > 0) || elegida.costo >= monto * 1.5) return null;
  return elegida;
}

/* ================= UI base ================= */
const Card = ({ children, className = "" }) => <div className={"bg-white border border-stone-300 rounded-lg " + className}>{children}</div>;
const Btn = ({ children, onClick, kind = "primary", className = "", disabled }) => {
  const s = { primary: "bg-stone-900 text-white border-stone-900 active:bg-stone-700", ghost: "bg-white text-stone-800 border-stone-300 active:bg-stone-100", warn: "bg-amber-500 text-stone-900 border-amber-600 active:bg-amber-400" };
  return <button onClick={onClick} disabled={disabled} className={`px-3 py-2 rounded-md border text-sm font-medium disabled:opacity-40 ${s[kind]} ${className}`}>{children}</button>;
};
const Lbl = ({ children }) => <span className="block text-[11px] uppercase tracking-wide text-stone-500 mb-1">{children}</span>;
const Inp = (props) => <input {...props} className={"w-full px-3 py-2 border border-stone-300 rounded-md bg-stone-50 text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-400 " + (props.className || "")} />;
const Linea = ({ label, val, fuerte }) => (

    <span className={fuerte ? "font-medium" : "text-stone-600"}>{label}</span>
    <span className={"font-mono tabular-nums " + (fuerte ? "font-semibold" : "text-stone-700")}>{val}</span>
  </div>
);
const Modal = ({ title, onClose, children }) => (
  <div className="fixed inset-0 z-50 bg-stone-900/60 flex items-end sm:items-center justify-center" onClick={onClose}>
    <div className="bg-white w-full sm:max-w-lg rounded-t-xl sm:rounded-xl max-h-[92vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
      <div className="sticky top-0 bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between">
        <h3 className="font-semibold">{title}</h3>
        <button onClick={onClose} className="text-stone-500 text-xl px-2">×</button>
      </div>
      <div className="p-4">{children}</div>
    </div>
  </div>
);
const ind = (m, meta) => {
  if (m === null || !isFinite(m)) return { s: "—", t: "Falta precio" };
  if (m >= meta + 8) return { s: "★", t: "Sobre la meta" };
  if (m >= meta) return { s: "○", t: "En meta" };
  if (m >= meta - 4) return { s: "◐", t: "Apenas debajo" };
  return { s: "●", t: "Margen muy bajo" };
};

/* ================= datos en vivo ================= */
function useColeccion(col, sesion) {
  const [datos, setDatos] = useState([]);
  const [cache, setCache] = useState(false);
  const [error, setError] = useState(null);
  useEffect(() => {
    if (!sesion) return;
    setError(null);
    return window.FB.escuchar(
      col,
      (d, fromCache) => { setDatos(d); setCache(fromCache); setError(null); },
      (e) => setError(e.code || "error")
    );
  }, [col, sesion]);
  return [datos, cache, error];
}

/* ================= App ================= */
function App() {
  const [fbListo, setFbListo] = useState(!!window.FB);
  const [sesion, setSesion] = useState(undefined);
  const [tab, setTab] = useState("registrar");
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (fbListo) return;
    const h = () => setFbListo(true);
    window.addEventListener("fb-listo", h);
    return () => window.removeEventListener("fb-listo", h);
  }, [fbListo]);

  useEffect(() => { if (fbListo) return window.FB.observarSesion((u) => setSesion(u || null)); }, [fbListo]);

  const [ventas, offline, errVentas] = useColeccion("ventas", sesion);
  const [gastos] = useColeccion("gastos", sesion);
  const [precios] = useColeccion("precios", sesion);
  const [fijos] = useColeccion("fijos", sesion);
  const [enlaces] = useColeccion("enlaces", sesion);
  const [cierres] = useColeccion("cierres", sesion);
  const [movs] = useColeccion("movimientos", sesion);
  const [cfgArr] = useColeccion("config", sesion);
  const cfg = { ...CFG_DEF, ...(cfgArr[0] || {}) };

  const aviso = (t) => { setToast(t); setTimeout(() => setToast(null), 2000); };
  const guardar = async (col, obj) => { try { await window.FB.guardar(col, obj); } catch (e) { aviso("No se pudo guardar: " + e.code); } };
  const borrar = async (col, id) => { try { await window.FB.borrar(col, id); } catch (e) { aviso("No se pudo borrar"); } };

  if (!fbListo || sesion === undefined) return <div className="min-h-screen flex items-center justify-center text-stone-500 text-sm">Conectando…</div>;
  if (!sesion) return <Login aviso={aviso} toast={toast} />;

  const totalHoy = ventas.filter((v) => v.fecha === hoyISO()).reduce((a, v) => a + v.monto, 0);
  const nHoy = ventas.filter((v) => v.fecha === hoyISO()).length;
  const gastoHoy = gastos.filter((g) => g.fecha === hoyISO()).reduce((a, g) => a + g.monto, 0);

  const TABS = [["registrar","Registrar"],["historial","Historial"],["dinero","Dinero"],["precios","Precios"],["reportes","Reportes"]];
  const estado = errVentas ? "● sin acceso" : offline ? "◐ sin conexión" : "○ sincronizado";

  return (
    <div className="min-h-screen text-stone-900 pb-24 lg:pb-0 lg:flex">

      {/* ---------- barra lateral, solo en pantalla grande ---------- */}
      <aside className="hidden lg:flex lg:flex-col lg:w-60 lg:shrink-0 bg-stone-900 text-stone-100 lg:h-screen lg:sticky lg:top-0">
        <div className="px-5 pt-6 pb-5 border-b border-stone-700">
          <div className="text-[11px] uppercase tracking-[0.2em] text-stone-400">Patas CR</div>
          <div className="text-[11px] text-stone-500">San Blas</div>
          <div className="mt-4 font-mono tabular-nums text-2xl tracking-tight">{C(totalHoy)}</div>
          <div className="text-[11px] text-stone-400">hoy · {nHoy} {nHoy === 1 ? "venta" : "ventas"}</div>
          {gastoHoy > 0 && <div className="font-mono tabular-nums text-[11px] text-stone-500 mt-0.5">{C(gastoHoy)} pagados</div>}
        </div>
        <nav className="flex-1 py-3">
          {TABS.map(([id,l]) => (
            <button
              key={id}
              onClick={() => setTab(id)}
              className={"w-full text-left px-5 py-2.5 text-sm border-l-2 " + (tab === id ? "border-amber-500 bg-stone-800 text-white font-medium" : "border-transparent text-stone-400 hover:text-stone-200")}
            >
              {l}
            </button>
          ))}
        </nav>
        <div className="px-5 py-4 border-t border-stone-700">
          <div className="font-mono text-[11px] text-stone-400">{estado}</div>
          <div className="text-[11px] text-stone-500 truncate mt-1">{sesion.email}</div>
        </div>
      </aside>

      <div className="lg:flex-1 lg:min-w-0">

        {/* ---------- encabezado, solo en móvil ---------- */}
        <header className="lg:hidden bg-stone-900 text-stone-100 px-4 pt-4 pb-5 sticky top-0 z-30">
          <div className="flex items-baseline justify-between">
            <span className="text-[11px] uppercase tracking-[0.2em] text-stone-400">Patas CR · San Blas</span>
            <span className="text-[11px] text-stone-400 font-mono">{estado}</span>

          <div className="mt-2 flex items-end gap-3">

          {gastoHoy > 0 && <div className="mt-1 font-mono tabular-nums text-[12px] text-stone-400">{C(gastoHoy)} pagados hoy en compras y gastos</div>}
        </header>

        <main className="px-3 pt-3 lg:px-8 lg:pt-7 lg:pb-10 max-w-3xl lg:max-w-6xl mx-auto">
          <div className="hidden lg:block mb-5">
            <h1 className="text-xl font-semibold">{TABS.find((t)=>t[0]===tab)[1]}</h1>
          </div>

          {offline && !errVentas && <AvisoOffline />}
          {errVentas && (
            <div className="border-2 border-stone-900 rounded-lg p-3 mb-3 bg-white">
              <div className="text-sm font-medium mb-1">● No se está leyendo la base de datos</div>
              <p className="text-[12px] text-stone-700 leading-relaxed mb-2">
                Código del error: <span className="font-mono">{errVentas}</span>

                Sesión iniciada con: <span className="font-mono">{sesion.email}</span>
              </p>
              {errVentas === "permission-denied" && (
                <p className="text-[12px] text-stone-700 leading-relaxed">
                  Ese correo no está en las reglas de Firestore. Entrá a Firebase → Firestore Database → Reglas y verificá que{" "}

          {tab === "historial" && <Historial ventas={ventas} gastos={gastos} guardar={guardar} borrar={borrar} aviso={aviso} />}
          {tab === "dinero" && <Dinero ventas={ventas} gastos={gastos} cierres={cierres} movs={movs} cfg={cfg} guardar={guardar} borrar={borrar} aviso={aviso} usuario={sesion.email} />}
          {tab === "precios" && <Precios precios={precios} cfg={cfg} guardar={guardar} borrar={borrar} aviso={aviso} />}
          {tab === "reportes" && <Reportes ventas={ventas} gastos={gastos} precios={precios} fijos={fijos} enlaces={enlaces} cierres={cierres} cfg={cfg} guardar={guardar} borrar={borrar} aviso={aviso} correo={sesion.email} />}
        </main>
      </div>

      {toast && <div className="fixed bottom-24 lg:bottom-8 left-1/2 -translate-x-1/2 bg-stone-900 text-white text-sm px-4 py-2 rounded-full z-50 shadow-lg">{toast}</div>}

      <nav className="lg:hidden fixed bottom-0 inset-x-0 bg-white border-t border-stone-300 grid grid-cols-5 z-40 pb-[env(safe-area-inset-bottom)]">
        {TABS.map(([id,l]) => (
          <button key={id} onClick={() => setTab(id)} className={"py-3 text-[11px] font-medium border-t-2 " + (tab === id ? "border-amber-500 text-stone-900" : "border-transparent text-stone-500")}>{l}</button>
        ))}
      </nav>
    </div>
  );
}

/* ================= LOGIN ================= */

function AvisoOffline() {
  const [rato, setRato] = useState(false);
  const [res, setRes] = useState(null);
  const [probando, setProbando] = useState(false);
  useEffect(() => { const t = setTimeout(() => setRato(true), 8000); return () => clearTimeout(t); }, []);
  if (!rato) return null;

  const probar = async () => { setProbando(true); setRes(await window.FB.diagnostico()); setProbando(false); };

  const lectura = (s) => {
    if (s === 200) return "La red sí llega a Firestore y los permisos están bien. El problema es el canal en tiempo real: cerrá y volvé a abrir la app, y si sigue, probá otro navegador.";
    if (s === 0) return "La petición ni salió del navegador. La está bloqueando una extensión (bloqueador de anuncios o rastreo) o la red. Probá en incógnito con extensiones desactivadas, o desde los datos del celular.";
    if (s === 403) return "La red llega pero el acceso está denegado. Revisá las reglas de Firestore, o que la API de Cloud Firestore esté habilitada en el proyecto.";
    if (s === 404) return "El proyecto responde pero no encuentra la base de datos (default). Es probable que tu base tenga otro nombre: revisá el desplegable al lado de 'Database' en la consola de Firestore.";
    if (s === 401) return "El token de sesión no se aceptó. Cerrá sesión y volvé a entrar.";
    return "Respuesta inesperada. Mandame el código y el texto de abajo.";
  };

  return (
    <div className="border-2 border-stone-900 rounded-lg p-3 mb-3 bg-white">
      <div className="text-sm font-medium mb-1">● Lleva rato sin poder conectarse</div>
      <p className="text-[12px] text-stone-700 leading-relaxed">
        Lo que registrés queda guardado solo en este dispositivo hasta que vuelva la conexión, y en los otros teléfonos no aparece.
        <br /><br />
        Proyecto configurado: <span className="font-mono">{window.FB.proyecto}</span>
      </p>
      <div className="flex gap-2 mt-2">
        <Btn kind="ghost" className="text-xs py-1.5" onClick={probar} disabled={probando}>
          {probando ? "Probando…" : "Probar conexión"}
        </Btn>
        <Btn kind="ghost" className="text-xs py-1.5" onClick={() => window.FB.reconectar()}>
          Reintentar conexión
        </Btn>
      </div>
      {res && (
        <div className="mt-3 border-t border-stone-200 pt-2">
          <div className="font-mono text-[12px] mb-1">Código: {res.status === 0 ? "sin respuesta" : res.status}</div>

            <summary className="text-[11px] text-stone-500 cursor-pointer">Ver detalle técnico</summary>
            <pre className="text-[10px] whitespace-pre-wrap mt-1 text-stone-600">{res.cuerpo}</pre>
          </details>
        </div>
      )}
    </div>
  );
}

function VentaForm({ ventas, gastos, precios, enlaces, cierres, cfg, guardar, aviso, usuario }) {
  const [fecha, setFecha] = useState(hoyISO());
  const [prod, setProd] = useState("");
  const [monto, setMonto] = useState("");
  const [cliente, setCliente] = useState("");
  const [pago, setPago] = useState("Efectivo");
  const [importar, setImportar] = useState(false);
  const [cerrarCaja, setCerrarCaja] = useState(false);

  /* precio de referencia del último producto escrito */
  const refPrecio = useMemo(()=>{
    const ps = partes(prod);
    if (!ps.length) return null;
    const r = identificar(ps[ps.length-1], precios || [], enlaces || []);
    return r.p || null;
  }, [prod, precios, enlaces]);

  const productosPrev = useMemo(() => { const s = new Set(); ventas.forEach((v) => partes(v.producto).forEach((p) => s.add(p))); return [...s].sort(); }, [ventas]);
  const clientesPrev = useMemo(() => [...new Set(ventas.map((v) => v.cliente).filter(Boolean))].sort(), [ventas]);
  const recientes = useMemo(() => {
    const c = {};
    [...ventas].sort((a,b)=>(b.creado||0)-(a.creado||0)).slice(0,60).forEach((v) => partes(v.producto).forEach((p) => (c[p] = (c[p]||0)+1)));
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6).map((x)=>x[0]);
  }, [ventas]);

  const delDia = ventas.filter((v) => v.fecha === fecha).sort((a,b)=>(b.creado||0)-(a.creado||0));

  const registrar = async () => {
    const m = num(monto);
    await guardar("ventas", { id: UID(), creado: Date.now(), fecha, producto: prod.trim(), monto: m, cliente: cliente.trim(), pago, usuario });
    setProd(""); setMonto(""); setCliente("");

  };

  return (
    <div>
      <Card className="p-4 mb-3">
        <div className="grid grid-cols-3 gap-2 mb-3">
          <div className="col-span-2"><Lbl>Fecha</Lbl><Inp type="date" value={fecha} onChange={(e)=>setFecha(e.target.value)} className="font-mono" /></div>
          <div><Lbl>Monto</Lbl><Inp inputMode="decimal" value={monto} onChange={(e)=>setMonto(e.target.value)} placeholder="0" className="font-mono tabular-nums text-lg" /></div>
        </div>
        <div className="mb-3">
          <Lbl>Producto</Lbl>
          <Inp list="prods" value={prod} onChange={(e)=>setProd(e.target.value)} placeholder="Nutri salmon perro" />
          <datalist id="prods">{productosPrev.map((p)=><option key={p} value={p} />)}</datalist>
          {recientes.length > 0 && (
            <div className="flex flex-wrap gap-1.5 mt-2">
              {recientes.map((p)=>(
                <button key={p} onClick={()=>setProd(prod ? prod + " + " + p : p)} className="px-2 py-1 rounded-full border border-stone-300 bg-stone-50 text-[12px] active:bg-stone-200">{p}</button>
              ))}
            </div>
          )}
          <p className="text-[11px] text-stone-500 mt-1.5">Si lleva varias cosas, separalas con +</p>
          {refPrecio && (
            <div className="mt-2 bg-stone-100 rounded-md px-3 py-2">
              <div className="text-[10px] uppercase tracking-wide text-stone-500 mb-0.5">{refPrecio.nombre}</div>
              <div className="font-mono tabular-nums text-[13px]">
                {refPrecio.precioKilo>0 && <span>{C(refPrecio.precioKilo)} por {refPrecio.unidad==="u" ? "unidad" : "kilo"}</span>}
                {refPrecio.precioKilo>0 && refPrecio.precioSaco>0 && <span className="text-stone-400"> · </span>}
                {refPrecio.precioSaco>0 && <span>{C(refPrecio.precioSaco)} el empaque de {refPrecio.peso}{refPrecio.unidad==="u" ? " u" : " kg"}</span>}
              </div>
            </div>
          )}
        </div>
        <div className="mb-3">
          <Lbl>Cliente (opcional)</Lbl>
          <Inp list="clis" value={cliente} onChange={(e)=>setCliente(e.target.value)} placeholder="Daisy" />
          <datalist id="clis">{clientesPrev.map((c)=><option key={c} value={c} />)}</datalist>
        </div>
        <Lbl>Pago</Lbl>
        <div className="grid grid-cols-4 gap-1.5 mb-4">
          {PAGOS.map((p)=>(
            <button key={p} onClick={()=>setPago(p)} className={"py-2 rounded-md border text-[12px] " + (pago===p ? "bg-stone-900 text-white border-stone-900" : "bg-white border-stone-300")}>{p}</button>

      <div className="flex justify-between items-baseline px-1 mb-2">

        <div className="flex gap-3">

          </div>
        </Card>
      )}

      {cerrarCaja && (
        <CierreModal
          fecha={fecha}
          ventas={ventas}
          gastos={gastos}
          cierres={cierres}
          cfg={cfg}
          guardar={guardar}
          usuario={usuario}
          aviso={aviso}
          onClose={()=>setCerrarCaja(false)}
        />
      )}

      {importar && <ImportarVentasModal onClose={()=>setImportar(false)} onSave={async (nuevas, prog)=>{
        await window.FB.guardarLote("ventas", nuevas.map((n)=>({ ...n, usuario })), prog);
        setImportar(false); aviso(nuevas.length + " ventas importadas");
      }} />}
    </div>
  );
}

function parseVenta(l) {
  let f = l.split("\t"); if (f.length < 3) f = l.split(/\s{2,}/); if (f.length < 3) return null;
  const [fRaw, prod, mRaw, cli, pgo] = f.map((x)=>(x||"").trim());
  const dm = fRaw.match(/(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})/); if (!dm) return null;
  const y = dm[3].length === 2 ? "20" + dm[3] : dm[3];
  const p = (pgo || "").toLowerCase();
  return {
    id: UID(), creado: Date.now(),
    fecha: `${y}-${dm[2].padStart(2,"0")}-${dm[1].padStart(2,"0")}`,
    producto: prod, monto: num(mRaw), cliente: cli || "",
    pago: p.includes("efec") ? "Efectivo" : p.includes("sinpe") ? "SINPE" : p.includes("tarj") ? "Tarjeta" : p ? "Otro" : "Efectivo"
  };
}

function ImportarVentasModal({ onClose, onSave }) {
  const [txt, setTxt] = useState("");
  const [prog, setProg] = useState(null);
  const [err, setErr] = useState(null);
  const filas = txt.split("\n").map((l)=>l.trim()).filter(Boolean).map(parseVenta).filter(Boolean);

  const subir = async () => {
    setErr(null); setProg({ hecho: 0, total: filas.length });
    try {
      await onSave(filas, (hecho, total) => setProg({ hecho, total }));
    } catch (e) {
      setErr((e.code || "error") + " · " + (e.message || ""));
      setProg(null);
    }
  };

  return (
    <Modal title="Pegar ventas desde el Sheets" onClose={onClose}>
      <p className="text-[13px] text-stone-600 mb-2 leading-relaxed">Orden esperado: fecha, producto, monto, cliente, pago.</p>
      <textarea value={txt} onChange={(e)=>setTxt(e.target.value)} rows={7} placeholder={"22/7/2026\tNutri salmon perro\t₡4,300\t\ttarjeta"} className="w-full px-3 py-2 border border-stone-300 rounded-md bg-stone-50 font-mono text-[12px]" />
      <div className="my-3 text-sm">
        {txt.trim() === "" ? <span className="text-stone-500">Esperando las filas.</span> : (
          <><Linea label="Filas reconocidas" val={String(filas.length)} fuerte /><Linea label="Suma" val={C(filas.reduce((a,f)=>a+f.monto,0))} /></>
        )}
      </div>
      {prog && (
        <div className="mb-3">
          <div className="h-2 bg-stone-200 rounded-full overflow-hidden"><div className="h-full bg-stone-900" style={{ width: (prog.hecho/prog.total*100)+"%" }} /></div>
          <div className="font-mono text-[12px] mt-1">Subiendo {prog.hecho} de {prog.total}…</div>
        </div>
      )}
      {err && <p className="text-[12px] text-stone-800 border border-stone-400 rounded-md p-2 mb-3">● Se cortó la subida: <span className="font-mono">{err}</span></p>}
      <Btn kind="warn" className="w-full py-3" disabled={!filas.length || prog} onClick={subir}>Importar {filas.length || ""}</Btn>
    </Modal>
  );
}

/* ================= CIERRE DE CAJA ================= */
function CierreModal({ fecha, ventas, gastos, cierres, cfg, guardar, usuario, aviso, onClose }) {
  const fondo = cfg.fondoCaja || 0;

  /* último cierre anterior a la fecha que se está cerrando */
  const previo = cierres.filter((c)=>c.fecha < fecha).sort((a,b)=>(a.fecha<b.fecha?-1:1)).slice(-1)[0] || null;
  const desde = previo ? previo.fecha : null;
  const enRango = (f) => f <= fecha && (!desde || f > desde);

  const monedasPrev = previo ? (previo.monedas != null ? previo.monedas : 0) : 0;
  const [billetes, setBilletes] = useState("");
  const [monedas, setMonedas] = useState(String(monedasPrev || ""));
  const [nota, setNota] = useState("");

  const efeVentas = ventas.filter((v)=>v.pago==="Efectivo" && enRango(v.fecha)).reduce((a,v)=>a+v.monto,0);
  const efeGastos = gastos.filter((g)=>g.pago==="Efectivo" && enRango(g.fecha)).reduce((a,g)=>a+g.monto,0);
  const esperado = fondo + monedasPrev + efeVentas - efeGastos;

  const bil = num(billetes), mon = num(monedas);
  const contado = bil + mon;
  const dif = billetes === "" ? null : contado - esperado;
  const retiro = billetes === "" ? null : bil - fondo;

  const yaCerrado = cierres.find((c)=>c.fecha===fecha);
  const previos = [...cierres].sort((a,b)=>(a.fecha<b.fecha?1:-1)).slice(0,7);
  const acumulado = cierres.reduce((a,c)=>a+(c.diferencia||0),0);

  const guardarCierre = async () => {
    await guardar("cierres", {
      id: fecha, fecha, fondo, monedasPrev, billetes: bil, monedas: mon,
      esperado, contado, diferencia: contado - esperado,
      retiro: Math.max(0, bil - fondo),
      nota: nota.trim(), usuario, creado: Date.now()
    });
    aviso("Caja cerrada");
    onClose();
  };

  return (
    <Modal title={"Cerrar caja · " + fmtFecha(fecha)} onClose={onClose}>
      <div className="bg-stone-100 rounded-md p-3 mb-3 space-y-1">
        <Linea label="Fondo en billetes" val={C(fondo)} />
        {monedasPrev > 0 && <Linea label="Monedas del cierre anterior" val={"+ " + C(monedasPrev)} />}
        <Linea label={desde ? `Ventas en efectivo desde el ${fmtFecha(desde)}` : "Ventas en efectivo"} val={"+ " + C(efeVentas)} />
        <Linea label="Pagos en efectivo" val={"− " + C(efeGastos)} />
        <div className="pt-2 mt-1 border-t border-stone-300">
          <Linea label="Debería haber en total" val={C(esperado)} fuerte />
        </div>
      </div>

      <div className="mb-3">
        <Lbl>Billetes contados</Lbl>
        <Inp inputMode="decimal" value={billetes} onChange={(e)=>setBilletes(e.target.value)} placeholder="0" className="font-mono tabular-nums text-2xl" />
        <p className="text-[11px] text-stone-500 mt-1">Solo los billetes. Es lo que se puede depositar en el cajero.</p>
      </div>

      <div className="mb-3">
        <Lbl>Monedas y menudo</Lbl>
        <Inp inputMode="decimal" value={monedas} onChange={(e)=>setMonedas(e.target.value)} placeholder="0" className="font-mono tabular-nums text-lg" />
        <p className="text-[11px] text-stone-500 mt-1">
          {monedasPrev > 0
            ? `Viene puesto lo del cierre anterior (${C(monedasPrev)}). Si no las contaste, dejalo así: la diferencia de abajo va a reflejar solo los billetes.`
            : "Si no las contás, poné un aproximado. Queda en la caja, no se deposita."}
        </p>
      </div>

      {retiro !== null && retiro > 0 && (
        <div className="bg-stone-100 rounded-md p-3 mb-3">
          <Linea label={`Llevá al banco y dejá ${C(fondo)} en billetes`} val={C(retiro)} fuerte />
          <p className="text-[11px] text-stone-500 mt-1">Las {C(mon)} en monedas se quedan en la caja. Queda en "por depositar" hasta que lo registrés en Dinero.</p>
        </div>
      )}
      {retiro !== null && retiro < 0 && (
        <p className="text-[12px] text-stone-700 border border-stone-400 rounded-md p-2 mb-3">
          ● Hay menos de {C(fondo)} en billetes. Faltan {C(Math.abs(retiro))} para completar el fondo antes de abrir mañana.
        </p>
      )}

      {dif !== null && (
        <div className="border border-stone-400 rounded-md p-3 mb-3">
          <div className="flex justify-between items-baseline">
            <span className="text-sm font-medium">{Math.abs(dif) < 0.005 ? "○ Cuadra exacto" : dif > 0 ? "◐ Sobra" : "● Falta"}</span>
            <span className="font-mono tabular-nums text-xl font-semibold">{C(Math.abs(dif))}</span>
          </div>
          {Math.abs(dif) >= 0.005 && (
            <p className="text-[12px] text-stone-600 mt-2 leading-relaxed">
              {Math.abs(dif) <= 1000
                ? "Una diferencia chica casi siempre son monedas que no se contaron. Anotala igual: lo que importa es si se repite."
                : "Diferencia grande para ser solo menudo. Revisá si quedó alguna venta sin registrar o un pago sin anotar."}
            </p>
          )}
        </div>
      )}

      <div className="mb-4">
        <Lbl>Nota (opcional)</Lbl>
        <Inp value={nota} onChange={(e)=>setNota(e.target.value)} placeholder="Se pagó un mandado, faltó vuelto…" />
      </div>

      {yaCerrado && <p className="text-[12px] text-stone-600 mb-3">◐ Esta fecha ya tiene un cierre guardado. Si guardás, lo reemplaza.</p>}

      <Btn kind="warn" className="w-full py-3" disabled={billetes===""} onClick={guardarCierre}>Guardar cierre</Btn>

      {previos.length>0 && (
        <div className="mt-4 pt-3 border-t border-stone-200">
          <div className="text-[11px] uppercase tracking-wide text-stone-500 mb-2">Últimos cierres</div>
          {previos.map((c)=>(
            <div key={c.id} className="flex justify-between py-1 text-[13px]">
              <span className="font-mono text-stone-600">{fmtFecha(c.fecha)}</span>
              <span className="font-mono tabular-nums">
                {Math.abs(c.diferencia||0) < 0.005 ? "○ cuadró" : ((c.diferencia > 0 ? "◐ sobró " : "● faltó ") + C(Math.abs(c.diferencia)))}
              </span>
            </div>
          ))}
          <div className="flex justify-between pt-2 mt-1 border-t border-stone-200 text-[13px] font-medium">
            <span>Acumulado histórico</span>
            <span className="font-mono tabular-nums">{Math.abs(acumulado) < 0.005 ? "cuadrado" : (acumulado > 0 ? "sobra " : "falta ") + C(Math.abs(acumulado))}</span>
          </div>
        </div>
      )}
    </Modal>
  );
}

/* gráfico de barras diario, monocromo */
function GraficoDias({ datos, referencia }) {
  if (!datos.length) return null;
  const W = 720, H = 190, padL = 8, padR = 8, padB = 26, padT = 12;
  const max = Math.max(...datos.map((d)=>d.t), referencia || 0) * 1.1 || 1;
  const ancho = (W - padL - padR) / datos.length;
  const barW = Math.max(3, Math.min(30, ancho * 0.62));
  const yDe = (v) => padT + (H - padT - padB) * (1 - v / max);
  const cada = datos.length > 20 ? 5 : datos.length > 12 ? 3 : 2;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: "auto" }} preserveAspectRatio="none">
      <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke="#d6d3d1" strokeWidth="1" />
      {referencia > 0 && (
        <>
          <line x1={padL} y1={yDe(referencia)} x2={W-padR} y2={yDe(referencia)} stroke="#78716c" strokeWidth="1.5" strokeDasharray="6 4" />
          <text x={W-padR} y={yDe(referencia)-5} textAnchor="end" fontSize="10" fill="#78716c" fontFamily="ui-monospace, monospace">
            meta diaria {C(referencia)}
          </text>
        </>
      )}
      {datos.map((d,i)=>{
        const x = padL + i*ancho + (ancho-barW)/2;
        const y = yDe(d.t);
        const alto = Math.max(1, (H - padB) - y);
        const bajo = referencia > 0 && d.t < referencia;
        return (
          <g key={d.f}>
            <rect x={x} y={y} width={barW} height={alto} rx="2"
              fill={bajo ? "#ffffff" : "#292524"} stroke="#292524" strokeWidth={bajo ? 1.5 : 0} />
            {i % cada === 0 && (
              <text x={x+barW/2} y={H-padB+13} textAnchor="middle" fontSize="9" fill="#a8a29e" fontFamily="ui-monospace, monospace">
                {d.f.slice(8)}
              </text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

/* ================= DINERO ================= */
const EN_BANCO = ["SINPE", "Tarjeta", "Otro"];

const ACREDITA = [
  [0, "El mismo día, al instante"],
  [1, "En la madrugada del día siguiente"],
  [2, "A los dos días"],
  [3, "A los tres días"],
];
/* ¿este movimiento ya entró en ese cierre? compara fecha y, si es el mismo día, la hora */
const dentroDelCierre = (mov, cierre) => {
  if (!cierre) return false;
  if (mov.fecha < cierre.fecha) return true;
  if (mov.fecha > cierre.fecha) return false;
  return (mov.creado || 0) <= (cierre.creado || 0);
};

const descTarjeta = (n) =>
  n <= 0 ? "" : n === 1 ? "las de hoy, entran en la madrugada" : `las de los últimos ${n} días`;

function Dinero({ ventas, gastos, cierres, movs, cfg, guardar, borrar, aviso, usuario }) {
  const [depositar, setDepositar] = useState(false);
  const [ajustar, setAjustar] = useState(false);

  const fondo = cfg.fondoCaja || 0;

  /* --- caja física --- */
  const ordenados = [...cierres].sort((a,b)=>(a.fecha<b.fecha?-1:1));
  const ultimo = ordenados.length ? ordenados[ordenados.length-1] : null;
  const ultimoCierre = ultimo ? ultimo.fecha : null;
  const monedas = ultimo ? (ultimo.monedas != null ? ultimo.monedas : 0) : 0;
  const abierto = (m) => !dentroDelCierre(m, ultimo);
  const efeEntra = ventas.filter((v)=>v.pago==="Efectivo" && abierto(v)).reduce((a,v)=>a+v.monto,0);
  const efeSale = gastos.filter((g)=>g.pago==="Efectivo" && abierto(g)).reduce((a,g)=>a+g.monto,0);
  const caja = fondo + monedas + efeEntra - efeSale;

  /* --- pendiente de depositar --- */
  const retirado = cierres.reduce((a,c)=>a+(c.retiro||0),0);
  const depositos = movs.filter((m)=>m.tipo==="deposito");
  const depositado = depositos.reduce((a,m)=>a+m.monto,0);
  const porDepositar = retirado - depositado;

  /* --- banco --- */
  const ajustes = movs.filter((m)=>m.tipo==="ajuste");
  const entraBanco = ventas.filter((v)=>EN_BANCO.includes(v.pago)).reduce((a,v)=>a+v.monto,0);
  const saleBanco = gastos.filter((g)=>EN_BANCO.includes(g.pago)).reduce((a,g)=>a+g.monto,0);
  const ajustesTotal = ajustes.reduce((a,m)=>a+m.monto,0);
  const banco = (cfg.saldoBanco||0) + entraBanco - saleBanco + depositado + ajustesTotal;

  /* ventas por tarjeta que el banco todavía no acredita */
  const corte = new Date(); corte.setDate(corte.getDate() - (cfg.diasTarjeta||0));
  const corteISO = corte.toLocaleDateString("en-CA");
  const tarjetaPend = ventas.filter((v)=>v.pago==="Tarjeta" && v.fecha > corteISO).reduce((a,v)=>a+v.monto,0);
  const bancoAcreditado = banco - tarjetaPend;

  const totalNegocio = caja + porDepositar + banco;

  /* cierres que generaron el pendiente, del más viejo al más nuevo */
  const pendientes = useMemo(()=>{
    const cs = cierres.filter((c)=>(c.retiro||0)>0).sort((a,b)=>(a.fecha<b.fecha?-1:1));
    let cubierto = depositado, out = [];
    cs.forEach((c)=>{
      const r = c.retiro||0;
      if (cubierto >= r) { cubierto -= r; return; }
      out.push({ ...c, falta: r - cubierto });
      cubierto = 0;
    });
    return out.reverse();
  }, [cierres, depositado]);

  const historial = [...movs].sort((a,b)=>(a.fecha<b.fecha?1:a.fecha>b.fecha?-1:(b.creado||0)-(a.creado||0)));

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <KPI k="Total del negocio" v={C(totalNegocio)} sub="caja + pendiente + banco" oscuro />
        <KPI k="En la caja" v={C(caja)} sub={monedas>0 ? `incluye ${C(monedas)} en monedas` : (ultimoCierre ? "desde el " + fmtFecha(ultimoCierre) : "sin cierres")} />
        <KPI k="Por depositar" v={C(porDepositar)} sub={porDepositar>0 ? "◐ fuera del banco" : "○ al día"} />
        <KPI k="En el banco" v={C(banco)} sub={tarjetaPend>0 ? `${C(tarjetaPend)} de tarjeta sin acreditar` : "SINPE, tarjeta y depósitos"} />
      </div>

      <div className="grid lg:grid-cols-2 gap-4 items-start">
      <Card className="p-4">
        <div className="text-[11px] uppercase tracking-[0.15em] text-stone-500 mb-3">Dónde está la plata</div>

        <div className="space-y-3">
          <div>
            <div className="flex justify-between items-baseline">
              <div>
                <div className="text-sm font-medium">En la caja</div>
                <div className="text-[11px] text-stone-500">{ultimoCierre ? "desde el cierre del " + fmtFecha(ultimoCierre) : "sin cierres todavía"}</div>
              </div>
              <span className="font-mono tabular-nums text-lg">{C(caja)}</span>
            </div>
            <div className="pl-3 mt-1 border-l-2 border-stone-300 space-y-0.5">
              <div className="flex justify-between text-[12px] text-stone-600">
                <span>Fondo en billetes</span><span className="font-mono tabular-nums">{C(fondo)}</span>
              </div>
              <div className="flex justify-between text-[12px] text-stone-600">
                <span>Monedas y menudo</span><span className="font-mono tabular-nums">{C(monedas)}</span>
              </div>
              <div className="flex justify-between text-[12px] text-stone-600">
                <span>Ventas en efectivo sin cerrar</span><span className="font-mono tabular-nums">+ {C(efeEntra)}</span>
              </div>
              <div className="flex justify-between text-[12px] text-stone-600">
                <span>Pagos en efectivo sin cerrar</span><span className="font-mono tabular-nums">− {C(efeSale)}</span>
              </div>
            </div>
          </div>

          <div className="flex justify-between items-baseline">
            <div>
              <div className="text-sm font-medium">
                {porDepositar > 0 && <span className="text-stone-500 mr-1.5">◐</span>}
                Por depositar
              </div>
              <div className="text-[11px] text-stone-500">{porDepositar > 0 ? "retirado de la caja y aún fuera del banco" : "todo depositado"}</div>
            </div>
            <span className="font-mono tabular-nums text-lg">{C(porDepositar)}</span>
          </div>

          <div className="flex justify-between items-baseline">
            <div>
              <div className="text-sm font-medium">En el banco</div>

            <span className="font-mono tabular-nums text-lg">{C(banco)}</span>
          </div>

          <div className="pl-3 border-l-2 border-stone-300 space-y-0.5">
            <div className="flex justify-between text-[12px] text-stone-600">
              <span>Saldo inicial configurado</span><span className="font-mono tabular-nums">{C(cfg.saldoBanco||0)}</span>
            </div>
            <div className="flex justify-between text-[12px] text-stone-600">
              <span>Ventas por SINPE y tarjeta</span><span className="font-mono tabular-nums">+ {C(entraBanco)}</span>
            </div>
            <div className="flex justify-between text-[12px] text-stone-600">
              <span>Depósitos registrados</span><span className="font-mono tabular-nums">+ {C(depositado)}</span>
            </div>
            <div className="flex justify-between text-[12px] text-stone-600">

        </div>

      {porDepositar > 0 && (
        <Card className="p-4">
          <div className="text-[11px] uppercase tracking-[0.15em] text-stone-500 mb-2">Falta llevar al banco</div>

            <div key={c.id} className="flex justify-between py-1.5 border-b border-stone-100 last:border-0 text-[13px]">

                {diasDesde(new Date(c.fecha+"T12:00").getTime()) > 5 && <span className="text-stone-900 mr-1">●</span>}
                {fmtFecha(c.fecha)}
                <span className="text-stone-400"> · hace {diasDesde(new Date(c.fecha+"T12:00").getTime())} días</span>
              </span>
              <span className="font-mono tabular-nums">{C(c.falta)}</span>
            </div>
          ))}
          <Btn kind="warn" className="w-full mt-3 py-3" onClick={()=>setDepositar(true)}>Registrar depósito</Btn>
          {pendientes.some((c)=>diasDesde(new Date(c.fecha+"T12:00").getTime()) > 5) && (
            <p className="text-[11px] text-stone-500 mt-2">● lleva más de 5 días fuera del banco.</p>
          )}

        <DepositoModal
          sugerido={Math.max(0, porDepositar)}

function DepositoModal({ sugerido, porDepositar, guardar, usuario, aviso, onClose }) {
  const [fecha, setFecha] = useState(hoyISO());
  const [monto, setMonto] = useState(String(sugerido || ""));
  const [nota, setNota] = useState("");
  const m = num(monto);
  const queda = porDepositar - m;

  return (
    <Modal title="Registrar depósito" onClose={onClose}>
      <p className="text-[13px] text-stone-600 mb-3 leading-relaxed">
        La plata que sacaste de la caja y llevaste al banco. Sale de "por depositar" y entra al saldo bancario.
      </p>
      <div className="grid grid-cols-3 gap-2 mb-3">
        <div className="col-span-2"><Lbl>Fecha</Lbl><Inp type="date" value={fecha} onChange={(e)=>setFecha(e.target.value)} className="font-mono" /></div>
        <div><Lbl>Monto</Lbl><Inp inputMode="decimal" value={monto} onChange={(e)=>setMonto(e.target.value)} className="font-mono tabular-nums text-lg" /></div>
      </div>
      <div className="mb-3"><Lbl>Nota (opcional)</Lbl><Inp value={nota} onChange={(e)=>setNota(e.target.value)} placeholder="Depósito BAC, comprobante 4471" /></div>

      <div className="bg-stone-100 rounded-md p-3 mb-3 space-y-1">
        <Linea label="Estaba pendiente" val={C(porDepositar)} />
        <Linea label="Se deposita" val={C(m)} />
        <div className="pt-2 mt-1 border-t border-stone-300">
          <Linea label={queda >= 0 ? "Queda pendiente" : "Se depositó de más"} val={C(Math.abs(queda))} fuerte />
        </div>
      </div>
      {queda < 0 && <p className="text-[12px] text-stone-700 border border-stone-400 rounded-md p-2 mb-3">◐ Estás depositando más de lo que salió de la caja. Si es plata de otro lado, mejor registrala como ajuste de banco.</p>}

      <Btn kind="warn" className="w-full py-3" disabled={m<=0} onClick={async ()=>{
        await guardar("movimientos", { id: UID(), tipo:"deposito", fecha, monto: m, nota: nota.trim(), usuario, creado: Date.now() });
        aviso("Depósito registrado · " + C(m));
        onClose();
      }}>Guardar depósito</Btn>
    </Modal>
  );
}

const RAZONES = [
  "Ventas de tarjeta sin acreditar",
  "Comisión del banco",
  "Intereses ganados",
  "Traslado a cuenta personal",
  "Entró plata de otro lado",
  "Venta o gasto que no se registró",
  "Error de digitación",
];

function AjusteBancoModal({ banco, bancoAcreditado, tarjetaPend, cfg, guardar, usuario, aviso, onClose }) {
  const [modo, setModo] = useState("cuadrar");
  const [fecha, setFecha] = useState(hoyISO());
  const [saldoReal, setSaldoReal] = useState("");
  const [excluirTarjeta, setExcluirTarjeta] = useState(tarjetaPend > 0);
  const [signo, setSigno] = useState("mas");
  const [monto, setMonto] = useState("");
  const [razon, setRazon] = useState("");
  const [nota, setNota] = useState("");

  const base = excluirTarjeta ? bancoAcreditado : banco;
  const real = num(saldoReal);
  const difCuadre = saldoReal === "" ? null : real - base;

  const manual = num(monto) * (signo === "mas" ? 1 : -1);
  const ajuste = modo === "cuadrar" ? (difCuadre || 0) : manual;
  const motivo = [razon, nota.trim()].filter(Boolean).join(" · ");
  const listo = motivo !== "" && Math.abs(ajuste) > 0.004;

  const guardarAjuste = async () => {
    await guardar("movimientos", {
      id: UID(), tipo: "ajuste", fecha, monto: ajuste, nota: motivo,
      saldoAntes: banco, saldoDespues: banco + ajuste,
      metodo: modo === "cuadrar" ? "cuadre" : "manual",
      excluyoTarjeta: modo === "cuadrar" ? excluirTarjeta : false,
      usuario, creado: Date.now()
    });
    aviso("Banco cuadrado");
    onClose();
  };

  return (
    <Modal title="Cuadrar banco" onClose={onClose}>
      <div className="grid grid-cols-2 gap-1.5 mb-3">
        {[["cuadrar","Poner el saldo real"],["manual","Sumar o restar"]].map(([id,l])=>(
          <button key={id} onClick={()=>setModo(id)} className={"py-2 rounded-md border text-[13px] " + (modo===id ? "bg-stone-900 text-white border-stone-900" : "bg-white border-stone-300")}>{l}</button>
        ))}
      </div>

      {modo === "cuadrar" ? (
        <>
          <p className="text-[13px] text-stone-600 mb-3 leading-relaxed">
            Escribí lo que dice el estado de cuenta y la app calcula sola la diferencia.
          </p>

          <div className="mb-3">
            <Lbl>Saldo real en la cuenta</Lbl>
            <Inp inputMode="decimal" value={saldoReal} onChange={(e)=>setSaldoReal(e.target.value)} placeholder="181019,28" className="font-mono tabular-nums text-2xl" />
            <p className="text-[11px] text-stone-500 mt-1">Se puede escribir con coma para los céntimos.</p>
          </div>

          {tarjetaPend > 0 && (
            <button
              onClick={()=>setExcluirTarjeta(!excluirTarjeta)}
              className="w-full text-left px-3 py-2 border border-stone-300 rounded-md bg-stone-50 mb-3"
            >
              <div className="text-[13px]">
                {excluirTarjeta ? "○" : "—"} Ese saldo aún no incluye las tarjetas
              </div>
              <div className="text-[11px] text-stone-500 mt-0.5">
                {C(tarjetaPend)} en tarjetas de hoy quedan fuera de la comparación
              </div>
            </button>
          )}

          <div className="bg-stone-100 rounded-md p-3 mb-3 space-y-1">
            <Linea label="La app dice que hay" val={C(banco)} />
            {excluirTarjeta && tarjetaPend > 0 && (
              <>
                <Linea label="Menos tarjeta sin acreditar" val={"− " + C(tarjetaPend)} />
                <Linea label="Comparable con el banco" val={C(bancoAcreditado)} />
              </>
            )}
            {difCuadre !== null && (
              <div className="pt-2 mt-1 border-t border-stone-300">
                <Linea
                  label={Math.abs(difCuadre) < 0.005 ? "○ Cuadra exacto" : difCuadre > 0 ? "◐ Hay más en el banco" : "● Hay menos en el banco"}
                  val={C(Math.abs(difCuadre))}
                  fuerte
                />
              </div>
            )}
          </div>
        </>
      ) : (
        <>
          <p className="text-[13px] text-stone-600 mb-3 leading-relaxed">
            Para sumar o restar un monto puntual sin tocar el resto del cálculo.
          </p>
          <div className="grid grid-cols-2 gap-1.5 mb-3">
            {[["mas","Entró al banco"],["menos","Salió del banco"]].map(([id,l])=>(
              <button key={id} onClick={()=>setSigno(id)} className={"py-2 rounded-md border text-[13px] " + (signo===id ? "bg-stone-900 text-white border-stone-900" : "bg-white border-stone-300")}>{l}</button>
            ))}
          </div>
          <div className="mb-3">
            <Lbl>Monto</Lbl>
            <Inp inputMode="decimal" value={monto} onChange={(e)=>setMonto(e.target.value)} className="font-mono tabular-nums text-2xl" />
          </div>
          <div className="bg-stone-100 rounded-md p-3 mb-3 space-y-1">
            <Linea label="Saldo actual" val={C(banco)} />
            <Linea label="Queda en" val={C(banco + manual)} fuerte />
          </div>
        </>
      )}

      <div className="mb-3">
        <Lbl>A qué se debe · obligatorio</Lbl>
        <div className="flex flex-wrap gap-1.5 mb-2">
          {RAZONES.map((r)=>(
            <button key={r} onClick={()=>setRazon(razon===r ? "" : r)} className={"px-2.5 py-1.5 rounded-full border text-[12px] " + (razon===r ? "bg-stone-900 text-white border-stone-900" : "bg-white border-stone-300")}>{r}</button>
          ))}
        </div>
        <Inp value={nota} onChange={(e)=>setNota(e.target.value)} placeholder="Detalle, número de comprobante…" />
      </div>

      <div className="mb-3">
        <Lbl>Fecha</Lbl>
        <Inp type="date" value={fecha} onChange={(e)=>setFecha(e.target.value)} className="font-mono" />
      </div>

      {!motivo && Math.abs(ajuste) > 0.004 && (
        <p className="text-[12px] text-stone-700 border border-stone-400 rounded-md p-2 mb-3">
          ● Falta la razón. Sin eso, en tres meses nadie va a saber por qué se movió el saldo.
        </p>
      )}

      <Btn kind="warn" className="w-full py-3" disabled={!listo} onClick={guardarAjuste}>
        {modo === "cuadrar" ? "Cuadrar en " + C(real || base) : "Guardar ajuste"}
      </Btn>
    </Modal>
  );
}

/* ================= PRECIOS ================= */
function Precios({ precios, cfg, guardar, borrar, aviso }) {
  const [q, setQ] = useState(""); const [edit, setEdit] = useState(null);
  const [imp, setImp] = useState(false); const [soloBajos, setSoloBajos] = useState(false);

  const dups = useMemo(()=>{
    const c = {}; precios.forEach((p)=>(c[norm(p.nombre)] = (c[norm(p.nombre)]||0)+1));
    return new Set(Object.keys(c).filter((k)=>c[k]>1));
  }, [precios]);

  const lista = precios
    .filter((p)=>!q || norm(p.nombre).includes(norm(q)))
    .filter((p)=>{
      if (!soloBajos) return true;
      const mg = p.precioKilo>0 && p.peso>0 ? margen(p.precioKilo, p.costo/p.peso) : null;
      const ms = p.precioSaco>0 ? margen(p.precioSaco, p.costo) : null;
      return (mg!==null && mg<cfg.margenGranel) || (ms!==null && ms<cfg.margenSaco);
    })
    .sort((a,b)=>a.nombre.localeCompare(b.nombre));

  return (
    <div>
      <div className="flex gap-2 mb-3">
        <Btn className="flex-1" onClick={()=>setEdit({ nuevo:true })}>+ Artículo</Btn>
        <Btn kind="ghost" className="flex-1" onClick={()=>setImp(true)}>Pegar tabla</Btn>
      </div>

      {precios.length === 0 ? (
        <Card className="p-6 text-center">
          <div className="text-sm text-stone-700 mb-1">Cargá tu tabla de costos</div>
          <p className="text-[13px] text-stone-500 leading-relaxed">Con "Pegar tabla" copiás las filas del Excel tal cual y la app recalcula el margen real de cada artículo.</p>
        </Card>
      ) : (
        <>
          <Inp placeholder="Buscar artículo…" value={q} onChange={(e)=>setQ(e.target.value)} className="mb-2" />
          <div className="flex justify-between items-center mb-3 px-1">
            <button onClick={()=>setSoloBajos(!soloBajos)} className="text-[12px] text-stone-600 underline">{soloBajos ? "Ver todos" : "Ver solo los que van bajo la meta"}</button>
            <span className="text-[11px] text-stone-500 font-mono">{lista.length} de {precios.length}</span>
          </div>
          <div className="space-y-2 lg:space-y-0 lg:grid lg:grid-cols-2 lg:gap-3">
            {lista.map((p)=>{
              const ck = p.peso>0 ? p.costo/p.peso : 0;
              const mg = p.precioKilo>0 ? margen(p.precioKilo, ck) : null;
              const ms = p.precioSaco>0 ? margen(p.precioSaco, p.costo) : null;
              const ig = ind(mg, cfg.margenGranel), is = ind(ms, cfg.margenSaco);
              return (
                <Card key={p.id} className="p-3">
                  <button onClick={()=>setEdit(p)} className="w-full text-left">
                    <div className="flex justify-between items-start gap-2">
                      <span className="text-sm font-medium">{p.nombre}{dups.has(norm(p.nombre)) && <span className="text-stone-500 ml-1.5">◐</span>}</span>
                      <span className="font-mono tabular-nums text-[12px] text-stone-500 shrink-0">{p.peso} {p.unidad || "kg"}</span>
                    </div>
                    <div className="font-mono tabular-nums text-[11px] text-stone-500 mt-0.5">
                      Costo {C(p.costo)} · {C(ck)} por {p.unidad==="u" ? "unidad" : "kilo"}
                      {p.actualizado && <span className={diasDesde(p.actualizado) > 60 ? "text-stone-900" : ""}> · {diasDesde(p.actualizado) > 60 ? "● " : ""}hace {diasDesde(p.actualizado)} días</span>}
                    </div>
                    <div className="grid grid-cols-2 gap-2 mt-2 text-[12px]">
                      <div className="bg-stone-50 rounded-md p-2">
                        <div className="text-[10px] uppercase tracking-wide text-stone-500">Granel</div>
                        <div className="font-mono tabular-nums">{p.precioKilo>0 ? C(p.precioKilo) : "—"}</div>
                        <div className="font-mono tabular-nums text-[11px] text-stone-600">{ig.s} {mg===null ? "sin precio" : mg.toFixed(0)+"%"}</div>
                      </div>
                      <div className="bg-stone-50 rounded-md p-2">
                        <div className="text-[10px] uppercase tracking-wide text-stone-500">Saco completo</div>
                        <div className="font-mono tabular-nums">{p.precioSaco>0 ? C(p.precioSaco) : "—"}</div>
                        <div className="font-mono tabular-nums text-[11px] text-stone-600">{is.s} {ms===null ? "sin precio" : ms.toFixed(0)+"%"}</div>
                      </div>
                    </div>
                  </button>
                </Card>
              );
            })}
          </div>
          <p className="text-[11px] text-stone-500 leading-relaxed mt-3">★ sobre la meta · ○ en meta · ◐ apenas debajo · ● margen muy bajo · — falta precio. Metas: granel {cfg.margenGranel}%, saco {cfg.margenSaco}%.</p>
        </>
      )}

      {edit && <PrecioModal p={edit.nuevo ? null : edit} cfg={cfg} onClose={()=>setEdit(null)}
        onSave={async (np)=>{ await guardar("precios", np); setEdit(null); aviso("Artículo guardado"); }}
        onDelete={async (id)=>{ await borrar("precios", id); setEdit(null); aviso("Artículo eliminado"); }} />}

      {imp && <ImportPreciosModal onClose={()=>setImp(false)} onSave={async (filas)=>{
        await window.FB.guardarLote("precios", filas);
        setImp(false); aviso(filas.length + " artículos cargados");
      }} />}
    </div>
  );
}

function PrecioModal({ p, cfg, onClose, onSave, onDelete }) {
  const [f, setF] = useState(p || { id: UID(), nombre:"", peso:"", costo:"", precioKilo:"", precioSaco:"", unidad:"kg" });
  const peso = num(f.peso), costo = num(f.costo);
  const ck = peso>0 ? costo/peso : 0;
  const mg = num(f.precioKilo)>0 ? margen(num(f.precioKilo), ck) : null;
  const ms = num(f.precioSaco)>0 ? margen(num(f.precioSaco), costo) : null;

  return (
    <Modal title={p ? "Editar artículo" : "Nuevo artículo"} onClose={onClose}>
      <div className="mb-3"><Lbl>Artículo</Lbl><Inp value={f.nombre} onChange={(e)=>setF({...f, nombre:e.target.value})} placeholder="Dog chow raza pequeña" /></div>
      <div className="grid grid-cols-3 gap-2 mb-3">
        <div><Lbl>Contenido</Lbl><Inp inputMode="decimal" value={f.peso} onChange={(e)=>setF({...f, peso:e.target.value})} className="font-mono" /></div>
        <div><Lbl>Unidad</Lbl><button onClick={()=>setF({...f, unidad: f.unidad==="kg" ? "u" : "kg"})} className="w-full px-3 py-2 border border-stone-300 rounded-md bg-stone-50 font-mono text-sm">{f.unidad==="kg" ? "kg" : "unid."}</button></div>
        <div><Lbl>Costo total</Lbl><Inp inputMode="decimal" value={f.costo} onChange={(e)=>setF({...f, costo:e.target.value})} className="font-mono" /></div>
      </div>
      <div className="bg-stone-100 rounded-md p-3 mb-3"><Linea label={`Costo por ${f.unidad==="kg" ? "kilo" : "unidad"}`} val={C(ck)} fuerte /></div>
      <div className="mb-3">
        <Lbl>Precio de venta al granel</Lbl>
        <Inp inputMode="decimal" value={f.precioKilo} onChange={(e)=>setF({...f, precioKilo:e.target.value})} className="font-mono text-lg" />
        <div className="flex justify-between text-[11px] mt-1">
          <span className="text-stone-500">Para {cfg.margenGranel}%: {C(ck/(1-cfg.margenGranel/100))}</span>
          <span className="font-mono">{mg===null ? "—" : ind(mg,cfg.margenGranel).s + " " + mg.toFixed(1)+"%"}</span>
        </div>
      </div>
      <div className="mb-4">
        <Lbl>Precio del saco o empaque completo</Lbl>
        <Inp inputMode="decimal" value={f.precioSaco} onChange={(e)=>setF({...f, precioSaco:e.target.value})} className="font-mono text-lg" />
        <div className="flex justify-between text-[11px] mt-1">
          <span className="text-stone-500">Para {cfg.margenSaco}%: {C(costo/(1-cfg.margenSaco/100))}</span>
          <span className="font-mono">{ms===null ? "—" : ind(ms,cfg.margenSaco).s + " " + ms.toFixed(1)+"%"}</span>
        </div>
        {num(f.precioKilo)>0 && num(f.precioSaco)>0 && peso>0 && (
          <p className="text-[11px] text-stone-500 mt-1">Comprando el saco pagan {C(num(f.precioSaco)/peso)} por {f.unidad==="kg" ? "kilo" : "unidad"}, {(100-(num(f.precioSaco)/peso/num(f.precioKilo))*100).toFixed(0)}% menos que al granel.</p>
        )}
      </div>
      <div className="flex gap-2">
        <Btn kind="warn" className="flex-1 py-3" disabled={!f.nombre} onClick={()=>onSave({ ...f, peso, costo, precioKilo: num(f.precioKilo), precioSaco: num(f.precioSaco), actualizado: Date.now() })}>Guardar</Btn>
        {p && <Btn kind="ghost" onClick={()=>onDelete(f.id)}>Eliminar</Btn>}
      </div>
    </Modal>
  );
}

function parsePrecio(l) {
  let f = l.split("\t"); if (f.length < 3) f = l.split(/\s{2,}/); if (f.length < 3) return null;
  const cel = f.map((x)=>(x||"").trim());
  const nombre = cel[0], peso = num(cel[1]), costo = num(cel[2]);
  if (!nombre || costo<=0 || peso<=0) return null;
  const final = num(cel[cel.length-1]), ck = costo/peso;
  const pareceSaco = peso>1 && final>ck*2 && Math.abs(final - costo*1.25)/(costo*1.25) < 0.2;
  return { id: UID(), nombre, peso, costo, unidad:"kg", precioKilo: pareceSaco ? 0 : final, precioSaco: pareceSaco ? final : 0, actualizado: Date.now(), _saco: pareceSaco };
}

      <textarea value={txt} onChange={(e)=>setTxt(e.target.value)} rows={7} placeholder={"Dog chow raza pequeña\t25\t₡42,500\t₡1,700\t20%\t₡2,125\t₡2,200"} className="w-full px-3 py-2 border border-stone-300 rounded-md bg-stone-50 font-mono text-[12px]" />
      <div className="my-3 text-sm">

            <Linea label="Artículos reconocidos" val={String(filas.length)} fuerte />
            {sacos.length>0 && <p className="text-[12px] text-stone-600 mt-2 leading-relaxed">◐ En {sacos.length} filas el precio parece ser del empaque completo ({sacos.slice(0,3).map((s)=>s.nombre).join(", ")}{sacos.length>3?"…":""}). Se guardan como precio de saco.</p>}
          </>
        )}
      </div>
