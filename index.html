  );
}

function Dinero({ ventas, gastos, cierres, movs, precios, enlaces, fijos, cfg, guardar, borrar, aviso, usuario }) {
  const [mes, setMes] = useState(mesDe(hoyISO()));
  const [depositar, setDepositar] = useState(false);
  const [ajustar, setAjustar] = useState(false);
  const [auditar, setAuditar] = useState(false);
  const [socio, setSocio] = useState(null);
  const [pagando, setPagando] = useState(null);

  const fondo = cfg.fondoCaja || 0;

  /* --- caja física --- */
  const ordenados = [...cierres].sort((a,b)=>(a.fecha<b.fecha?-1:1));
  const ultimo = ordenados.length ? ordenados[ordenados.length-1] : null;
  const ultimoCierre = ultimo ? ultimo.fecha : null;
  const monedas = ultimo ? (ultimo.monedas != null ? ultimo.monedas : 0) : 0;
  const gastosPlata = useMemo(()=>normPlata(gastos), [gastos]);
  const deudas = useMemo(()=>porVencer(gastos), [gastos]);
  const porPagar = deudas.reduce((a,g)=>a+g.monto,0);

  const abierto = (m) => !dentroDelCierre(m, ultimo);
  const efeEntra = ventas.filter((v)=>v.pago==="Efectivo" && abierto(v)).reduce((a,v)=>a+v.monto,0);
  const efeSale = gastosPlata.filter((g)=>g.pago==="Efectivo" && abierto(g)).reduce((a,g)=>a+g.monto,0);
  const caja = fondo + monedas + efeEntra - efeSale;

  /* --- pendiente de depositar --- */
  const retirado = cierres.reduce((a,c)=>a+(c.retiro||0),0);
  const depositos = movs.filter((m)=>m.tipo==="deposito");
  const depositado = depositos.reduce((a,m)=>a+m.monto,0);
  const porDepositar = retirado - depositado;

  /* --- banco --- */
  const ajustes = movs.filter((m)=>m.tipo==="ajuste");
  const entraBanco = ventas.filter((v)=>EN_BANCO.includes(v.pago)).reduce((a,v)=>a+v.monto,0);
  const saleBanco = gastosPlata.filter((g)=>EN_BANCO.includes(g.pago)).reduce((a,g)=>a+g.monto,0);
  const ajustesTotal = ajustes.reduce((a,m)=>a+m.monto,0);
  const banco = (cfg.saldoBanco||0) + entraBanco - saleBanco + depositado + ajustesTotal;

  /* ventas por tarjeta que el banco todavía no acredita */
  const corte = new Date(); corte.setDate(corte.getDate() - (cfg.diasTarjeta||0));
  const corteISO = corte.toLocaleDateString("en-CA");
  const tarjetaPend = ventas.filter((v)=>v.pago==="Tarjeta" && v.fecha > corteISO).reduce((a,v)=>a+v.monto,0);
  const bancoAcreditado = banco - tarjetaPend;

  const totalNegocio = caja + porDepositar + banco;

  /* ---------- movimiento del mes ---------- */
  const meses = useMemo(()=>[...new Set([...ventas,...gastos].map((x)=>mesDe(x.fecha)))].sort().reverse(), [ventas,gastos]);
  const vMes = ventas.filter((v)=>mesDe(v.fecha)===mes);
  const gMes = gastosPlata.filter((g)=>mesDe(g.fecha)===mes);
  const ajMes = ajustes.filter((m)=>mesDe(m.fecha)===mes).reduce((a,m)=>a+m.monto,0);

  const ventasMes = vMes.reduce((a,v)=>a+v.monto,0);
  const merca = gMes.filter((g)=>g.categoria==="Mercadería").reduce((a,g)=>a+g.monto,0);
  const fijosMes = gMes.filter((g)=>g.fijoId).reduce((a,g)=>a+g.monto,0);
  const otrosMes = gMes.filter((g)=>g.categoria!=="Mercadería" && !g.fijoId).reduce((a,g)=>a+g.monto,0);
  const gastosMesTot = merca + fijosMes + otrosMes;

  /* la plata de meses posteriores no cuenta para reconstruir el saldo inicial */
  const posterior = ventas.filter((v)=>mesDe(v.fecha)>mes).reduce((a,v)=>a+v.monto,0)
    - gastosPlata.filter((g)=>mesDe(g.fecha)>mes).reduce((a,g)=>a+g.monto,0)
    + ajustes.filter((m)=>mesDe(m.fecha)>mes).reduce((a,m)=>a+m.monto,0);
  const saldoFin = totalNegocio - posterior;
  const saldoIni = saldoFin - ventasMes + gastosMesTot - ajMes;

  const pasos = [
    { label: "Con lo que|se empezó", valor: saldoIni, tipo: "total" },
    { label: "Ventas|cobradas", valor: ventasMes, tipo: "sube" },
    { label: "Compra de|mercadería", valor: merca, tipo: "baja" },
    { label: "Gastos|fijos", valor: fijosMes, tipo: "baja" },
    { label: "Otros|gastos", valor: otrosMes, tipo: "baja" },
  ];
  if (Math.abs(ajMes) > 0.5) pasos.push({ label: "Ajustes|del banco", valor: Math.abs(ajMes), tipo: ajMes>0 ? "sube" : "baja" });
  pasos.push({ label: "Con lo que|se quedó", valor: saldoFin, tipo: "total" });

  /* proyección: lo que ya se debe pero todavía no salió del banco */
  const esMesActual = mes === mesDe(hoyISO());
  if (esMesActual && porPagar > 0) {
    pasos.push({ label: "Facturas|por pagar", valor: porPagar, tipo: "baja", proyeccion: true });
    pasos.push({ label: "Queda|de verdad", valor: saldoFin - porPagar, tipo: "total", proyeccion: true });
  }

  /* ---------- de esa plata, cuánto es ganancia ---------- */
  const an = useMemo(()=>analizarVentas(vMes, precios, enlaces), [vMes, precios, enlaces]);
  const G = gananciaDe(an, cfg);
  const costoVendido = G.costo;
  const gananciaBruta = G.bruta;
  const gananciaMes = gananciaBruta - fijosMes - otrosMes;
  const flujoMes = saldoFin - saldoIni - ajMes;
  const enInventario = costoVendido - merca;

  /* ---------- inventario acumulado y reparto de fin de mes ---------- */
  const anTodo = useMemo(()=>analizarVentas(ventas, precios, enlaces), [ventas, precios, enlaces]);
  const costoTodo = gananciaDe(anTodo, cfg).costo;
  const mercaTodo = gastos.filter((g)=>g.categoria==="Mercadería").reduce((a,g)=>a+g.monto,0);
  const inventario = (cfg.inventarioIni||0) + mercaTodo - costoTodo;

  /* costo diario de los últimos 30 días, para traducir el inventario a días de bodega */
  const hace30 = useMemo(()=>{ const d = new Date(); d.setDate(d.getDate()-30); return d.toLocaleDateString("en-CA"); }, []);
  const an30 = useMemo(()=>analizarVentas(ventas.filter((v)=>v.fecha>=hace30), precios, enlaces), [ventas, precios, enlaces, hace30]);
  const costoDiario = gananciaDe(an30, cfg).costo / 30;
  const diasInv = costoDiario > 0 ? inventario/costoDiario : null;

  const aportes = movs.filter((m)=>m.metodo==="aporte").reduce((a,m)=>a+Math.abs(m.monto),0);
  const devueltos = movs.filter((m)=>m.metodo==="retiro").reduce((a,m)=>a+Math.abs(m.monto),0);
  const aportePend = Math.max(0, aportes - devueltos);

  const fijosMensuales = (fijos||[]).reduce((a,f)=>a+f.monto,0);
  const semanas = cfg.semanasColchon != null ? cfg.semanasColchon : 4;
  const pctMin = cfg.colchonPctMin != null ? cfg.colchonPctMin : 10;
  const colchonSemanas = fijosMensuales * (semanas/4);
  const colchonPct = totalNegocio * (pctMin/100);
  const colchon = Math.max(colchonSemanas, colchonPct);
  const colchonPorPct = colchonPct > colchonSemanas;
  const socios = Math.max(1, cfg.socios || 2);
  /* ---------- reposición: lo que el proveedor ya se ganó y todavía no se le devolvió ----------
     De cada colón vendido, la parte del costo no es ganancia: es para volver a comprar.
     Se mide sobre 30 días móviles para que no se reinicie el día 1 de cada mes. */
  const ventas30 = ventas.filter((v)=>v.fecha >= hace30).reduce((a,v)=>a+v.monto,0);
  const costo30 = gananciaDe(an30, cfg).costo;
  const merca30 = gastos.filter((g)=>g.categoria==="Mercadería" && g.fecha >= hace30).reduce((a,g)=>a+g.monto,0);
  const pctCosto30 = ventas30 > 0 ? (costo30/ventas30)*100 : 0;
  const reponer = Math.max(0, costo30 - merca30);
  const alDia = costo30 > 0 ? Math.min(200, (merca30/costo30)*100) : 100;
  const impPct = cfg.impuestoCompras || 0;
  const impuesto = merca * (impPct/100);
  const comprometido = reponer + fijosMensuales + aportePend + colchon + impuesto + porPagar;
  const libre = totalNegocio - comprometido;
  const sugerido = Math.max(0, Math.min(libre, gananciaMes));

  /* cada movimiento que toca el banco, en orden, con saldo corriente */
  const libroBanco = useMemo(()=>{
    const items = [
      ...ventas.filter((v)=>EN_BANCO.includes(v.pago)).map((v)=>({
        fecha: v.fecha, creado: v.creado||0, monto: v.monto,
        que: v.producto || "Venta", detalle: v.pago + (v.cliente ? " · " + v.cliente : ""), clase: "venta"
      })),
      ...gastosPlata.filter((g)=>EN_BANCO.includes(g.pago)).map((g)=>({
        fecha: g.fecha, creado: g.creado||0, monto: -g.monto,
        que: g.detalle || g.categoria, detalle: "Salida · " + g.categoria + " · " + g.pago, clase: "gasto"
      })),
      ...movs.filter((m)=>m.tipo==="deposito").map((m)=>({
        fecha: m.fecha, creado: m.creado||0, monto: m.monto,
        que: "Depósito de efectivo", detalle: m.nota || "", clase: "deposito"
      })),
      ...movs.filter((m)=>m.tipo==="ajuste").map((m)=>({
        fecha: m.fecha, creado: m.creado||0, monto: m.monto,
        que: m.metodo==="aporte" ? "Aporte de socio" : m.metodo==="retiro" ? "Retiro de socio" : m.metodo==="cuadre" ? "Cuadre manual" : "Ajuste manual", detalle: m.nota || "sin razón anotada", clase: "ajuste"
      })),
    ].sort((a,b)=>(a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.creado||0)-(b.creado||0)));
    let acum = cfg.saldoBanco||0;
    return items.map((x)=>{ acum += x.monto; return { ...x, saldo: acum }; });
  }, [ventas, gastos, movs, cfg.saldoBanco]);

  /* desglose de cada salida del mes, para poder auditar */
  const salidasDetalle = useMemo(()=>{
    const m = {};
    gMes.forEach((g)=>{
      const k = g.fijoId ? "★ Gastos fijos" : (g.categoria || "Sin categoría");
      if (!m[k]) m[k] = { cat: k, total: 0, n: 0 };
      m[k].total += g.monto; m[k].n++;
    });
    return Object.values(m).sort((a,b)=>b.total-a.total);
  }, [gMes]);
  const salidasTot = gMes.reduce((a,g)=>a+g.monto,0);
  const cuadraSalidas = Math.abs(salidasTot - gastosMesTot) < 0.5;

  /* gastos fijos que todavía no se cargaron este mes */
  const fijosPendientes = (fijos||[]).filter((f)=>!gastos.some((g)=>mesDe(g.fecha)===mes && g.fijoId===f.id));
  const montoPendiente = fijosPendientes.reduce((a,f)=>a+f.monto,0);

  /* cierres que generaron el pendiente, del más viejo al más nuevo */
  const pendientes = useMemo(()=>{
    const cs = cierres.filter((c)=>(c.retiro||0)>0).sort((a,b)=>(a.fecha<b.fecha?-1:1));
    let cubierto = depositado, out = [];
    cs.forEach((c)=>{
      const r = c.retiro||0;
      if (cubierto >= r) { cubierto -= r; return; }
      out.push({ ...c, falta: r - cubierto });
      cubierto = 0;
    });
    return out.reverse();
  }, [cierres, depositado]);

  const historial = [...movs].sort((a,b)=>(a.fecha<b.fecha?1:a.fecha>b.fecha?-1:(b.creado||0)-(a.creado||0)));

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <KPI k="Total del negocio" v={C(totalNegocio)} sub="caja + pendiente + banco" oscuro />
        <KPI k="En la caja" v={C(caja)} sub={monedas>0 ? `incluye ${C(monedas)} en monedas` : (ultimoCierre ? "desde el " + fmtFecha(ultimoCierre) : "sin cierres")} />
        <KPI k="Por depositar" v={C(porDepositar)} sub={porDepositar>0 ? "◐ fuera del banco" : "○ al día"} />
        <KPI k="En el banco" v={C(banco)} sub={tarjetaPend>0 ? `${C(tarjetaPend)} de tarjeta sin acreditar` : "SINPE, tarjeta y depósitos"} />
      </div>

      {/* ================= DINERO DISPONIBLE HOY ================= */}
      <div className="rounded-[12px] bg-[var(--readout)] text-[#F2F3F0] p-5">
        <div className="flex items-baseline justify-between gap-3">
          <span className="f-head text-[11px] text-[rgba(242,243,240,.55)]">Dinero disponible hoy</span>
          <span className="f-mono text-[11px] text-[rgba(242,243,240,.45)]">{fmtFecha(hoyISO())}</span>
        </div>

        <div className="mt-3 flex items-baseline gap-3 flex-wrap">
          <span className="f-mono text-[15px] text-[rgba(242,243,240,.5)]">
            {libre <= 0 ? "●" : sugerido < gananciaMes ? "◐" : "★"}
          </span>
          <span className="readout-val" style={{ fontSize: "clamp(32px,10vw,48px)" }}>
            {C(Math.max(0, Math.round(libre)))}
          </span>
        </div>

        {libre > 0 && socios > 1 && (
          <div className="f-mono text-[14px] text-[rgba(242,243,240,.7)] mt-1">
            {C(Math.floor(libre/socios))} para cada uno · {socios} socios
          </div>
        )}

        <p className="text-[13px] text-[rgba(242,243,240,.75)] leading-relaxed mt-3">
          {libre <= 0
            ? `No hay nada retirable. Faltan ${C(Math.abs(libre))} para cubrir lo que ya está comprometido. Si hace falta plata, entra como aporte de socio.`
            : libre > gananciaMes && gananciaMes > 0
              ? `Están libres ${C(libre)}, pero la ganancia del mes va en ${C(gananciaMes)}. Sacar más que eso es tocar el capital con el que se compra la comida.`
              : `Esta plata ya tiene descontado todo lo que hay que pagar. Sacarla no descuadra la operación.`}
        </p>

        {libre > 0 && (
          <Btn kind="signal" className="btn-lg commit w-full mt-4" onClick={()=>setSocio("retiro")}>
            Registrar retiro
          </Btn>
        )}
      </div>

      {/* ---------- ¿se está reponiendo al ritmo que se vende? ---------- */}
      {costo30 > 0 && (
        <Card className="p-4">
          <div className="flex items-baseline justify-between gap-3 mb-1">
            <span className="f-head text-[11px]">Reposición · últimos 30 días</span>
            <span className="f-mono text-[12px] text-[var(--muted)]">{alDia.toFixed(0)}% repuesto</span>
          </div>
          <p className="text-[12px] text-[var(--muted)] mb-3 leading-relaxed">
            De cada ₡100 que entran por venta, <span className="font-medium text-[var(--ink)]">₡{pctCosto30.toFixed(0)} son del proveedor</span> y solo ₡{(100-pctCosto30).toFixed(0)} son ganancia. Esa parte hay que devolverla a la bodega.
          </p>

          <div className="space-y-1">
            <Linea label="Se vendió" val={C(ventas30)} />
            <Linea label="De eso, costo de la mercadería" val={C(costo30)} fuerte />
            <Linea label="Ya se recompró" val={"− " + C(merca30)} />
            <div className="pt-2 mt-1 border-t border-[var(--line-strong)]">
              <Linea
                label={reponer > 0 ? "● Falta reponer" : "○ Al día con la reposición"}
                val={reponer > 0 ? C(reponer) : C(merca30 - costo30) + " de más"}
                fuerte
              />
            </div>
          </div>

          <div className="h-2.5 bg-[rgba(22,33,28,.12)] rounded-full overflow-hidden mt-3 border border-[var(--line-strong)]">
            <div className="h-full bg-[var(--ink)]" style={{ width: Math.min(100, alDia) + "%" }} />
          </div>

          <p className="text-[12px] text-[var(--muted)] mt-3 leading-relaxed">
            {reponer > 0
              ? `Se vendió ${C(costo30)} de mercadería y solo se repusieron ${C(merca30)}. Los ${C(reponer)} que faltan quedan apartados arriba: esa plata es del proveedor, no ganancia. Si se retira, la próxima compra no alcanza.`
              : merca30 > costo30 * 1.3
                ? `Se compró ${C(merca30 - costo30)} más de lo que se vendió. No está mal, pero es plata parqueada en sacos: revisá los días de inventario antes de seguir comprando.`
                : "Las compras van al ritmo de las ventas. La bodega se mantiene y la ganancia es ganancia de verdad."}
          </p>
        </Card>
      )}

      {/* ---------- de dónde salió ese número ---------- */}
      <Card className="p-4">
        <div className="flex items-baseline justify-between gap-3 mb-3">
          <span className="f-head text-[11px]">Cómo se llegó a ese número</span>
          <span className="f-mono text-[12px] text-[var(--muted)]">{C(totalNegocio)} en total</span>
        </div>

        <div className="space-y-1">
          <Linea label="Plata que existe hoy" val={C(totalNegocio)} fuerte />
          <div className="pl-3 border-l-2 border-[var(--line-strong)] my-1.5 space-y-0.5">
            <div className="flex justify-between text-[12px] text-[var(--muted)]">
              <span>En la caja</span><span className="f-mono">{C(caja)}</span>
            </div>
            <div className="flex justify-between text-[12px] text-[var(--muted)]">
              <span>Por depositar</span><span className="f-mono">{C(porDepositar)}</span>
            </div>
            <div className="flex justify-between text-[12px] text-[var(--muted)]">
              <span>En el banco</span><span className="f-mono">{C(banco)}</span>
            </div>
          </div>

          <div className="pt-2 mt-1 border-t border-[var(--line)] space-y-1">
            <Linea label="Reponer lo vendido en 30 días" val={"− " + C(reponer)} />
            <Linea label="Gastos fijos del mes que entra" val={"− " + C(fijosMensuales)} />
            {impuesto > 0 && <Linea label={`Impuesto sobre compras (${impPct}%)`} val={"− " + C(impuesto)} />}
            {porPagar > 0 && <Linea label={`Facturas de proveedor (${deudas.length})`} val={"− " + C(porPagar)} />}
            {aportePend > 0 && <Linea label="Devolver aportes de socios" val={"− " + C(aportePend)} />}
            <Linea label="Colchón de emergencia" val={"− " + C(colchon)} />
          </div>

          <div className="pt-2 mt-1 border-t border-[var(--line-strong)]">
            <Linea label={libre >= 0 ? "Queda disponible" : "● Falta para cubrir lo comprometido"} val={C(Math.abs(libre))} fuerte />
          </div>
        </div>

        <p className="text-[11px] text-[var(--muted)] mt-3 leading-relaxed">
          El colchón toma el mayor entre {semanas} semanas de gastos fijos ({C(colchonSemanas)}) y el {pctMin}% de la plata total ({C(colchonPct)}).
          Hoy manda {colchonPorPct ? "el porcentaje" : "el de semanas"}.
        </p>

        <div className="mt-3 pt-3 border-t border-[var(--line)] space-y-1">
          <Linea label="Ganancia real del mes" val={C(gananciaMes)} />
          <Linea label="Inventario en bodega, a costo" val={C(Math.max(0, inventario))} />
          <Linea label="Alcanza para" val={inventario > 0 && diasInv != null ? `${Math.round(diasInv)} días` : "—"} />
        </div>

        <p className="text-[12px] text-[var(--muted)] mt-3 leading-relaxed">
          {inventario <= 0
            ? "◐ El contador de inventario todavía no refleja la bodega real: arranca en cero y hay mercadería vieja vendiéndose sin haber entrado. Converge solo en cuatro a seis semanas, o poné el conteo en Ajustes."
            : diasInv != null && diasInv > 60
              ? `● Hay ${Math.round(diasInv)} días de inventario. Eso es plata parqueada en sacos: bajá el ritmo de compra y esa plata vuelve al banco sola.`
              : diasInv != null && diasInv < 15
                ? `● Solo ${Math.round(diasInv)} días de inventario. Vas a quebrar existencias; conviene comprar antes de que se caiga una venta.`
                : "○ Entre 15 y 60 días de inventario es sano para alimento."}
        </p>
      </Card>


      {meses.length>1 && (
        <div className="flex gap-2 overflow-x-auto pb-1">
          {meses.map((m)=>(<button key={m} onClick={()=>setMes(m)} className={"px-3 py-1.5 rounded-full border text-xs whitespace-nowrap font-mono " + (mes===m ? "bg-stone-900 text-white border-stone-900" : "bg-white border-stone-300")}>{m}</button>))}
        </div>
      )}

      <Card className="p-4">
        <div className="flex justify-between items-baseline mb-1">
          <span className="text-[11px] uppercase tracking-[0.15em] text-stone-500">Cómo se movió la plata en {mes}</span>
          <span className="font-mono tabular-nums text-[12px] text-stone-500">{saldoFin - saldoIni >= 0 ? "+" : "−"}{C(Math.abs(saldoFin - saldoIni))}</span>
        </div>
        <Waterfall pasos={pasos} />

        {saldoIni < 0 && (
          <div className="border border-stone-400 rounded-md p-3 mt-3">
            <div className="text-[13px] font-medium mb-1">● El mes arranca en negativo</div>
            <p className="text-[12px] text-stone-700 leading-relaxed">
              La app no sabe cuánta plata había antes del primer registro, así que lo reconstruye hacia atrás y le da {C(saldoIni)}.
              Ponés el saldo real en Ajustes → "Saldo del banco al empezar a usar la app" y esta barra se acomoda sola.
            </p>
          </div>
        )}

        <p className="text-[11px] text-stone-500 mt-1">
          Barras rellenas: saldo a favor o plata que entra. Barras huecas: plata que sale. El número gris de abajo es el saldo corriente.
        </p>
        {esMesActual && porPagar > 0 && (
          <p className="text-[12px] text-stone-600 mt-2 leading-relaxed border-t border-[var(--line)] pt-2">
            Las dos barras punteadas de la derecha todavía no pasaron: son {C(porPagar)} en facturas de proveedor que ya se deben.
            Descontándolas quedan <span className="font-medium">{C(saldoFin - porPagar)}</span> de verdad disponibles.
            Cuando marqués una factura como pagada, deja de estar punteada y pasa a la barra de compra de mercadería del mes en que la pagaste.

function LibroBancoModal({ libro, banco, tarjetaPend, bancoAcreditado, cfg, onClose }) {
  const [real, setReal] = useState("");
  const [soloAjustes, setSoloAjustes] = useState(false);
  const r = num(real);
  const dif = real === "" ? null : r - bancoAcreditado;
  const lista = (soloAjustes ? libro.filter((x)=>x.clase==="ajuste") : libro).slice().reverse();
  const totalAjustes = libro.filter((x)=>x.clase==="ajuste").reduce((a,x)=>a+x.monto,0);

  return (
    <Modal title="De dónde sale el saldo del banco" onClose={onClose}>
      <div className="bg-stone-100 rounded-md p-3 mb-3 space-y-1">
        <Linea label="Saldo inicial configurado" val={C(cfg.saldoBanco||0)} />
        <Linea label="Después de todos los movimientos" val={C(banco)} fuerte />
        {tarjetaPend > 0 && (
          <>
            <Linea label="Menos tarjeta sin acreditar" val={"− " + C(tarjetaPend)} />
            <Linea label="Comparable con el banco" val={C(bancoAcreditado)} fuerte />
          </>
        )}
      </div>

      <div className="mb-3">
        <Lbl>Lo que dice el banco ahora</Lbl>
        <Inp inputMode="decimal" value={real} onChange={(e)=>setReal(e.target.value)} placeholder="223963,28" className="font-mono tabular-nums text-xl" />
      </div>

      {dif !== null && (
        <div className="border border-stone-400 rounded-md p-3 mb-3">
          <div className="flex justify-between items-baseline">
            <span className="text-sm font-medium">
              {Math.abs(dif) < 0.005 ? "○ Calza exacto" : dif > 0 ? "◐ El banco tiene más" : "● El banco tiene menos"}
            </span>
            <span className="font-mono tabular-nums text-lg font-semibold">{C(Math.abs(dif))}</span>
          </div>
          {Math.abs(dif) >= 0.005 && (
            <p className="text-[12px] text-stone-600 mt-2 leading-relaxed">
              Buscá la diferencia en la lista de abajo: una venta que entró como SINPE pero fue efectivo, un gasto sin registrar,
              o un ajuste manual que ya no corresponde. Cuando la encuentres, corregí el movimiento en vez de cuadrar encima.
            </p>
          )}
        </div>
      )}

      {totalAjustes !== 0 && (
        <button onClick={()=>setSoloAjustes(!soloAjustes)} className="w-full text-left px-3 py-2 border border-stone-300 rounded-md bg-stone-50 mb-3">
          <div className="text-[13px]">{soloAjustes ? "○" : "—"} Ver solo los ajustes manuales</div>
          <div className="text-[11px] text-stone-500 mt-0.5">Suman {C(totalAjustes)}. Son la causa más común de un saldo que no calza.</div>
        </button>
      )}

      <div className="border border-stone-200 rounded-md divide-y divide-stone-100 max-h-80 overflow-y-auto">
        {lista.length === 0 && <p className="text-sm text-stone-500 p-3">Nada que mostrar.</p>}
        {lista.map((x,i)=>(
          <div key={i} className="px-3 py-2 flex justify-between items-start gap-2">
            <div className="min-w-0">
              <div className="text-[13px] truncate">
                {x.clase==="ajuste" && <span className="text-stone-500 mr-1">◐</span>}
                {x.que}
              </div>
              <div className="text-[11px] text-stone-500 font-mono truncate">{fmtFecha(x.fecha)} · {x.detalle}</div>
            </div>
            <div className="text-right shrink-0">
              <div className="font-mono tabular-nums text-[13px]">{x.monto < 0 ? "− " + C(Math.abs(x.monto)) : "+ " + C(x.monto)}</div>
              <div className="font-mono tabular-nums text-[10px] text-stone-400">{C(x.saldo)}</div>
            </div>
          </div>
        ))}
      </div>
      <p className="text-[11px] text-stone-500 mt-2">
        El número gris de la derecha es el saldo después de ese movimiento. Recorré hacia atrás hasta encontrar el punto donde dejó de calzar con tu banco.
      </p>
    </Modal>
  );
}

function DepositoModal({ sugerido, porDepositar, guardar, usuario, aviso, onClose }) {

  return (

      </div>
      <div className="mb-3"><Lbl>Nota (opcional)</Lbl><Inp value={nota} onChange={(e)=>setNota(e.target.value)} placeholder="Depósito BAC, comprobante 4471" /></div>

        <Linea label="Se deposita" val={C(m)} />
        <div className="pt-2 mt-1 border-t border-stone-300">
          <Linea label={queda >= 0 ? "Queda pendiente" : "Se depositó de más"} val={C(Math.abs(queda))} fuerte />
        </div>
      </div>
      {queda < 0 && <p className="text-[12px] text-stone-700 border border-stone-400 rounded-md p-2 mb-3">◐ Estás depositando más de lo que salió de la caja. Si es plata de otro lado, mejor registrala como ajuste de banco.</p>}

      <Btn kind="warn" className="w-full py-3" disabled={m<=0} onClick={async ()=>{

function AjusteBancoModal({ banco, bancoAcreditado, tarjetaPend, cfg, guardar, usuario, aviso, onClose }) {
  const [modo, setModo] = useState("cuadrar");
  const [fecha, setFecha] = useState(hoyISO());
  const [saldoReal, setSaldoReal] = useState("");
  const [excluirTarjeta, setExcluirTarjeta] = useState(tarjetaPend > 0);
  const [signo, setSigno] = useState("mas");
  const [monto, setMonto] = useState("");
  const [razon, setRazon] = useState("");
  const [nota, setNota] = useState("");

  const base = excluirTarjeta ? bancoAcreditado : banco;
  const real = num(saldoReal);
  const difCuadre = saldoReal === "" ? null : real - base;

  const manual = num(monto) * (signo === "mas" ? 1 : -1);
  const ajuste = modo === "cuadrar" ? (difCuadre || 0) : manual;
  const motivo = [razon, nota.trim()].filter(Boolean).join(" · ");
  const listo = motivo !== "" && Math.abs(ajuste) > 0.004;

  const guardarAjuste = async () => {
    await guardar("movimientos", {
      id: UID(), tipo: "ajuste", fecha, monto: ajuste, nota: motivo,
      saldoAntes: banco, saldoDespues: banco + ajuste,
      metodo: modo === "cuadrar" ? "cuadre" : "manual",
      excluyoTarjeta: modo === "cuadrar" ? excluirTarjeta : false,
      usuario, creado: Date.now()
    });
    aviso("Banco cuadrado");
    onClose();
  };

  return (
    <Modal title="Cuadrar banco" onClose={onClose}>
      <div className="grid grid-cols-2 gap-1.5 mb-3">
        {[["cuadrar","Poner el saldo real"],["manual","Sumar o restar"]].map(([id,l])=>(
          <button key={id} onClick={()=>setModo(id)} className={"py-2 rounded-md border text-[13px] " + (modo===id ? "bg-stone-900 text-white border-stone-900" : "bg-white border-stone-300")}>{l}</button>
        ))}
      </div>

      {modo === "cuadrar" ? (
        <>
          <p className="text-[13px] text-stone-600 mb-3 leading-relaxed">
            Escribí lo que dice el estado de cuenta y la app calcula sola la diferencia.
          </p>

          <div className="mb-3">
            <Lbl>Saldo real en la cuenta</Lbl>
            <Inp inputMode="decimal" value={saldoReal} onChange={(e)=>setSaldoReal(e.target.value)} placeholder="181019,28" className="font-mono tabular-nums text-2xl" />
            <p className="text-[11px] text-stone-500 mt-1">Se puede escribir con coma para los céntimos.</p>
          </div>

          {tarjetaPend > 0 && (
            <button
              onClick={()=>setExcluirTarjeta(!excluirTarjeta)}
              className="w-full text-left px-3 py-2 border border-stone-300 rounded-md bg-stone-50 mb-3"
            >
              <div className="text-[13px]">
                {excluirTarjeta ? "○" : "—"} Ese saldo aún no incluye las tarjetas
              </div>
              <div className="text-[11px] text-stone-500 mt-0.5">
                {C(tarjetaPend)} en tarjetas de hoy quedan fuera de la comparación
              </div>
            </button>
          )}

          <div className="bg-stone-100 rounded-md p-3 mb-3 space-y-1">
            <Linea label="La app dice que hay" val={C(banco)} />
            {excluirTarjeta && tarjetaPend > 0 && (

/* ================= PRECIOS ================= */
/* redondeo comercial: al múltiplo de 25 más cercano */
const red25 = (n) => Math.round(n/25)*25;

/* la ganancia se aplica SOBRE EL COSTO, como en la hoja: costo × (1 + g/100) */
const conGanancia = (costo, g) => costo * (1 + (g||0)/100);

/* celda editable: guarda al salir del campo, no en cada tecla */
function Celda({ valor, onGuardar, ancho = "w-24", mono = true, alinear = "text-right", placeholder = "" }) {
  const [v, setV] = useState(valor == null ? "" : String(valor));
  const [tocado, setTocado] = useState(false);
  useEffect(()=>{ if (!tocado) setV(valor == null ? "" : String(valor)); }, [valor, tocado]);
  return (
    <input
      value={v}
      placeholder={placeholder}
      inputMode={mono ? "decimal" : undefined}
      onChange={(e)=>{ setTocado(true); setV(e.target.value); }}
      onBlur={()=>{ setTocado(false); if (String(valor == null ? "" : valor) !== v) onGuardar(v); }}
      onKeyDown={(e)=>{ if (e.key === "Enter") e.target.blur(); }}
      className={`${ancho} ${alinear} ${mono ? "f-mono" : ""} px-2 min-h-[44px] rounded-[6px] border border-transparent bg-transparent hover:border-[var(--line)] focus:border-[var(--signal)] focus:bg-white focus:outline-none text-[13px]`}
    />
  );
}

function Precios({ precios, enlaces, gastos, cfg, guardar, borrar, aviso, usuario }) {

  const gDef = cfg.gananciaDef != null ? cfg.gananciaDef : 20;

  const dups = useMemo(()=>{
    const c = {}; precios.forEach((p)=>(c[norm(p.nombre)] = (c[norm(p.nombre)]||0)+1));
    return new Set(Object.keys(c).filter((k)=>c[k]>1));
  }, [precios]);

  /* una fila con todo lo derivado ya calculado */
  const fila = (p) => {
    const peso = num(p.peso), costo = num(p.costo);
    const g = p.ganancia != null && p.ganancia !== "" ? num(p.ganancia) : gDef;
    const costoKilo = peso > 0 ? costo/peso : 0;
    const sugKilo = costoKilo > 0 ? red25(conIVA(conGanancia(costoKilo, g))) : 0;
    const sugSaco = costo > 0 ? red25(conIVA(conGanancia(costo, g))) : 0;
    const finKilo = num(p.precioKilo), finSaco = num(p.precioSaco);
    return {
      p, peso, costo, g, costoKilo, sugKilo, sugSaco, finKilo, finSaco,
      margenKilo: finKilo > 0 && costoKilo > 0 ? margen(finKilo, costoKilo) : null,
      margenSaco: finSaco > 0 && costo > 0 ? margen(finSaco, costo) : null,
      bajoKilo: finKilo > 0 && sugKilo > 0 && finKilo < sugKilo,
      bajoSaco: finSaco > 0 && sugSaco > 0 && finSaco < sugSaco,
      sinPrecio: costo > 0 && finKilo <= 0 && finSaco <= 0,

  };

    .filter((p)=>!q || norm(p.nombre).includes(norm(q)))
    .map(fila)

                      {f.sugKilo > 0

            <p className="text-[11px] text-[var(--muted)] leading-relaxed flex-1 min-w-[240px]">
              ● sin precio · ◐ el precio quedó por debajo del sugerido · ○ al día.

function parsePrecio(l) {
  let f = l.split("\t"); if (f.length < 3) f = l.split(/\s{2,}/); if (f.length < 3) return null;
  const cel = f.map((x)=>(x||"").trim());
  const nombre = cel[0], peso = num(cel[1]), costo = num(cel[2]);
  if (!nombre || costo<=0 || peso<=0) return null;
  const final = num(cel[cel.length-1]), ck = costo/peso;
  const pareceSaco = peso>1 && final>ck*2 && Math.abs(final - costo*1.25)/(costo*1.25) < 0.2;
  return { id: UID(), nombre, peso, costo, unidad:"kg", precioKilo: pareceSaco ? 0 : final, precioSaco: pareceSaco ? final : 0, actualizado: Date.now(), _saco: pareceSaco };
}
