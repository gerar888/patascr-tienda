function Analisis({ ventas, gastos, precios, enlaces, cierres, cfg }) {
  const [mes, setMes] = useState(mesDe(hoyISO()));
  const [verDatos, setVerDatos] = useState(false);
  const meses = useMemo(()=>[...new Set(ventas.map((v)=>mesDe(v.fecha)))].sort().reverse(), [ventas]);
  const vMes = ventas.filter((v)=>mesDe(v.fecha)===mes);
  const gMes = gastos.filter((g)=>mesDe(g.fecha)===mes);
  const total = vMes.reduce((a,v)=>a+v.monto,0);

  const [ay, am] = mes.split("-").map(Number);
  const diasMes = new Date(ay, am, 0).getDate();
  const esActual = mes === mesDe(hoyISO());
  const hastaDia = esActual ? new Date().getDate() : diasMes;
  const diasRestantes = Math.max(0, diasMes - hastaDia);

  /* --- 1. acumulado vs ritmo necesario --- */
  const porDiaNum = useMemo(()=>{
    const m = {};
    vMes.forEach((v)=>{ const d = +v.fecha.slice(8); m[d] = (m[d]||0) + v.monto; });
    return m;
  }, [vMes]);

  const acumulado = [];
  let ac = 0;
  for (let d=1; d<=hastaDia; d++) { ac += (porDiaNum[d]||0); acumulado.push(ac); }
  const ritmo = [];
  for (let d=1; d<=hastaDia; d++) ritmo.push(cfg.meta * d / diasMes);
  const etiquetasDias = Array.from({length: hastaDia}, (_,i)=> (i===0 || (i+1)%5===0) ? String(i+1) : "");
  const vsRitmo = acumulado.length ? acumulado[acumulado.length-1] - ritmo[ritmo.length-1] : 0;
  const faltaMeta = Math.max(0, cfg.meta - total);

  /* --- 2. dispersión producto: venta vs margen --- */
  const an = useMemo(()=>analizarVentas(vMes, precios, enlaces), [vMes, precios, enlaces]);
  const dispersion = an.productos.filter((p)=>p.venta > 0);

  /* --- 3. histograma de tiquetes --- */
  const montos = vMes.map((v)=>v.monto);
  const CORTES = [
    { label: "< 2k", min: 0, max: 2000 },
    { label: "2–5k", min: 2000, max: 5000 },
    { label: "5–10k", min: 5000, max: 10000 },
    { label: "10–20k", min: 10000, max: 20000 },
    { label: "20–40k", min: 20000, max: 40000 },
    { label: "40k +", min: 40000, max: Infinity },
  ];
  const mediana = (() => {
    if (!montos.length) return 0;
    const o = [...montos].sort((a,b)=>a-b), h = Math.floor(o.length/2);
    return o.length%2 ? o[h] : (o[h-1]+o[h])/2;
  })();
  const promedio = montos.length ? total/montos.length : 0;
  const tiquete = mediana || promedio || 0;

  /* --- 4. medios de pago --- */
  const pagos = PAGOS.map((p)=>({ nombre: p, valor: vMes.filter((v)=>v.pago===p).reduce((a,v)=>a+v.monto,0) })).filter((x)=>x.valor>0);
  const totPago = pagos.reduce((a,p)=>a+p.valor,0);
  const valorPago = (n) => (pagos.find((p)=>p.nombre===n) || { valor: 0 }).valor;

  /* --- métricas extra --- */
  const porDiaSemana = useMemo(()=>{
    const acum = Array(7).fill(0);
    vMes.forEach((v)=>{
      const [y,m,d] = v.fecha.split("-").map(Number);
      acum[new Date(y,m-1,d).getDay()] += v.monto;
    });
    const diasVistos = Array(7).fill(0);
    [...new Set(vMes.map((v)=>v.fecha))].forEach((f)=>{
      const [y,m,d] = f.split("-").map(Number);
      diasVistos[new Date(y,m-1,d).getDay()]++;
    });
    const nom = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
    return nom.map((n,i)=>({ nombre: n, total: acum[i], dias: diasVistos[i], prom: diasVistos[i] ? acum[i]/diasVistos[i] : 0 }))
      .filter((x)=>x.dias>0).sort((a,b)=>b.prom-a.prom);
  }, [vMes]);

  const clientesMes = new Set(vMes.filter((v)=>v.cliente).map((v)=>norm(v.cliente)));
  const conNombre = vMes.filter((v)=>v.cliente).length;
  const captura = vMes.length ? conNombre/vMes.length : 0;
  const repiten = useMemo(()=>{
    const c = {};
    vMes.filter((v)=>v.cliente).forEach((v)=>{ const k = norm(v.cliente); c[k] = (c[k]||0)+1; });
    return Object.values(c).filter((n)=>n>1).length;
  }, [vMes]);

  const conc = useMemo(()=>{
    const t = dispersion.reduce((a,p)=>a+p.venta,0);
    if (!t) return 0;
    const top = [...dispersion].sort((a,b)=>b.venta-a.venta).slice(0,3).reduce((a,p)=>a+p.venta,0);
    return (top/t)*100;
  }, [dispersion]);

  const cierresMes = cierres.filter((c)=>mesDe(c.fecha)===mes);
  const difCaja = cierresMes.reduce((a,c)=>a+(c.diferencia||0),0);
  const peorCierre = [...cierresMes].sort((a,b)=>Math.abs(b.diferencia||0)-Math.abs(a.diferencia||0))[0];

  const diasConVenta = new Set(vMes.map((v)=>v.fecha)).size;
  const mejorDia = Object.entries(porDiaNum).sort((a,b)=>b[1]-a[1])[0];
  const margenReal = an.ventaId > 0 ? ((an.ventaId - an.costoId)/an.ventaId)*100 : 0;
  const margenUso = margenReal > 0 ? margenReal : cfg.margenGranel;

  /* kilos movidos por producto, para reponer */
  const movimiento = useMemo(()=>(
    an.productos
      .filter((p)=>(p.kg||0) > 0 || (p.uds||0) > 0)
      .map((p)=>({ ...p, porDia: hastaDia > 0 ? (p.kg||0)/hastaDia : 0 }))
      .sort((a,b)=>(b.kg||0)-(a.kg||0))
  ), [an, hastaDia]);

  /* productos con acción concreta de precio */
  const bajoMeta = useMemo(()=>(
    dispersion
      .filter((p)=>p.pct < cfg.margenGranel)
      .map((p)=>{
        const necesaria = p.costo > 0 ? conIVA(p.costo / (1 - cfg.margenGranel/100)) : 0;
        return { ...p, falta: p.venta*(cfg.margenGranel-p.pct)/100, subida: necesaria > 0 ? (necesaria/p.venta - 1)*100 : 0 };
      })
      .sort((a,b)=>b.falta-a.falta)
  ), [dispersion, cfg.margenGranel]);

  /* ================= motor de hallazgos ================= */
  const hallazgos = useMemo(()=>{
    const h = [];
    if (vMes.length < 5) return h;

    /* recompra */
    if (captura < 0.6) {
      h.push({
        sev: "●", titulo: "No se puede medir si la gente está volviendo",
        detalle: `Solo ${conNombre} de ${vMes.length} ventas llevan nombre (${Math.round(captura*100)}%). Con esa captura, el dato de recompra no es confiable, y la recompra es el negocio entero de una tienda de alimento.`,
        accion: `Preguntá el nombre en toda venta de saco o de más de ${C(tiquete)}. Con dos semanas así ya se puede medir de verdad.`,
        plata: clientesMes.size * tiquete * (margenUso/100) * 0.5,
      });
    } else if (clientesMes.size >= 5 && repiten/clientesMes.size < 0.25) {
      const solos = clientesMes.size - repiten;
      h.push({
        sev: "●", titulo: "Casi nadie está volviendo",
        detalle: `${clientesMes.size} clientes distintos y solo ${repiten} repitió. En un negocio donde el saco se acaba cada tres o cuatro semanas, eso significa que están comprando en otro lado la segunda vez.`,
        accion: `Escribile por SINPE o WhatsApp a los ${solos} que compraron una sola vez, a los 25 días de su compra. Un mensaje, sin promoción.`,
        plata: solos * tiquete * (margenUso/100),
      });
    }

    /* datáfono vs SINPE */
    const tar = valorPago("Tarjeta"), sin = valorPago("SINPE");
    if (totPago > 0 && tar/totPago > 0.30) {
      const mover = tar * 0.35;
      h.push({
        sev: tar/totPago > 0.45 ? "●" : "◐",
        titulo: "Demasiado está pasando por el datáfono",
        detalle: `Tarjeta ${C(tar)} (${Math.round(tar/totPago*100)}%) contra SINPE ${C(sin)} (${Math.round(sin/totPago*100)}%). La tarjeta cobra cerca de ${COMISION_TARJETA}% y tarda ${cfg.diasTarjeta} día${cfg.diasTarjeta===1?"":"s"} en acreditarse; SINPE no cobra nada y entra al instante.`,
        accion: `Cuando saquen la tarjeta, ofrecé primero SINPE: preguntá «¿SINPE o tarjeta?» en ese orden. Tené el número visible en el mostrador.`,
        plata: mover * (COMISION_TARJETA/100),
      });
    }

    /* productos bajo meta */
    if (bajoMeta.length && bajoMeta[0].falta > tiquete/2) {
      const top = bajoMeta.slice(0,3);
      h.push({
        sev: "●", titulo: `${top.length} producto${top.length===1?"":"s"} se vende${top.length===1?"":"n"} bien y deja${top.length===1?"":"n"} poco`,
        detalle: top.map((p)=>`${p.nombre}: ${C(p.venta)} vendidos al ${p.pct.toFixed(0)}% de margen`).join(" · ") + `. La meta de granel es ${cfg.margenGranel}%.`,
        accion: `Subí ${top[0].nombre} un ${top[0].subida.toFixed(0)}% (queda en ${C(Math.round(top[0].venta*(1+top[0].subida/100)/Math.max(1,top[0].veces)))} por venta típica) o aceptá que es gancho y dejalo escrito.`,
        plata: top.reduce((a,p)=>a+p.falta,0),
      });
    }

    /* diferencias de caja */
    if (Math.abs(difCaja) > tiquete) {
      h.push({
        sev: "●",
        titulo: difCaja > 0 ? "Hay plata en caja que nadie anotó" : "Falta plata en caja",
        detalle: difCaja > 0
          ? `${C(Math.abs(difCaja))} de sobrante acumulado en ${cierresMes.length} cierre${cierresMes.length===1?"":"s"}. Un sobrante de ese tamaño casi nunca es error de conteo: es una venta que se cobró y no se registró.${peorCierre ? ` El más grande fue el ${fmtFecha(peorCierre.fecha)}.` : ""}`
          : `${C(Math.abs(difCaja))} de faltante acumulado.${peorCierre ? ` El más grande fue el ${fmtFecha(peorCierre.fecha)}.` : ""}`,
        accion: `Revisá el cierre${peorCierre ? " del " + fmtFecha(peorCierre.fecha) : ""} contra las ventas de ese día. Si aparece la venta, anotala con la fecha vieja.`,
        plata: Math.abs(difCaja),
      });
    }

    /* cierres pendientes */
    const sinCerrar = Math.max(0, diasConVenta - cierresMes.length);
    if (sinCerrar >= 2) {
      h.push({
        sev: "◐", titulo: `${sinCerrar} días con venta quedaron sin cerrar caja`,
        detalle: `Se cerró ${cierresMes.length} de ${diasConVenta} días con movimiento. Sin cierre no hay forma de saber si la caja cuadra ni cuánto tocaba depositar.`,
        accion: "Cerrá caja antes de bajar la cortina, no al día siguiente. Son dos minutos y es el único control de efectivo que existe.",
        plata: null,
      });
    }

    /* ritmo del mes */
    if (esActual && faltaMeta > 0 && diasRestantes > 0) {
      const porDia = faltaMeta/diasRestantes;
      h.push({
        sev: vsRitmo < 0 ? "◐" : "○",
        titulo: vsRitmo < 0 ? "El mes va atrás del ritmo" : "El mes va en ritmo",
        detalle: `Llevan ${C(total)} de ${C(cfg.meta)}. Quedan ${diasRestantes} días y faltan ${C(faltaMeta)}.`,
        accion: `Hay que hacer ${C(porDia)} por día, o sea unas ${Math.ceil(porDia/Math.max(1,tiquete))} ventas diarias del tiquete típico.`,
        plata: null,
      });
    }

    /* registro línea por línea */
    if (an.nVentas >= 8 && an.conLineas / an.nVentas < 0.5) {
      h.push({
        sev: "◐", titulo: "Casi ninguna venta se registra producto por producto",
        detalle: `${an.conLineas} de ${an.nVentas} ventas llevan el detalle de qué se vendió y cuántos kilos. En el resto, el costo se deduce del monto y puede estar equivocado.`,
        accion: "En Registrar, dejá activo «Por producto»: buscás el artículo, ponés los kilos y el cobro sale solo. Es un toque más y vuelve exacto todo lo demás.",
        plata: null,
      });
    }

    /* cobertura de costos */
    if (an.cobertura < 85 && an.sinLista.length) {
      const top = an.sinLista.slice(0,3);
      h.push({
        sev: "◐", titulo: "Los márgenes de arriba son una estimación",
        detalle: `Solo el ${an.cobertura.toFixed(0)}% de lo vendido calza con la tabla de precios. Sin enlazar: ${top.map((s)=>`${s.texto} (${C(s.monto)})`).join(" · ")}.`,
        accion: "Enlazá esos nombres en la pestaña Precios. Cada uno que enlacés vuelve más real el número de margen.",
        plata: null,
      });
    }

    /* concentración */
    if (conc > 60 && dispersion.length >= 4) {
      h.push({
        sev: "◐", titulo: "El mes depende de muy pocos productos",
        detalle: `Los 3 más vendidos son el ${conc.toFixed(0)}% de todo lo identificado. Si a uno de esos proveedores se le acaba el producto, se cae buena parte del mes.`,
        accion: "Tené un sustituto probado para cada uno de los tres, y no dejés que el inventario de esos baje de dos semanas.",
        plata: null,
      });
    }

    return h.sort((a,b)=>{
      if ((a.plata==null) !== (b.plata==null)) return a.plata==null ? 1 : -1;
      return (b.plata||0)-(a.plata||0);
    });
  }, [vMes, captura, conNombre, clientesMes, repiten, tiquete, margenUso, totPago, bajoMeta, difCaja, cierresMes, diasConVenta, esActual, faltaMeta, diasRestantes, vsRitmo, total, an, conc, dispersion, cfg]);

  const plataTotal = hallazgos.reduce((a,h)=>a+(h.plata||0), 0);
  const urgentes = hallazgos.filter((h)=>h.sev === "●");

  const accionProducto = (p) => {
    if (p.pct >= cfg.margenGranel + 5) return { s: "★", t: "Está bien. Empujalo." };
    if (p.pct >= cfg.margenGranel) return { s: "○", t: "En meta." };
    const b = bajoMeta.find((x)=>x.nombre === p.nombre);
    if (b && b.subida > 0) return { s: "●", t: `Subir ${b.subida.toFixed(0)}%` };
    return { s: "◐", t: "Revisar costo" };
  };

  return (
    <div className="space-y-4">
      {meses.length>1 && (
        <div className="flex gap-2 overflow-x-auto pb-1">
          {meses.map((m)=>(
            <Chip key={m} activo={mes===m} onClick={()=>setMes(m)} className="f-mono normal-case tracking-normal shrink-0">{m}</Chip>
          ))}
        </div>
      )}

      {/* ---------- el mes en tres números ---------- */}
      <div className="grid grid-cols-3 gap-3">
        <Card className="p-3">
          <span className="f-head block text-[10px] text-[var(--muted)]">Vendido</span>
          <div className="f-mono text-[18px] lg:text-[22px] font-semibold mt-0.5">{C(total)}</div>
          <div className="text-[11px] text-[var(--muted)] mt-0.5">{cfg.meta ? Math.round(total/cfg.meta*100) : 0}% de {C(cfg.meta)}</div>
        </Card>
        <Card className="p-3">
          <span className="f-head block text-[10px] text-[var(--muted)]">Tiquete típico</span>
          <div className="f-mono text-[18px] lg:text-[22px] font-semibold mt-0.5">{C(mediana)}</div>
          <div className="text-[11px] text-[var(--muted)] mt-0.5">{vMes.length} ventas</div>
        </Card>
        <Card className="p-3">
          <span className="f-head block text-[10px] text-[var(--muted)]">Margen real</span>
          <div className="f-mono text-[18px] lg:text-[22px] font-semibold mt-0.5">{margenReal.toFixed(0)}%</div>
          <div className="text-[11px] text-[var(--muted)] mt-0.5">meta {cfg.margenGranel}% · cobertura {an.cobertura.toFixed(0)}%</div>
        </Card>
      </div>

      {/* ---------- decisiones ---------- */}
      <Card className="p-4">
        <div className="flex items-baseline justify-between gap-3 mb-3">
          <span className="f-head text-[11px]">Qué hacer este mes</span>
          {plataTotal > 0 && (
            <span className="f-mono text-[12px] text-[var(--muted)]">{C(Math.round(plataTotal))} en juego</span>
          )}
        </div>

        {hallazgos.length === 0 ? (
          <p className="text-[14px]">Todavía no hay ventas suficientes en este mes para sacar conclusiones. Con unas diez ventas ya empieza a decir algo.</p>
        ) : (
          <React.Fragment>
            {hallazgos.map((h,i)=><Hallazgo key={i} h={h} />)}
            <p className="text-[11px] text-[var(--muted)] leading-relaxed mt-4 pt-3 border-t border-[var(--line)]">
              ● urge · ◐ conviene · ○ va bien · — sin plata directa asociada. La columna de la derecha es utilidad estimada al mes, no facturación.
              {urgentes.length > 0 && ` Si solo vas a hacer una cosa, hacé la primera.`}
            </p>
          </React.Fragment>
        )}
      </Card>

      {/* ---------- qué se movió, para pedir ---------- */}
      {movimiento.length > 0 && (
        <Card className="p-4">
          <div className="flex items-baseline justify-between gap-3 mb-1">
            <span className="f-head text-[11px]">Cuánto se movió de cada producto</span>
            <span className="f-mono text-[11px] text-[var(--muted)]">{an.conLineas} de {an.nVentas} ventas con detalle</span>
          </div>
          <p className="text-[12px] text-[var(--muted)] mb-3">
            {an.conLineas === 0
              ? "Todavía ninguna venta se registró producto por producto. Los kilos de abajo son estimados a partir del monto."
              : "Kilos o unidades vendidos en el mes, para saber qué reponer y en qué cantidad."}
          </p>
          <div className="divide-y divide-[var(--line)]">
            {movimiento.slice(0,15).map((m)=>(
              <div key={m.nombre} className="py-2 flex items-baseline gap-3">
                <div className="min-w-0 flex-1">
                  <div className="text-[13px] truncate">{m.nombre}</div>
                  <div className="text-[11px] text-[var(--muted)]">
                    {m.veces} {m.veces===1?"venta":"ventas"} · {C(m.venta)}
                  </div>
                </div>
                <div className="text-right shrink-0">
                  <div className="f-mono text-[14px]">{m.kg >= 1 ? m.kg.toFixed(1) + " kg" : m.uds.toFixed(0) + " u"}</div>
                  <div className="text-[11px] text-[var(--muted)]">{m.porDia > 0 ? m.porDia.toFixed(1) + " kg/día" : ""}</div>
                </div>
              </div>
            ))}
          </div>
          <p className="text-[11px] text-[var(--muted)] mt-3 leading-relaxed">
            Para reponer un mes: pedí lo del mes pasado más un margen. Con el ritmo por día se calcula cuánto aguanta lo que hay en bodega.
          </p>
        </Card>
      )}

      {/* ---------- productos con acción ---------- */}
      {dispersion.length > 0 && (
        <Card className="p-4">
          <span className="f-head block text-[11px] mb-1">Producto por producto</span>
          <p className="text-[12px] text-[var(--muted)] mb-3">Ordenado por lo que vendió. La última columna es qué hacer con el precio.</p>
          <div className="divide-y divide-[var(--line)]">
            {[...dispersion].sort((a,b)=>b.venta-a.venta).slice(0,12).map((p)=>{
              const a = accionProducto(p);
              return (
                <div key={p.nombre} className="py-2 flex items-baseline gap-3">
                  <span className="text-[12px] w-4 shrink-0">{a.s}</span>
                  <div className="min-w-0 flex-1">
                    <div className="text-[13px] truncate">{p.nombre}</div>
                    <div className="text-[11px] text-[var(--muted)]">{p.veces} {p.veces===1?"vez":"veces"} · margen {p.pct.toFixed(0)}%</div>
                  </div>
                  <div className="text-right shrink-0">
                    <Monto v={C(p.venta)} className="text-[13px] block" />
                    <span className="text-[11px] text-[var(--muted)]">{a.t}</span>
                  </div>
                </div>
              );
            })}
          </div>
          <p className="text-[11px] text-[var(--muted)] mt-3 leading-relaxed">
            ★ sobre la meta · ○ en meta · ● bajo la meta, subir precio · ◐ falta costo para calcularlo.
          </p>
        </Card>
      )}

      {/* ---------- la evidencia, para el que quiera verificar ---------- */}
      <Btn kind="ghost" className="w-full" onClick={()=>setVerDatos((v)=>!v)}>
        {verDatos ? "Ocultar los datos detrás" : "Ver los datos detrás"}
      </Btn>

      {verDatos && (
        <div className="space-y-4">
          <Card className="p-4">
            <div className="flex justify-between items-baseline mb-2">
              <span className="f-head text-[11px] text-[var(--muted)]">Acumulado contra la meta</span>
              <span className="f-mono text-[12px] text-[var(--muted)]">{vsRitmo>=0 ? "+" : "−"}{C(Math.abs(vsRitmo))} vs ritmo</span>
            </div>
            <GraficoLinea
              series={[
                { nombre: "vendido", puntos: acumulado },
                { nombre: "ritmo", puntos: ritmo, guia: true },
              ]}
              etiquetas={etiquetasDias}
              yMax={Math.max(cfg.meta, ...acumulado) * 1.05}
            />
            <p className="text-[12px] text-[var(--muted)] mt-2 leading-relaxed">
              La línea gruesa es lo vendido acumulado; la punteada es el ritmo para cerrar en {C(cfg.meta)}.
            </p>
          </Card>

          <Card className="p-4">
            <span className="f-head block text-[11px] text-[var(--muted)] mb-1">Qué se vende contra cuánto deja</span>
            <p className="text-[12px] text-[var(--muted)] mb-2">Cada burbuja es un producto. Más a la derecha, más se vendió. Más arriba, mejor margen.</p>
            <GraficoDispersion puntos={dispersion} metaPct={cfg.margenGranel} />
            <p className="text-[12px] text-[var(--muted)] mt-2 leading-relaxed">
              Las huecas están bajo la meta. Las de abajo a la derecha son las de la lista de arriba.
            </p>
          </Card>

          <div className="grid lg:grid-cols-2 gap-4 items-start">
            <Card className="p-4">
              <span className="f-head block text-[11px] text-[var(--muted)] mb-1">Tamaño de las ventas</span>
              <Histograma valores={montos} cortes={CORTES} />
              <p className="text-[12px] text-[var(--muted)] mt-2 leading-relaxed">
                Típico {C(mediana)}, promedio {C(promedio)}.
                {promedio > mediana * 1.4
                  ? " El promedio va arriba del típico: unas pocas ventas grandes lo jalan. Para decidir, usá el típico."
                  : " Se parecen, así que las ventas son parejas."}
              </p>
            </Card>

            <Card className="p-4">
              <span className="f-head block text-[11px] text-[var(--muted)] mb-3">Cómo pagaron</span>
              <Torta partes={pagos} />
            </Card>
          </div>

          <div className="grid lg:grid-cols-2 gap-4 items-start">
            <Card className="p-4">
              <span className="f-head block text-[11px] text-[var(--muted)] mb-2">Qué día conviene más</span>
              {porDiaSemana.map((d)=>{
                const max = Math.max(...porDiaSemana.map((x)=>x.prom), 1);
                return (
                  <div key={d.nombre} className="flex items-center gap-2 py-1">
                    <span className="text-[12px] w-20 shrink-0">{d.nombre}</span>
                    <div className="flex-1 h-3 bg-[rgba(22,33,28,.12)] rounded-sm overflow-hidden">
                      <div className="h-full bg-[var(--ink)]" style={{ width: (d.prom/max*100)+"%" }} />
                    </div>
                    <span className="f-mono text-[11px] w-20 text-right">{C(d.prom)}</span>
                  </div>
                );
              })}
              <p className="text-[12px] text-[var(--muted)] mt-2 leading-relaxed">
                Promedio por día. Sirve para decidir cuándo reforzar y cuándo no vale la pena abrir.
              </p>
            </Card>

            <Card className="p-4">
              <span className="f-head block text-[11px] text-[var(--muted)] mb-2">Señales del mes</span>
              <div className="space-y-1">
                <Linea label="Ventas con cliente anotado" val={`${conNombre} de ${vMes.length} · ${Math.round(captura*100)}%`} />
                <Linea label="Clientes distintos" val={String(clientesMes.size)} />
                <Linea label="Clientes que repitieron" val={String(repiten)} />
                <Linea label="Cobertura de costos reales" val={an.cobertura.toFixed(0)+"%"} />
                <Linea label="Días cerrados de caja" val={`${cierresMes.length} de ${diasConVenta}`} />
                <Linea label={difCaja===0 ? "Caja acumulada" : difCaja>0 ? "Sobrante de caja" : "Faltante de caja"} val={C(Math.abs(difCaja))} />
                <Linea label="Días con venta" val={`${diasConVenta} de ${hastaDia}`} />
                <Linea label="Mejor día del mes" val={mejorDia ? `${mejorDia[0]} · ${C(mejorDia[1])}` : "—"} />
                <Linea label="Salidas registradas" val={`${gMes.length} · ${C(gMes.reduce((a,g)=>a+g.monto,0))}`} />
              </div>
            </Card>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= REPORTES ================= */
function Reportes({ ventas, gastos, precios, fijos, enlaces, cierres, cfg, guardar, borrar, aviso, correo }) {
  const [ajustes, setAjustes] = useState(false);
  const [verEnlaces, setVerEnlaces] = useState(false);
  const [detalle, setDetalle] = useState(false);
  const [mes, setMes] = useState(mesDe(hoyISO()));

  const meses = useMemo(()=>[...new Set([...ventas,...gastos].map((v)=>mesDe(v.fecha)))].sort().reverse(), [ventas,gastos]);
  const delMes = ventas.filter((v)=>mesDe(v.fecha)===mes);
  const gastosMes = normPlata(gastos).filter((g)=>mesDe(g.fecha)===mes);
  const total = delMes.reduce((a,v)=>a+v.monto,0);
  const salidas = gastosMes.reduce((a,g)=>a+g.monto,0);
  const mercaderia = gastosMes.filter((g)=>g.categoria==="Mercadería").reduce((a,g)=>a+g.monto,0);
  const fijosPagados = gastosMes.filter((g)=>g.fijoId).reduce((a,g)=>a+g.monto,0);
  const efectivoNeto = delMes.filter((v)=>v.pago==="Efectivo").reduce((a,v)=>a+v.monto,0) - gastosMes.filter((g)=>g.pago==="Efectivo").reduce((a,g)=>a+g.monto,0);
  const ticket = delMes.length ? total/delMes.length : 0;

  /* ---- costo real por venta ---- */
  const analisis = useMemo(()=>analizarVentas(delMes, precios, enlaces), [delMes, precios, enlaces]);

  /* ganancia: costo real donde se pudo, porcentaje estimado en el resto */
  const G = gananciaDe(analisis, cfg);
  const margenId = G.margenId;
  const gananciaBruta = G.bruta;
  const margenBruto = G.margen;
  const gananciaNeta = gananciaBruta - fijosPagados;

  const totalFijos = fijos.reduce((a,f)=>a+f.monto,0);
  const equilibrio = margenBruto>0 ? totalFijos/(margenBruto/100) : 0;

  const [ay, am] = mes.split("-").map(Number);
  const hoy = new Date(), esMesActual = mes === mesDe(hoyISO());
  const diasMes = new Date(ay, am, 0).getDate();
  const hasta = esMesActual ? hoy.getDate() : diasMes;
  const cuenta = (a,b)=>{ let n=0; for(let d=a; d<=b; d++) if(!(cfg.excluirDomingos && new Date(ay,am-1,d).getDay()===0)) n++; return n; };
  const habT = cuenta(1,hasta), habTotal = cuenta(1,diasMes);
  const promDia = habT ? total/habT : 0, proy = promDia*habTotal;
  const avance = cfg.meta>0 ? (total/cfg.meta)*100 : 0;

  const porPago = PAGOS.map((p)=>({ p, t: delMes.filter((v)=>v.pago===p).reduce((a,v)=>a+v.monto,0) })).filter((x)=>x.t>0);
  const porCat = CATS.map((c)=>({ c, t: gastosMes.filter((g)=>g.categoria===c).reduce((a,g)=>a+g.monto,0) })).filter((x)=>x.t>0).sort((a,b)=>b.t-a.t);

  const porCli = useMemo(()=>{
    const m = {};
    delMes.filter((v)=>v.cliente).forEach((v)=>{ const k = norm(v.cliente); if(!m[k]) m[k]={nombre:v.cliente,veces:0,monto:0}; m[k].veces++; m[k].monto+=v.monto; });
    return Object.values(m).sort((a,b)=>b.monto-a.monto);
  }, [delMes]);

  const porVolver = useMemo(()=>{
    const m = {};
    ventas.filter((v)=>v.cliente).forEach((v)=>{
      const k = norm(v.cliente);
      if (!m[k]) m[k] = { nombre: v.cliente, fechas: [], monto: 0 };
      m[k].fechas.push(v.fecha); m[k].monto += v.monto;
    });
    const hoyStr = hoyISO();
    return Object.values(m)
      .filter((c)=>c.fechas.length >= 2)
      .map((c)=>{
        const f = [...new Set(c.fechas)].sort();
        if (f.length < 2) return null;
        let suma = 0;
        for (let i=1; i<f.length; i++) suma += diasEntre(f[i], f[i-1]);
        const cadencia = Math.round(suma / (f.length-1));
        const ultima = f[f.length-1];
        const desde = diasEntre(hoyStr, ultima);
        return { ...c, compras: f.length, cadencia, ultima, desde, atraso: desde - cadencia, ticket: c.monto/c.fechas.length };
      })
      .filter((c)=>c && c.cadencia >= 5 && c.desde > c.cadencia * 1.25 && c.desde < 180)
      .sort((a,b)=>b.atraso-a.atraso);
  }, [ventas]);

  const porDia = useMemo(()=>{
    const m = {}; delMes.forEach((v)=>(m[v.fecha]=(m[v.fecha]||0)+v.monto));
    const arr = Object.entries(m).sort(); const max = Math.max(...arr.map((x)=>x[1]),1);
    return arr.map(([f,t])=>({ f, t, pct:(t/max)*100 }));
  }, [delMes]);

  const exportar = () => {
    const filas = [["fecha","tipo","detalle","categoria","monto","cliente","pago"],
      ...ventas.map((v)=>[fmtFecha(v.fecha),"Venta",v.producto,"",v.monto,v.cliente||"",v.pago]),
      ...gastos.map((g)=>[fmtFecha(g.fecha),"Salida",g.detalle||"",g.categoria,-g.monto,"",g.pago])];
    const csv = filas.map((r)=>r.map((c)=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const url = URL.createObjectURL(new Blob(["\ufeff"+csv], { type:"text/csv;charset=utf-8;" }));
    const a = document.createElement("a"); a.href = url; a.download = `patas-${hoyISO()}.csv`; a.click(); URL.revokeObjectURL(url);
    aviso("CSV descargado");
  };

  const nomMes = new Date(ay, am-1, 1).toLocaleDateString("es-CR", { month: "long", year: "numeric" });

  const metaDiaria = habTotal > 0 ? cfg.meta / habTotal : 0;

  return (
    <div className="space-y-4">
      {meses.length>1 && (
        <div className="flex gap-2 overflow-x-auto pb-1">
          {meses.map((m)=>(<button key={m} onClick={()=>setMes(m)} className={"px-3 py-1.5 rounded-full border text-xs whitespace-nowrap font-mono " + (mes===m ? "bg-stone-900 text-white border-stone-900" : "bg-white border-stone-300")}>{m}</button>))}
        </div>
      )}

      {/* ---------- FILA DE INDICADORES ---------- */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <KPI k="Vendido" v={C(total)} sub={titulo(nomMes)} oscuro />
        <KPI k="Ganancia del producto" v={C(gananciaBruta)} sub={`${margenBruto.toFixed(0)}% de margen`} />
        <KPI k="Ventas registradas" v={String(delMes.length)} sub={`${C(ticket)} promedio`} />
        <KPI k="Queda después de fijos" v={C(gananciaNeta)} sub={fijosPagados>0 ? `menos ${C(fijosPagados)} pagados` : "sin fijos cargados"} />
      </div>

      {/* ---------- GRÁFICO ---------- */}
      {porDia.length>0 && (
        <Card className="p-4">
          <div className="flex justify-between items-baseline mb-2">
            <span className="text-[11px] uppercase tracking-[0.15em] text-stone-500">Venta día por día</span>
            <span className="font-mono tabular-nums text-[12px] text-stone-500">promedio {C(promDia)}</span>
          </div>
          <GraficoDias datos={porDia} referencia={metaDiaria} />
          <p className="text-[11px] text-stone-500 mt-2">Las barras huecas son los días que quedaron bajo la meta diaria.</p>
        </Card>
      )}

      <div className="grid lg:grid-cols-2 gap-4 items-start">

      {/* ---------- 1. LO ESENCIAL ---------- */}
      <Card className="p-4">
        <div className="text-[11px] uppercase tracking-[0.15em] text-stone-500 mb-3">{titulo(nomMes)}</div>

        <div className="mb-4">
          <div className="text-[11px] text-stone-500">Vendimos</div>
          <div className="font-mono tabular-nums text-3xl font-semibold">{C(total)}</div>
          <div className="text-[12px] text-stone-500">{delMes.length} ventas · {C(ticket)} cada una en promedio</div>
        </div>

        <div className="border-t border-stone-200 pt-3 mb-4">
          <div className="text-[11px] text-stone-500">De eso, la ganancia del producto fue</div>
          <div className="font-mono tabular-nums text-2xl font-semibold">{C(gananciaBruta)}</div>
          <div className="text-[12px] text-stone-500">{margenBruto.toFixed(0)}% de lo vendido · lo demás es lo que costó la comida</div>
        </div>

        <div className="border-t border-stone-200 pt-3">
          <div className="text-[11px] text-stone-500">Menos los gastos fijos que ya se pagaron ({C(fijosPagados)}), quedan</div>
          <div className="font-mono tabular-nums text-2xl font-semibold">{C(gananciaNeta)}</div>
          <div className="text-[12px] text-stone-500">
            {gananciaNeta >= 0 ? "Esto es lo que el negocio generó de verdad este mes." : "El mes va en pérdida: la ganancia no alcanzó para cubrir los fijos."}
          </div>
        </div>
      </Card>

      {/* ---------- 2. CONFIANZA DEL CÁLCULO ---------- */}
      <Card className="p-4">
        <div className="text-[11px] uppercase tracking-[0.15em] text-stone-500 mb-2">Qué tan exacta es esa ganancia</div>
        <div className="space-y-1">
          <Linea label="Con costo real del producto" val={`${C(analisis.ventaId)} · ${analisis.cobertura.toFixed(0)}% de las ventas`} />
          <Linea label="Margen real de esas ventas" val={margenId===null ? "—" : margenId.toFixed(1)+"%"} />
          <Linea label={`Estimado al ${cfg.margenNoIdent != null ? cfg.margenNoIdent : 18}% de margen`} val={C(analisis.sinId)} />
        </div>
        <div className="h-2 bg-stone-200 rounded-full overflow-hidden mt-3 border border-stone-300">
          <div className="h-full bg-stone-900" style={{ width: Math.min(100, analisis.cobertura)+"%" }} />
        </div>
        <p className="text-[12px] text-stone-600 mt-3 leading-relaxed">
          {analisis.cobertura >= 90
            ? "★ Casi todas las ventas están cruzadas con la tabla de costos, así que la ganancia de arriba es confiable."
            : `◐ Quedan ${analisis.sinLista.length} nombres de producto que no calzan con la tabla de precios. Enlazalos y el número de arriba deja de ser una estimación.`}
        </p>
        {analisis.sinLista.length > 0 && (
          <Btn kind="warn" className="w-full mt-3" onClick={()=>setVerEnlaces(true)}>
            Enlazar {analisis.sinLista.length} {analisis.sinLista.length===1 ? "producto" : "productos"}
          </Btn>
        )}
      </Card>

      {/* ---------- 3. META ---------- */}
      <Card className="p-4">
        <div className="flex justify-between items-baseline mb-2">
          <span className="text-[11px] uppercase tracking-[0.15em] text-stone-500">Meta del mes</span>
          <span className="font-mono tabular-nums text-sm">{C(total)} / {C(cfg.meta)}</span>
        </div>
        <div className="h-3 bg-stone-200 rounded-full overflow-hidden border border-stone-300"><div className="h-full bg-stone-900" style={{ width: Math.min(100,avance)+"%" }} /></div>
        <div className="mt-2 font-mono tabular-nums text-sm">{avance.toFixed(0)}% de la meta</div>
        <div className="mt-3 pt-3 border-t border-stone-200 space-y-1">
          <Linea label={`Promedio por día${cfg.excluirDomingos ? " (sin domingos)" : ""}`} val={C(promDia)} />
          <Linea label="Si sigue así, cierra en" val={C(proy)} fuerte />
          {esMesActual && <Linea label="Días de venta que faltan" val={String(habTotal-habT)} />}
        </div>
        {totalFijos>0 && (
          <p className="text-[12px] text-stone-600 mt-3 pt-3 border-t border-stone-200 leading-relaxed">
            Para cubrir los {C(totalFijos)} de gastos fijos con un margen del {margenBruto.toFixed(0)}%, hay que vender <span className="font-medium">{C(equilibrio)}</span> al mes.
            {total >= equilibrio ? ` Ya se pasó por ${C(total-equilibrio)}.` : ` Faltan ${C(equilibrio-total)}.`}
          </p>
        )}
      </Card>

      {/* ---------- 4. GANANCIA POR PRODUCTO ---------- */}
      {analisis.productos.length>0 && (
        <Card className="p-4">
          <div className="text-[11px] uppercase tracking-[0.15em] text-stone-500 mb-1">Cuánto deja cada producto</div>
          <p className="text-[11px] text-stone-500 mb-3">Solo los que están enlazados a la tabla de costos. Ordenados por ganancia.</p>
          {analisis.productos.map((x,i)=>{
            const ix = ind(x.pct, cfg.margenGranel);
            return (
              <div key={i} className="py-2 border-b border-stone-100 last:border-0">
                <div className="flex justify-between text-sm">
                  <span className="font-medium truncate mr-2"><span className="text-stone-500 mr-1.5" title={ix.t}>{ix.s}</span>{x.nombre}</span>
                  <span className="font-mono tabular-nums font-semibold shrink-0">{C(x.gan)}</span>
                </div>
                <div className="flex justify-between text-[11px] text-stone-500 font-mono tabular-nums mt-0.5">
                  <span>{x.veces}× · vendido {C(x.venta)} · costó {C(x.costo)}</span>
                  <span>{x.pct.toFixed(0)}%</span>
                </div>
              </div>
            );
          })}
          <p className="text-[11px] text-stone-500 mt-2">★ sobre la meta de {cfg.margenGranel}% · ○ en meta · ◐ apenas debajo · ● margen muy bajo</p>
        </Card>
      )}

      {/* ---------- 5. CAJA ---------- */}
      <Card className="p-4">
        <div className="text-[11px] uppercase tracking-[0.15em] text-stone-500 mb-2">Movimiento de plata</div>
        <div className="space-y-1">
          <Linea label="Entró por ventas" val={C(total)} />
          <Linea label="Salió en compras y gastos" val={"− " + C(salidas)} />
          <div className="pt-2 mt-1 border-t border-stone-200"><Linea label={total-salidas>=0 ? "Diferencia a favor" : "Diferencia en contra"} val={C(Math.abs(total-salidas))} fuerte /></div>
        </div>
        <div className="mt-3 pt-3 border-t border-stone-200 space-y-1">
          <Linea label="Efectivo generado en el mes" val={C(efectivoNeto)} />
          <Linea label="Se invirtió en mercadería" val={C(mercaderia)} />
        </div>
        <p className="text-[12px] text-stone-600 mt-3 leading-relaxed">
          Esta tarjeta es plata que entró y salió del bolsillo, no ganancia. Un mes que comprás mucha mercadería se ve mal aunque el negocio esté bien, porque esa comida se vende en los meses siguientes. Para saber si ganaron, mirá la primera tarjeta.
        </p>
      </Card>

      {cierres.filter((c)=>mesDe(c.fecha)===mes).length>0 && (
        <Card className="p-4">
          <div className="text-[11px] uppercase tracking-[0.15em] text-stone-500 mb-2">Cuadre de caja</div>
          {(()=>{
            const cs = cierres.filter((c)=>mesDe(c.fecha)===mes).sort((a,b)=>(a.fecha<b.fecha?1:-1));
            const acum = cs.reduce((a,c)=>a+(c.diferencia||0),0);
            const cuadrados = cs.filter((c)=>c.diferencia===0).length;
            return (
              <>
                <div className="space-y-1 mb-3">
                  <Linea label="Días cerrados" val={`${cs.length} · ${cuadrados} cuadraron exacto`} />
                  <Linea label={acum===0 ? "Diferencia acumulada" : acum>0 ? "Sobrante acumulado" : "Faltante acumulado"} val={C(Math.abs(acum))} fuerte />
                </div>
                {cs.slice(0,10).map((c)=>(
                  <div key={c.id} className="flex justify-between py-1 text-[13px] border-b border-stone-100 last:border-0">
                    <span className="font-mono text-stone-600">{fmtFecha(c.fecha)}{c.nota && <span className="text-stone-400"> · {c.nota}</span>}</span>
                    <span className="font-mono tabular-nums">{c.diferencia===0 ? "○ cuadró" : (c.diferencia>0 ? "◐ +" : "● −") + C(Math.abs(c.diferencia))}</span>
                  </div>
                ))}
                <p className="text-[12px] text-stone-600 mt-3 leading-relaxed">
                  Una diferencia suelta es vuelto. Lo que hay que mirar es el acumulado y si siempre falta en los mismos días.
                </p>
              </>
            );
          })()}
        </Card>
      )}

      {porVolver.length>0 && (
        <Card className="p-4">
          <div className="text-[11px] uppercase tracking-[0.15em] text-stone-500 mb-1">Clientes que ya deberían haber vuelto</div>
          <p className="text-[11px] text-stone-500 mb-3">Según cada cuánto compran normalmente. Son {C(porVolver.reduce((a,c)=>a+c.ticket,0))} en compras que no llegaron.</p>
          {porVolver.slice(0,15).map((c,i)=>(
            <div key={i} className="flex justify-between items-baseline py-1.5 border-b border-stone-100 last:border-0">
              <div className="min-w-0">
                <div className="text-sm truncate">{c.nombre}</div>
                <div className="text-[11px] text-stone-500 font-mono">compra cada {c.cadencia} días · última hace {c.desde}</div>
              </div>
              <span className="font-mono tabular-nums text-[12px] shrink-0 ml-2">{c.atraso} días tarde</span>
            </div>
          ))}
          <p className="text-[12px] text-stone-600 mt-3 leading-relaxed">
            Esta es la lista para reactivar por correo o WhatsApp. Se calcula con todo el historial, no solo con este mes.
          </p>
        </Card>
      )}

      </div>

      <button onClick={()=>setDetalle(!detalle)} className="w-full text-center text-[12px] text-stone-600 underline py-1">
        {detalle ? "Ocultar el detalle" : "Ver más detalle (pagos, días, clientes)"}
      </button>

      {detalle && (
        <div className="grid lg:grid-cols-2 gap-4 items-start">
          {porPago.length>0 && (
            <Card className="p-4">
              <div className="text-[11px] uppercase tracking-[0.15em] text-stone-500 mb-2">Cómo pagaron</div>
              {porPago.map((x)=><Linea key={x.p} label={x.p} val={`${C(x.t)} · ${((x.t/total)*100).toFixed(0)}%`} />)}
            </Card>
          )}

          {porCat.length>0 && (
            <Card className="p-4">
              <div className="text-[11px] uppercase tracking-[0.15em] text-stone-500 mb-2">En qué se fue la plata</div>
              {porCat.map((x)=><Linea key={x.c} label={x.c} val={`${C(x.t)} · ${((x.t/salidas)*100).toFixed(0)}%`} />)}
            </Card>
          )}

          {porCli.length>0 && (
            <Card className="p-4">
              <div className="text-[11px] uppercase tracking-[0.15em] text-stone-500 mb-2">Clientes del mes</div>
              {porCli.slice(0,15).map((x,i)=>(
                <div key={i} className="flex justify-between py-1.5 border-b border-stone-100 last:border-0">
                  <span className="text-sm">{x.veces>1 && <span className="text-stone-500 mr-1.5">★</span>}{x.nombre}</span>
                  <span className="font-mono tabular-nums text-[12px]">{x.veces}× · {C(x.monto)}</span>
                </div>
              ))}
              <p className="text-[11px] text-stone-500 mt-2">★ compró más de una vez este mes.</p>
            </Card>
          )}
        </div>
      )}

      <div className="flex gap-2">
        <Btn kind="ghost" className="flex-1" onClick={exportar}>Descargar CSV</Btn>
        <Btn kind="ghost" className="flex-1" onClick={()=>setVerEnlaces(true)}>Enlaces</Btn>
        <Btn kind="ghost" className="flex-1" onClick={()=>setAjustes(true)}>Ajustes</Btn>
      </div>

      <div className="text-center pt-2 pb-4">
        <div className="text-[11px] text-stone-500 mb-2">{correo}</div>
        <button onClick={()=>window.FB.salir()} className="text-[12px] text-stone-600 underline">Cerrar sesión</button>
      </div>

      {ajustes && <AjustesModal cfg={cfg} guardar={guardar} onClose={()=>setAjustes(false)} />}
      {verEnlaces && (
        <EnlacesModal
          sinLista={analisis.sinLista}
          precios={precios}
          enlaces={enlaces}
          guardar={guardar}
          borrar={borrar}
          onClose={()=>setVerEnlaces(false)}
          aviso={aviso}
        />
      )}
    </div>
  );
}

/* ================= ENLACES ================= */
function EnlacesModal({ sinLista, precios, enlaces, guardar, borrar, onClose, aviso }) {
  const [tab, setTab] = useState("pendientes");

  const enlazar = async (texto, productoId) => {
    await guardar("enlaces", { id: norm(texto), texto, productoId, ignorar: false });
    aviso("Enlazado");
  };
  const ignorar = async (texto) => {
    await guardar("enlaces", { id: norm(texto), texto, productoId: "", ignorar: true });
    aviso("Marcado como sin costo");
  };

  return (
    <Modal title="Enlazar productos" onClose={onClose}>
      <div className="grid grid-cols-2 gap-1.5 mb-3">
        {[["pendientes", `Pendientes (${sinLista.length})`],["hechos", `Enlazados (${enlaces.length})`]].map(([id,l])=>(
          <button key={id} onClick={()=>setTab(id)} className={"py-2 rounded-md border text-[12px] " + (tab===id ? "bg-stone-900 text-white border-stone-900" : "bg-white border-stone-300")}>{l}</button>
        ))}
      </div>

      {tab === "pendientes" ? (
        <>
          <p className="text-[13px] text-stone-600 mb-3 leading-relaxed">
            Estos nombres aparecen en las ventas pero no calzan con ningún artículo de Precios. Elegí a cuál corresponde cada uno y queda aprendido para siempre.
          </p>
          {sinLista.length === 0 && <p className="text-sm text-stone-500 text-center py-6">Todo está enlazado. ★</p>}
          {sinLista.map((s)=>{
            const cands = candidatos(s.texto, precios, 3);
            return (
              <div key={s.texto} className="border border-stone-300 rounded-lg p-3 mb-2">
                <div className="flex justify-between items-baseline">
                  <span className="text-sm font-medium">{s.texto}</span>
                  <span className="font-mono tabular-nums text-[11px] text-stone-500">{s.veces}× · {C(s.monto)}</span>
                </div>
                <div className="mt-2 space-y-1">
                  {cands.map(({p, score})=>(
                    <button key={p.id} onClick={()=>enlazar(s.texto, p.id)} className="w-full text-left px-2 py-1.5 rounded-md border border-stone-300 bg-stone-50 active:bg-stone-200 flex justify-between items-center">
                      <span className="text-[13px] truncate mr-2">{p.nombre}</span>
                      <span className="font-mono text-[10px] text-stone-500 shrink-0">{score>=0.8 ? "★" : score>=0.5 ? "○" : "◐"} {(score*100).toFixed(0)}%</span>
                    </button>
                  ))}
                  <select
                    onChange={(e)=>e.target.value && enlazar(s.texto, e.target.value)}
                    defaultValue=""
                    className="w-full px-2 py-1.5 border border-stone-300 rounded-md bg-white text-[13px]"
                  >
                    <option value="">Buscar en toda la lista…</option>
                    {[...precios].sort((a,b)=>a.nombre.localeCompare(b.nombre)).map((p)=><option key={p.id} value={p.id}>{p.nombre}</option>)}
                  </select>
                  <button onClick={()=>ignorar(s.texto)} className="w-full text-[11px] text-stone-500 underline py-1">
                    No es alimento con costo (helado, servicio, otro)
                  </button>
                </div>
              </div>
            );
          })}
        </>
      ) : (
        <>
          {enlaces.length === 0 && <p className="text-sm text-stone-500 text-center py-6">Todavía no hay enlaces guardados.</p>}
          {enlaces.map((e)=>{
            const p = precios.find((x)=>x.id===e.productoId);
            return (
              <div key={e.id} className="flex justify-between items-center py-2 border-b border-stone-100">
                <div className="min-w-0">
                  <div className="text-sm truncate">{e.texto}</div>
                  <div className="text-[11px] text-stone-500 truncate">{e.ignorar ? "Sin costo asignado" : (p ? "→ " + p.nombre : "→ artículo borrado")}</div>
                </div>
                <button onClick={()=>borrar("enlaces", e.id)} className="text-stone-400 text-lg ml-2">×</button>
              </div>
            );
          })}
        </>
      )}
    </Modal>
  );
}

const KPI = ({ k, v, sub, oscuro }) => (
  <div className={"rounded-lg border p-3 lg:p-4 " + (oscuro ? "bg-stone-900 border-stone-900 text-stone-100" : "bg-white border-stone-300")}>
    <div className={"text-[10px] uppercase tracking-wide " + (oscuro ? "text-stone-400" : "text-stone-500")}>{k}</div>
    <div className="font-mono tabular-nums text-xl lg:text-2xl font-semibold mt-0.5 leading-tight">{v}</div>
    {sub && <div className={"text-[11px] mt-0.5 " + (oscuro ? "text-stone-400" : "text-stone-500")}>{sub}</div>}
  </div>
);

const B = ({ k, v, sub, grande }) => (
  <div>
    <div className="text-[10px] uppercase tracking-wide text-stone-500">{k}</div>
    <div className={"font-mono tabular-nums " + (grande ? "text-xl font-semibold" : "text-base")}>{v}</div>
    {sub && <div className="text-[11px] text-stone-500">{sub}</div>}
  </div>
);

function AjustesModal({ cfg, guardar, onClose }) {
  const [f, setF] = useState(cfg);
  return (
    <Modal title="Ajustes" onClose={onClose}>
      <div className="mb-3"><Lbl>Meta de ventas del mes</Lbl><Inp inputMode="decimal" value={f.meta} onChange={(e)=>setF({...f, meta:num(e.target.value)})} className="font-mono" /></div>
      <div className="mb-3">
        <Lbl>Impuesto sobre las compras (%)</Lbl>
        <Inp inputMode="decimal" value={f.impuestoCompras||0} onChange={(e)=>setF({...f, impuestoCompras:num(e.target.value)})} className="font-mono" />
        <p className="text-[11px] text-stone-500 mt-1">Régimen simplificado: el impuesto se calcula sobre las compras, no sobre las ventas. Se aparta en el reparto de fin de mes. Preguntale el factor exacto a tu contador.</p>
      </div>
      <div className="mb-3">
        <Lbl>Margen para ventas sin costo conocido (%)</Lbl>
        <Inp inputMode="decimal" value={f.margenNoIdent != null ? f.margenNoIdent : 18} onChange={(e)=>setF({...f, margenNoIdent:num(e.target.value)})} className="font-mono" />
        <p className="text-[11px] text-stone-500 mt-1">Se usa solo mientras la venta no calce con la tabla de precios. Mejora solo conforme enlacés productos.</p>
      </div>
      <div className="mb-3">
        <Lbl>Saldo del banco al empezar a usar la app</Lbl>
        <Inp inputMode="decimal" value={f.saldoBanco} onChange={(e)=>setF({...f, saldoBanco:num(e.target.value)})} className="font-mono" />
        <p className="text-[11px] text-stone-500 mt-1">Lo que había en la cuenta antes del primer registro. Sobre eso se suman ventas y depósitos.</p>
      </div>
      <div className="mb-3">
        <Lbl>Cuándo cae en la cuenta lo de la tarjeta</Lbl>
        <div className="space-y-1.5">
          {ACREDITA.map(([n,l])=>(
            <button
              key={n}
              onClick={()=>setF({...f, diasTarjeta:n})}
              className={"w-full text-left px-3 py-2 rounded-md border text-[13px] " + ((f.diasTarjeta||0)===n ? "bg-stone-900 text-white border-stone-900" : "bg-white border-stone-300")}
            >
              {(f.diasTarjeta||0)===n ? "○ " : "— "}{l}
            </button>
          ))}
        </div>
        <p className="text-[11px] text-stone-500 mt-1">Se usa al cuadrar el banco, para no comparar plata que todavía no llegó.</p>
      </div>
      <div className="mb-3">
        <Lbl>Fondo fijo en billetes</Lbl>
        <Inp inputMode="decimal" value={f.fondoCaja} onChange={(e)=>setF({...f, fondoCaja:num(e.target.value)})} className="font-mono" />
        <p className="text-[11px] text-stone-500 mt-1">Los billetes que siempre quedan en la caja. Las monedas van aparte y se anotan en cada cierre.</p>
      </div>
      <div className="grid grid-cols-2 gap-3 mb-3">
        <div><Lbl>Margen meta granel (%)</Lbl><Inp inputMode="decimal" value={f.margenGranel} onChange={(e)=>setF({...f, margenGranel:num(e.target.value)})} className="font-mono" /></div>
        <div><Lbl>Margen meta saco (%)</Lbl><Inp inputMode="decimal" value={f.margenSaco} onChange={(e)=>setF({...f, margenSaco:num(e.target.value)})} className="font-mono" /></div>
      </div>
      <div className="mb-3">
        <Lbl>Ganancia sobre el costo (%)</Lbl>
        <Inp inputMode="decimal" value={f.gananciaDef != null ? f.gananciaDef : 20} onChange={(e)=>setF({...f, gananciaDef:num(e.target.value)})} className="font-mono" />
        <p className="text-[11px] text-stone-500 mt-1">Se aplica como costo × (1 + g/100), igual que en la hoja. Cada artículo puede llevar la suya propia en la tabla de Precios.</p>
      </div>
      <div className="mb-3">
        <Lbl>Costo de los artículos</Lbl>
        <p className="text-[11px] text-stone-500 mb-1.5 leading-relaxed">
          ◐ En régimen simplificado esto no se usa: el IVA de las compras no se acredita, así que el costo es siempre el total de la factura.
        </p>
        <div className="grid grid-cols-2 gap-1.5">
          {[[true,"Sin IVA"],[false,"Con IVA"]].map(([v,l])=>(
            <button key={String(v)} onClick={()=>setF({...f, costoSinIVA:v})}
              className={"f-head text-[10px] min-h-[48px] rounded-[8px] border " + ((f.costoSinIVA !== false)===v
                ? "bg-[var(--ink)] text-[#F2F3F0] border-[var(--ink)]"
                : "bg-white text-[var(--ink)] border-[var(--line-strong)]")}>{l}</button>
          ))}
        </div>
        <p className="text-[11px] text-stone-500 mt-1.5 leading-relaxed">
          Criterio único para todas las facturas. Con "Sin IVA", el costo es el neto del XML y la app le quita el IVA al precio de venta antes de calcular el margen, para comparar lo mismo contra lo mismo. Cambiarlo acá no reescribe los costos ya guardados.
        </p>
      </div>
      <div className="mb-3">
        <Lbl>Tarifa de IVA (%)</Lbl>
        <Inp inputMode="decimal" value={f.tarifaIVA != null ? f.tarifaIVA : 13} onChange={(e)=>setF({...f, tarifaIVA:num(e.target.value)})} className="font-mono" />
      </div>
      <div className="mb-3">
        <Lbl>Inventario en bodega al empezar a contarlo</Lbl>
        <Inp inputMode="decimal" value={f.inventarioIni||0} onChange={(e)=>setF({...f, inventarioIni:num(e.target.value)})} className="font-mono" />
        <p className="text-[11px] text-stone-500 mt-1">A precio de costo. Si lo dejás en cero, el contador arranca desde hoy y va a quedar corto unas semanas, hasta que se venda la mercadería vieja.</p>
      </div>
      <div className="grid grid-cols-2 gap-3 mb-3">
        <div>
          <Lbl>Colchón mínimo (% del total)</Lbl>
          <Inp inputMode="decimal" value={f.colchonPctMin != null ? f.colchonPctMin : 10} onChange={(e)=>setF({...f, colchonPctMin:num(e.target.value)})} className="font-mono" />
        </div>
        <div>
          <Lbl>Cuántos socios</Lbl>
          <Inp inputMode="numeric" value={f.socios != null ? f.socios : 2} onChange={(e)=>setF({...f, socios:num(e.target.value)})} className="font-mono" />
        </div>
      </div>
      <div className="mb-3">
        <Lbl>Colchón, en semanas de gastos fijos</Lbl>
        <Inp inputMode="decimal" value={f.semanasColchon != null ? f.semanasColchon : 4} onChange={(e)=>setF({...f, semanasColchon:num(e.target.value)})} className="font-mono" />
        <p className="text-[11px] text-stone-500 mt-1">Plata que se deja quieta y no cuenta como ganancia retirable. Cuatro semanas es un mes de operación pagado por adelantado.</p>
      </div>
      <div className="mb-4">
        <Lbl>Proyección</Lbl>
        <button onClick={()=>setF({...f, excluirDomingos: !f.excluirDomingos})} className="w-full px-3 py-2 border border-stone-300 rounded-md bg-stone-50 text-left text-sm">
          {f.excluirDomingos ? "○" : "—"} Excluir domingos del cálculo
        </button>
      </div>
      <Btn kind="warn" className="w-full py-3" onClick={async ()=>{ await guardar("config", { ...f, id:"general" }); onClose(); }}>Guardar ajustes</Btn>
    </Modal>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
